[package]
name = "wow112-ah-history-terminal"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
serde_json = "1"
wow_login_messages = { version = "=0.5.0", features = ["sync"] }
wow_world_messages = { version = "=0.3.0", features = ["sync", "vanilla"] }
wow_srp = "=0.7.0"

[[bin]]
name = "wow112-ah-history"
path = "main.rs"

