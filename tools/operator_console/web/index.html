<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WoW112 Summon Operator Console</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e9eef5;background:#0e1116}*{box-sizing:border-box}body{margin:0;background:#0e1116}.top{display:flex;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid #2b313c;background:#151a22;position:sticky;top:0}.title{font-size:18px;font-weight:700}.status{margin-left:auto;font-size:13px}.ok{color:#6ee7a8}.bad{color:#ff7979}.warn{color:#ffd166}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 52px)}nav{border-right:1px solid #2b313c;padding:12px;background:#121720}nav button{width:100%;text-align:left;background:none;border:0;color:#b8c2d0;padding:10px 12px;border-radius:7px;cursor:pointer}nav button.active,nav button:hover{background:#222a35;color:#fff}main{padding:18px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;margin-bottom:16px}.card,.panel{background:#151a22;border:1px solid #2b313c;border-radius:10px;padding:14px}.metric{font-size:24px;font-weight:700}.label{font-size:12px;color:#8d99a8}.uncertain{border-color:#d9534f;background:#2b1618}.banner{padding:12px 14px;border:1px solid #d9534f;background:#38181a;color:#ffb2b2;border-radius:8px;margin-bottom:12px;font-weight:700}h2{margin:0 0 12px;font-size:17px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #252c36;vertical-align:top;text-align:left}th{color:#8d99a8;position:sticky;top:0;background:#151a22}.scroll{max-height:62vh;overflow:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,button.cmd{background:#0f141b;color:#e9eef5;border:1px solid #384250;border-radius:6px;padding:8px}.cmd{cursor:pointer}.danger{border-color:#a94442}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-all}.pill{padding:2px 6px;border-radius:999px;background:#273140}.error{color:#ff8e8e}.footer{margin-top:12px;font-size:11px;color:#66717f}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:160px 1fr}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="title">WoW112 · Summon Operator Console</div><span class="pill">Service Adapter V1</span><div class="status" id="svc">connecting…</div></div><div class="layout"><nav id="nav"></nav><main>
<div id="uncertainBanner" class="banner hidden">UNCERTAIN outcomes present — inspect Payments / Debug before operator action.</div>
<section id="Overview"></section><section id="Whispers" class="hidden"></section><section id="WhisperDebug" class="hidden"></section><section id="Queue" class="hidden"></section><section id="Summons" class="hidden"></section><section id="Payments" class="hidden"></section><section id="History" class="hidden"></section><section id="Debug" class="hidden"></section>
</main></div><script>
const tabs=['Overview','Whispers','Whisper Debug','Queue','Summons','Payments','History/Search','Debug/Events/Logs'];const ids={'Whisper Debug':'WhisperDebug','History/Search':'History','Debug/Events/Logs':'Debug'};let snap={};
function money(c){return (c/10000).toFixed(2)+'g'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tabId(t){return ids[t]||t}
const nav=document.getElementById('nav');tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(t);if(i===0)b.className='active';nav.appendChild(b)});function show(t){[...nav.children].forEach((b,i)=>b.classList.toggle('active',tabs[i]===t));tabs.forEach(x=>document.getElementById(tabId(x)).classList.toggle('hidden',x!==t))}
function rows(es,cols){return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${(es||[]).map(e=>`<tr>${cols.map(c=>`<td>${c[1](e)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const basic=[['Time',e=>esc(e.ts_utc)],['Type',e=>esc(e.type)],['Customer',e=>esc(e.customer)],['Destination',e=>esc(e.destination)],['State',e=>esc(e.state)],['Request',e=>esc(e.request_id)]];
async function command(type){const p={type};if(type==='ManualWhisper'){p.session_id=document.getElementById('session')?.value||'';p.customer=document.getElementById('customer')?.value||'';p.text=document.getElementById('text')?.value||'';}const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json();document.getElementById('cmdResult').textContent=r.ok?`sent ${j.command_id||''}`:`ERROR: ${j.error}`}
async function searchHistory(){const c=document.getElementById('searchCustomer').value.trim();const r=await fetch('/api/history?customer='+encodeURIComponent(c));const j=await r.json();document.getElementById('historyRows').innerHTML=rows(j.events,basic.concat([['Amount',e=>money(e.amount_copper)]]))}
function render(){const s=snap,svc=s.service||{};document.getElementById('svc').innerHTML=svc.connected?'<span class="ok">● service connected</span>':'<span class="bad">● service disconnected</span>';document.getElementById('uncertainBanner').classList.toggle('hidden',!(s.uncertain>0));
Overview.innerHTML=`<div class="cards">${[['Service',svc.connected?'ONLINE':'OFFLINE'],['Uptime',s.adapter_uptime_seconds+'s'],['Sessions',s.sessions],['Reconnects',s.reconnects],['Queue',s.queue_depth??0],['Active summon',s.active_summon?`${s.active_summon.customer} → ${s.active_summon.destination}`:'—'],['Revenue',money(s.revenue_copper||0)],['Unpaid',s.unpaid],['UNCERTAIN',s.uncertain]].map((x,i)=>`<div class="card ${i===8&&s.uncertain?'uncertain':''}"><div class="label">${x[0]}</div><div class="metric">${esc(x[1])}</div></div>`).join('')}</div><div class="grid2"><div class="panel"><h2>Operator commands</h2><div class="toolbar"><button class="cmd" onclick="command('Pause')">Pause</button><button class="cmd" onclick="command('Resume')">Resume</button></div><div class="toolbar"><input id="session" placeholder="session_id (required)"><input id="customer" placeholder="customer (required)"><input id="text" style="min-width:320px" placeholder="ManualWhisper text"><button class="cmd" onclick="command('ManualWhisper')">ManualWhisper</button></div><div id="cmdResult" class="mono"></div></div><div class="panel"><h2>Connector</h2><div class="mono">${esc(JSON.stringify(svc,null,2))}</div></div></div>`;
Whispers.innerHTML='<div class="panel"><h2>Whispers + canonical parser decision</h2>'+rows(s.whispers,basic.concat([['Raw',e=>esc(e.metadata?.text||e.metadata?.raw||'')]]))+'</div>';
WhisperDebug.innerHTML='<div class="panel"><h2>Whisper Debug — no reinterpretation</h2>'+rows((s.whispers||[]).filter(e=>e.type==='ParserDecision'),[['Time',e=>esc(e.ts_utc)],['Customer',e=>esc(e.customer)],['Raw',e=>esc(e.metadata?.raw)],['Normalized',e=>esc(e.metadata?.normalized)],['Result',e=>esc(e.metadata?.result)],['Reason',e=>esc(e.metadata?.reason)],['Metadata',e=>'<span class="mono">'+esc(JSON.stringify(e.metadata))+'</span>']])+'</div>';
Queue.innerHTML='<div class="panel"><h2>Queue</h2>'+rows(s.queue,basic)+'</div>';Summons.innerHTML='<div class="panel"><h2>Summons</h2>'+rows(s.summons,basic)+'</div>';Payments.innerHTML='<div class="panel"><h2>Payments</h2>'+rows(s.payments,basic.concat([['Amount',e=>money(e.amount_copper)],['Correlation',e=>esc(e.correlation_id)]]))+'</div>';
History.innerHTML=`<div class="panel"><h2>History / Search</h2><div class="toolbar"><input id="searchCustomer" placeholder="exact customer nick"><button class="cmd" onclick="searchHistory()">Search</button></div><div id="historyRows"></div></div>`;
Debug.innerHTML='<div class="panel"><h2>Debug / Events / Logs</h2>'+rows(s.events,[['Seq',e=>esc(e.seq)],...basic,['Severity',e=>esc(e.severity)],['Metadata',e=>'<span class="mono">'+esc(JSON.stringify(e.metadata))+'</span>']])+'</div><div class="footer">Bounded rendering: max 250 recent rows. Durable SQLite history is independent from the browser session.</div>'}
async function tick(){try{const r=await fetch('/api/snapshot',{cache:'no-store'});snap=await r.json();render()}catch(e){document.getElementById('svc').innerHTML='<span class="bad">● adapter offline</span>'}}tick();setInterval(tick,1000);
</script></body></html>
