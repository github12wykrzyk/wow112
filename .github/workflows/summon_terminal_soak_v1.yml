name: Summon Terminal Soak V1 Quality

on:
  push:
    branches: [ 'feature/summon-terminal-soak-v1' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rust production headless tests
        shell: pwsh
        working-directory: probes/Wow112HeadlessAndroid
        run: cargo test --all-targets --verbose
      - name: Harness tests
        shell: pwsh
        run: python -m unittest tools/summon_terminal_soak/test_harness.py -v
      - name: Quality evidence
        shell: pwsh
        run: python tools/summon_terminal_soak/harness.py --quality-only
      - name: Scope guard
        shell: pwsh
        run: |
          $base='a5ee048c620c55542460d54d7750e81f0f8f8da4'
          git fetch --depth=1 origin $base
          $changed=git diff --name-only "$base..$env:GITHUB_SHA"
          $bad=$changed | Where-Object { $_ -like 'src/AddOns/*' -or $_ -like 'tools/operator_console/*' -or $_ -like 'packaging/*' }
          if($bad){$bad | Write-Error; exit 1}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summon-terminal-soak-quality-${{ github.sha }}
          path: tools/summon_terminal_soak/runs/**
          if-no-files-found: error
