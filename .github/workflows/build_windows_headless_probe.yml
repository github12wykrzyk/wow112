name: Build Windows WoW112 headless portal

on:
  workflow_dispatch:
  push:
    branches:
      - parallel
      - feature/native-windows-portal-clicker-v1
      - feature/summon-service-core-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/**'
      - '.github/workflows/build_windows_headless_probe.yml'

permissions:
  contents: read

concurrency:
  group: build-windows-wow112-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Native Windows realm-list guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/Wow112HeadlessAndroid/src/main.rs'
          $text = Get-Content $path -Raw
          $old = @'
              let realm = realms
                  .realms
                  .get(realm_index)
                  .ok_or_else(|| format!("WOW112_REALM_INDEX={realm_index} is out of range"))?;
          '@
          $new = @'
              let effective_realm_index = if realm_index < realms.realms.len() {
                  realm_index
              } else if realms.realms.len() == 1 {
                  println!("[AUTH] configured realm index {} unavailable; single-realm fallback -> 0", realm_index);
                  0
              } else {
                  return Err(format!("WOW112_REALM_INDEX={realm_index} is out of range for {} realms", realms.realms.len()));
              };
              let realm = &realms.realms[effective_realm_index];
          '@
          if (-not $text.Contains($old.Trim())) { throw 'Expected realm-index selection block not found' }
          $text = $text.Replace($old.Trim(), $new.Trim())
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Native Windows cooperative stop control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/Wow112HeadlessAndroid/src/world_portal.rs'
          $text = Get-Content $path -Raw
          $old = @'
              loop {
                  if deadline.is_some_and(|value| Instant::now() >= value) {
          '@
          $new = @'
              loop {
                  if let Ok(stop_file) = env::var("WOW112_STOP_FILE") {
                      let stop_file = stop_file.trim();
                      if !stop_file.is_empty() && std::path::Path::new(stop_file).exists() {
                          println!("[CONTROL] STOP requested file={stop_file}");
                          let _ = stream.shutdown(std::net::Shutdown::Both);
                          let _ = stream.set_read_timeout(previous_timeout);
                          return Ok(());
                      }
                  }
                  if deadline.is_some_and(|value| Instant::now() >= value) {
          '@
          if (-not $text.Contains($old.Trim())) { throw 'Expected portal loop anchor not found' }
          $text = $text.Replace($old.Trim(), $new.Trim())
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Host compile check
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml

      - name: Build native Windows x86 executables
        shell: pwsh
        run: cargo build --release --bins --target i686-pc-windows-msvc --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml

      - name: Verify and stage Windows service bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'probes/Wow112HeadlessAndroid/target/i686-pc-windows-msvc/release'
          $out = 'dist/windows-headless-portal'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $required = @{
            'wow112-headless-android-probe.exe' = 'wow112-headless-windows.exe'
            'summon_service_helper.exe' = 'summon_service_helper.exe'
            'summon_service_ctl.exe' = 'summon_service_ctl.exe'
            'summon_service_history.exe' = 'summon_service_history.exe'
            'summon_service_report.exe' = 'summon_service_report.exe'
          }
          foreach ($entry in $required.GetEnumerator()) {
            $src = Join-Path $release $entry.Key
            if (-not (Test-Path $src)) { throw "Required Windows binary not found: $src" }
            Copy-Item $src (Join-Path $out $entry.Value) -Force
          }

          @'
          import hashlib, struct
          from pathlib import Path
          root = Path(r'dist/windows-headless-portal')
          names = [
              'wow112-headless-windows.exe',
              'summon_service_helper.exe',
              'summon_service_ctl.exe',
              'summon_service_history.exe',
              'summon_service_report.exe',
          ]
          for name in names:
              p = root / name
              data = p.read_bytes()
              if data[:2] != b'MZ':
                  raise SystemExit(f'{name}: not PE/MZ')
              pe = struct.unpack_from('<I', data, 0x3C)[0]
              if data[pe:pe+4] != b'PE\0\0':
                  raise SystemExit(f'{name}: missing PE signature')
              machine = struct.unpack_from('<H', data, pe + 4)[0]
              if machine != 0x014C:
                  raise SystemExit(f'{name}: expected x86 PE machine 0x014C, got 0x{machine:04X}')
              print(f'{name}: PE32 x86 verified bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          '@ | python -

          $main = Join-Path $out 'wow112-headless-windows.exe'
          $helper = Join-Path $out 'summon_service_helper.exe'
          $mainSha = (Get-FileHash -Algorithm SHA256 $main).Hash.ToLowerInvariant()
          $helperSha = (Get-FileHash -Algorithm SHA256 $helper).Hash.ToLowerInvariant()
          @"
          POC=WINDOWS-PORTAL-02
          PRODUCT=SUMMON_SERVICE_V1
          REPOSITORY=${{ github.repository }}
          BRANCH=${{ github.ref_name }}
          EXACT_SHA=${{ github.sha }}
          WORKFLOW_RUN_ID=${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT=${{ github.run_attempt }}
          TARGET=i686-pc-windows-msvc
          SUMMONER_BINARY=wow112-headless-windows.exe
          SUMMONER_BINARY_SHA256=$mainSha
          HELPER_BINARY=summon_service_helper.exe
          HELPER_BINARY_SHA256=$helperSha
          TOOL_BINARIES=summon_service_ctl.exe,summon_service_history.exe,summon_service_report.exe
          PORTAL_BACKEND=windows-native-v2-stop-safe
          "@ | Set-Content -Path (Join-Path $out 'BUILD_INFO.txt') -Encoding ascii

          Push-Location $out
          try {
            $lines = @()
            foreach ($name in @(
              'wow112-headless-windows.exe',
              'summon_service_helper.exe',
              'summon_service_ctl.exe',
              'summon_service_history.exe',
              'summon_service_report.exe',
              'BUILD_INFO.txt'
            )) {
              $sha = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
              $lines += "$sha  $name"
            }
            $lines | Set-Content -Path 'SHA256SUMS.txt' -Encoding ascii
          } finally { Pop-Location }

      - name: Upload Windows service bundle
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Windows-Headless-Portal-${{ github.sha }}
          path: dist/windows-headless-portal
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
