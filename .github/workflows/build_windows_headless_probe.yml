name: Build Windows WoW112 headless portal

on:
  workflow_dispatch:
  push:
    branches:
      - parallel
      - feature/native-windows-portal-clicker-v1
      - cleanup/terminal-win-fixed-master-canonical-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/**'
      - '.github/workflows/build_windows_headless_probe.yml'

permissions:
  contents: read

concurrency:
  group: build-windows-wow112-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Native Windows realm-list guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/Wow112HeadlessAndroid/src/main.rs'
          $text = Get-Content $path -Raw
          $old = @'
              let realm = realms
                  .realms
                  .get(realm_index)
                  .ok_or_else(|| format!("WOW112_REALM_INDEX={realm_index} is out of range"))?;
          '@
          $new = @'
              let effective_realm_index = if realm_index < realms.realms.len() {
                  realm_index
              } else if realms.realms.len() == 1 {
                  println!("[AUTH] configured realm index {} unavailable; single-realm fallback -> 0", realm_index);
                  0
              } else {
                  return Err(format!("WOW112_REALM_INDEX={realm_index} is out of range for {} realms", realms.realms.len()));
              };
              let realm = &realms.realms[effective_realm_index];
          '@
          if (-not $text.Contains($old.Trim())) { throw 'Expected realm-index selection block not found' }
          $text = $text.Replace($old.Trim(), $new.Trim())
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Native Windows cooperative stop control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/Wow112HeadlessAndroid/src/world_portal.rs'
          $text = Get-Content $path -Raw
          $old = @'
              loop {
                  if deadline.is_some_and(|value| Instant::now() >= value) {
          '@
          $new = @'
              loop {
                  if let Ok(stop_file) = env::var("WOW112_STOP_FILE") {
                      let stop_file = stop_file.trim();
                      if !stop_file.is_empty() && std::path::Path::new(stop_file).exists() {
                          println!("[CONTROL] STOP requested file={stop_file}");
                          let _ = stream.shutdown(std::net::Shutdown::Both);
                          let _ = stream.set_read_timeout(previous_timeout);
                          return Ok(());
                      }
                  }
                  if deadline.is_some_and(|value| Instant::now() >= value) {
          '@
          if (-not $text.Contains($old.Trim())) { throw 'Expected portal loop anchor not found' }
          $text = $text.Replace($old.Trim(), $new.Trim())
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Verify canonical fixed-master source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'probes/Wow112HeadlessAndroid/src/world_portal.rs'
          $text = Get-Content $path -Raw
          foreach ($needle in @(
            'const CMSG_GROUP_INVITE_OPCODE: u32 = 0x006E;',
            'const SMSG_PARTY_COMMAND_RESULT_OPCODE: u16 = 0x007F;',
            'player_name.eq_ignore_ascii_case("hyjalonee")',
            'Some("Bolthyjal")',
            '[PARTY-RESULT] operation={}'
          )) {
            if (-not $text.Contains($needle)) { throw "Canonical fixed-master source missing: $needle" }
          }
          if ($text.Contains('use wow_world_messages::vanilla::CMSG_GROUP_INVITE;')) {
            throw 'Typed CMSG_GROUP_INVITE path unexpectedly restored'
          }
          Write-Host 'Canonical fixed-master source verified; no CI source rewrite required.'

      - name: Terminal Windows direct-connect recovery defaults
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Proven stable TERMINAL WIN startup path: direct auth/world endpoints by default.
          # Selector probing remains available through explicit environment opt-in.
          $authPath = 'probes/Wow112HeadlessAndroid/src/auth_endpoint.rs'
          $auth = Get-Content $authPath -Raw
          $authOld = '        Err(_) => cfg!(windows),'
          $authNew = '        Err(_) => false,'
          if (-not $auth.Contains($authOld)) { throw 'Expected auth selector default anchor not found' }
          $auth = $auth.Replace($authOld, $authNew)
          Set-Content -Path $authPath -Value $auth -Encoding UTF8

          $worldPath = 'probes/Wow112HeadlessAndroid/src/world_endpoint.rs'
          $world = Get-Content $worldPath -Raw
          $worldOld = '        Err(_) => true,'
          $worldNew = '        Err(_) => false,'
          if (-not $world.Contains($worldOld)) { throw 'Expected world selector default anchor not found' }
          $world = $world.Replace($worldOld, $worldNew)
          Set-Content -Path $worldPath -Value $world -Encoding UTF8

          if (($auth | Select-String -SimpleMatch 'Err(_) => cfg!(windows),') -or
              ($world | Select-String -SimpleMatch 'Err(_) => true,')) {
            throw 'Selector recovery patch did not fully apply'
          }
          Write-Host 'TERMINAL WIN recovery: auth selector default OFF; world selector default OFF; explicit env opt-in preserved.'

      - name: Host compile check
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml

      - name: Build native Windows x86 executable
        shell: pwsh
        run: cargo build --release --target i686-pc-windows-msvc --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml

      - name: Verify and stage Windows portal bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'probes/Wow112HeadlessAndroid/target/i686-pc-windows-msvc/release/wow112-headless-android-probe.exe'
          if (-not (Test-Path $src)) { throw "Native worker not found: $src" }
          $out = 'dist/windows-headless-portal'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dst = Join-Path $out 'wow112-headless-windows.exe'
          Copy-Item $src $dst -Force

          @'
          import hashlib, struct
          from pathlib import Path
          p = Path(r'dist/windows-headless-portal/wow112-headless-windows.exe')
          data = p.read_bytes()
          if data[:2] != b'MZ':
              raise SystemExit('native worker is not PE/MZ')
          pe = struct.unpack_from('<I', data, 0x3C)[0]
          if data[pe:pe+4] != b'PE\0\0':
              raise SystemExit('native worker missing PE signature')
          machine = struct.unpack_from('<H', data, pe + 4)[0]
          if machine != 0x014C:
              raise SystemExit(f'expected x86 PE machine 0x014C, got 0x{machine:04X}')
          print(f'PE32 x86 verified, bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          '@ | python -

          $binSha = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          @"
          POC=WINDOWS-PORTAL-02
          REPOSITORY=${{ github.repository }}
          BRANCH=${{ github.ref_name }}
          EXACT_SHA=${{ github.sha }}
          WORKFLOW_RUN_ID=${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT=${{ github.run_attempt }}
          TARGET=i686-pc-windows-msvc
          BINARY=wow112-headless-windows.exe
          BINARY_SHA256=$binSha
          PORTAL_BACKEND=windows-native-v2-stop-safe
          AUTH_SELECTOR_DEFAULT=off
          WORLD_SELECTOR_DEFAULT=off
          PARTY_INVITE_HARDENING=canonical-source-raw-006e-retry-preserve-v3
          "@ | Set-Content -Path (Join-Path $out 'BUILD_INFO.txt') -Encoding ascii

          Push-Location $out
          try {
            $lines = @()
            foreach ($name in @('wow112-headless-windows.exe','BUILD_INFO.txt')) {
              $sha = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
              $lines += "$sha  $name"
            }
            $lines | Set-Content -Path 'SHA256SUMS.txt' -Encoding ascii
          } finally { Pop-Location }

      - name: Upload Windows portal bundle
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Windows-Headless-Portal-${{ github.sha }}
          path: dist/windows-headless-portal
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
