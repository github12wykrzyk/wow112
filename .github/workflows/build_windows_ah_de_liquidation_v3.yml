name: WoW112 AH DE Liquidation V3.1 Windows

on:
  push:
    branches: [dev/windows-ah-de-liquidation-v3]
    paths:
      - 'probes/Wow112HeadlessAndroid/**'
      - '.github/workflows/build_windows_ah_de_liquidation_v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ah-de-v31-${{ github.ref }}
  cancel-in-progress: true

env:
  DE_CACHE_DIR: probes/Wow112HeadlessAndroid/.ci-cache/de
  DE_CACHE_EPOCH: '1'
  CARGO_CACHE_EPOCH: '1'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout liquidation V3.1 source
        uses: actions/checkout@v4

      - name: Runner toolchain proof
        shell: pwsh
        run: |
          rustc --version --verbose
          cargo --version

      - name: Restore deterministic DE cache
        id: de-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DE_CACHE_DIR }}
          key: de-full-${{ env.DE_CACHE_EPOCH }}-${{ hashFiles('probes/Wow112HeadlessAndroid/tools/build_de_cache_poc08_e0.py', 'probes/Wow112HeadlessAndroid/tools/v52_seed_cache.csv', 'probes/Wow112HeadlessAndroid/tools/poc08_live_item_ids_20261005.txt', 'probes/Wow112HeadlessAndroid/tools/poc08_de_cache_to_rust_provenance.py') }}

      - name: Restore Cargo warm build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            probes/Wow112HeadlessAndroid/target
          key: cargo-win-${{ env.CARGO_CACHE_EPOCH }}-${{ hashFiles('probes/Wow112HeadlessAndroid/Cargo.lock', 'probes/Wow112HeadlessAndroid/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-win-${{ env.CARGO_CACHE_EPOCH }}-${{ hashFiles('probes/Wow112HeadlessAndroid/Cargo.lock', 'probes/Wow112HeadlessAndroid/Cargo.toml') }}-

      - name: Fast cache-aware V3.1 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DE_CACHE_INPUT_HASH: ${{ hashFiles('probes/Wow112HeadlessAndroid/tools/build_de_cache_poc08_e0.py', 'probes/Wow112HeadlessAndroid/tools/v52_seed_cache.csv', 'probes/Wow112HeadlessAndroid/tools/poc08_live_item_ids_20261005.txt', 'probes/Wow112HeadlessAndroid/tools/poc08_de_cache_to_rust_provenance.py') }}
        run: |
          & 'probes/Wow112HeadlessAndroid/tools/ci_build_de_v31.ps1'

      - name: Upload liquidation V3.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-AH-DE-LIQUIDATION-V31-WINDOWS-${{ github.sha }}
          path: dist/windows-ah-de-liquidation-v31
          if-no-files-found: error
          retention-days: 14
