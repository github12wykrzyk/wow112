name: TELE-06A Windows live ritual bundle

on:
  push:
    branches:
      - feature/tele06a-windows-ritual-live-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Ritual contract tests
        shell: pwsh
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime
      - name: Check acceptor
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime
      - name: Check summoner
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime
      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime
      - name: Startup smoke
        shell: pwsh
        run: |
          $bins = @(
            'probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe',
            'probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe'
          )
          foreach ($exe in $bins) {
            $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:TEMP\tele06a.out" -RedirectStandardError "$env:TEMP\tele06a.err"
            $text = (Get-Content "$env:TEMP\tele06a.out" -Raw -ErrorAction SilentlyContinue) + (Get-Content "$env:TEMP\tele06a.err" -Raw -ErrorAction SilentlyContinue)
            if ($p.ExitCode -ne 2) { throw "expected fail-fast rc=2 without credentials for $exe, got $($p.ExitCode)" }
            if ($text -notmatch 'missing WOW112_ACCOUNT') { throw "unexpected startup smoke output for $exe : $text" }
          }
          Write-Host 'TELE06A WINDOWS STARTUP SMOKE PASS'
      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe dist/tele06a_acceptor_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe dist/tele06a_ritual_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/windows/TELE06A_LIVE_4ACCOUNT.ps1 dist/TELE06A_LIVE_4ACCOUNT.ps1
          Copy-Item probes/Wow112HeadlessAndroid/windows/RUN_TELE06A_LIVE.cmd dist/RUN_TELE06A_LIVE.cmd
          @"
          WoW112 TELE-06A Windows Native Live Ritual Cast
          Branch: $env:GITHUB_REF_NAME
          SHA: $env:GITHUB_SHA
          Tests: ritual wire contract + acceptor check + summoner check + startup smoke

          Roles / defaults:
          CUSTOMER  octowar1 / Smokinpole
          SUMMONER  taxi3 / Feltaxi
          SLAVE1    octowinter1 / Winterone
          SLAVE2    octowinter2 / Wintertwoo

          Safety:
          - stale group reset is one-shot
          - invite batch is one-shot
          - Ritual of Summoning spell 698 cast is one-shot
          - mutation guards commit before socket I/O
          - reconnect never retries uncertain reset/invite/cast mutations
          - portal use is disabled in TELE-06A
          - shard precheck is not yet local; server outcome is authoritative for this probe
          "@ | Set-Content -Encoding UTF8 dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WoW112_TELE06A_WINDOWS_RITUAL_LIVE
          path: dist/*
          if-no-files-found: error
