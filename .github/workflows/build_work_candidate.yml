name: Build work candidate

on:
  push:
    branches:
      - work
      - parallel
    # Every branch HEAD must have a corresponding verified candidate. The builder
    # skips unchanged native modules and packages exact runtime bytes for doc-only commits.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-work-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: windows-2022
    steps:
      - name: Checkout current work tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Parallel GUI Win32 ABI before native build
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          python tools/verify_parallel_gui_abi.py
          if ($LASTEXITCODE -ne 0) { throw "Parallel GUI Win32 ABI preflight failed" }

      - name: Check Parallel GUI behavioral contract
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          python tools/verify_parallel_gui_contract.py
          if ($LASTEXITCODE -ne 0) { throw "Parallel GUI behavioral contract failed" }

      - name: Audit registered Parallel DLL hook ownership and arbitration
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          python tools/verify_parallel_dependency_registry.py
          if ($LASTEXITCODE -ne 0) { throw "Parallel DLL conflict audit failed" }

      - name: Validate declarative Parallel candidate inventory
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          python tools/verify_parallel_candidate_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "Parallel candidate manifest validation failed" }

      - name: Fail closed on unapproved candidate source drift
        shell: pwsh
        run: |
          python tools/verify_candidate_source_scope.py
          if ($LASTEXITCODE -ne 0) { throw "candidate source-fingerprint scope failed" }

      - name: Build changed active modules and package candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '${{ github.event.before }}'
          if (-not $base -or $base -match '^0+$') {
            $base = (git rev-parse HEAD^)
          }
          python tools/build_changed_active.py `
            --base "$base" `
            --package-unchanged `
            --output-dir build `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json
          if ($LASTEXITCODE -ne 0) { throw "candidate build failed" }

      - name: Full active-stack build/package audit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          python tools/build_changed_active.py `
            --all `
            --output-dir build `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json
          if ($LASTEXITCODE -ne 0) { throw "full active-stack audit failed" }

      - name: Build and append WoWControlHub when present
        if: github.ref_name != 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/WoWControlHub/WoWControlHub_v2.c') {
            python tools/build_controlhub_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/controlhub_build.json `
              --output build/WoWControlHub.dll
            if ($LASTEXITCODE -ne 0) { throw "ControlHub candidate failed" }
          }

      - name: Build and append AutoPoisons when present
        if: github.ref_name != 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/AutoPoisons/WoWAutoPoisons_5875_v1.c') {
            python tools/build_autopoisons_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/autopoisons_build.json `
              --output build/WoWAutoPoisons_5875_v1.dll
            if ($LASTEXITCODE -ne 0) { throw "AutoPoisons candidate failed" }
          }

      - name: Build and append AutoKick V3 when present
        if: github.ref_name != 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/AutoKick/WoWAutoKick_5875_v3_SAFE_GUI.c') {
            python tools/build_autokick_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/autokick_build.json `
              --output build/WoWAutoKick_5875_v3_SAFE_GUI.dll
            if ($LASTEXITCODE -ne 0) { throw "AutoKick V3 candidate failed" }
          }

      - name: Build and append GroundTarget Assist when present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/GroundTargetAssist/WoWGroundTargetAssist_5875_v1.c') {
            python tools/build_groundtargetassist_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/groundtargetassist_build.json `
              --output build/WoWGroundTargetAssist_5875_v1.dll
            if ($LASTEXITCODE -ne 0) { throw "GroundTarget Assist candidate failed" }
          }

      - name: Build and append WSG AutoFlag on work and parallel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/AutoFlagWSG/WoWAutoFlagWSG_5875_v1.c') {
            python tools/build_autoflagwsg_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/autoflagwsg_build.json `
              --output build/WoWAutoFlagWSG_5875_v1.dll
            if ($LASTEXITCODE -ne 0) { throw "WSG AutoFlag candidate failed" }
          }

      - name: Build and append AutoSummon Assist when present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/AutoSummonAssist/WoWAutoSummonAssist_5875_v1.c') {
            python tools/build_autosummonassist_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/autosummonassist_build.json `
              --output build/WoWAutoSummonAssist_5875_v1.dll
            if ($LASTEXITCODE -ne 0) { throw "AutoSummon Assist candidate failed" }
          }

      - name: Build and append AutoLogin Bridge when present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/AutoLoginBridge/WoWAutoLoginBridge_5875_v1.c') {
            python tools/build_autologinbridge_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/autologinbridge_build.json `
              --output build/WoWAutoLoginBridge_5875_v1.dll
            if ($LASTEXITCODE -ne 0) { throw "AutoLogin Bridge candidate failed" }
          }

      - name: Build and append Opener UI Recovery when present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/OpenerUIRecovery/WoWOpenerUIRecovery_5875_v1.c') {
            python tools/build_openeruirecovery_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/openeruirecovery_build.json `
              --output build/WoWOpenerUIRecovery_5875_v1.dll
            if ($LASTEXITCODE -ne 0) { throw "Opener UI Recovery candidate failed" }
          }

      - name: Build and append observer WoWDiagHub when present
        if: github.ref_name != 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/WoWDiagHub/WoWDiagHub_5875_v1.c') {
            python tools/build_diaghub_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/diaghub_build.json `
              --output build/WoWDiagHub.dll
            if ($LASTEXITCODE -ne 0) { throw "DiagHub candidate failed" }
          }

      - name: Build and append Taxi Flight observer
        if: github.ref_name != 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'src/TaxiFlight/WoWTaxiFlightProbe_5875_v1.c') {
            python tools/build_taxiflight_probe_candidate.py `
              --package dist/WoW112_WORK_CANDIDATE.zip `
              --package-metadata dist/candidate_metadata.json `
              --summary dist/candidate_summary.json `
              --build-metadata dist/taxiflight_build.json `
              --output build/WoWTaxiFlightProbe_5875_v1.dll
            if ($LASTEXITCODE -ne 0) { throw "Taxi Flight observer candidate failed" }
          }

      - name: Build and replace Parallel Rogue MovementCore (v21 + Rear360)
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_rogue_movement_candidate.py `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json `
            --build-metadata dist/rogue_movement_build.json `
            --output build/MovementCore_V68_MINING_HARDLOS_COMBAT_AUTOPP_F11_BLACKLIST_HARDLOS3D_REARONLY_RETRY.dll
          if ($LASTEXITCODE -ne 0) { throw "Consolidated Rogue MovementCore candidate failed" }

      - name: Build and append Parallel Auto WotF
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_autowotf_candidate.py `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json `
            --build-metadata dist/autowotf_build.json `
            --output build/WoWAutoWotF_5875_v1.dll
          if ($LASTEXITCODE -ne 0) { throw "Auto WotF candidate failed" }

      - name: Build and append Parallel native cast observer
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_castobserver_candidate.py `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json `
            --build-metadata dist/castobserver_build.json `
            --output build/WoWCastObserver_5875_v1.dll
          if ($LASTEXITCODE -ne 0) { throw "Parallel CastObserver build/package failed" }

      - name: Build and append Parallel AH native throttle diagnostic
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_ahthrottle_native_candidate.py `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json `
            --build-metadata dist/ahthrottle_native_build.json `
            --output build/WoWAHThrottleNative_5875_v2.dll
          if ($LASTEXITCODE -ne 0) { throw "Parallel AH native throttle diagnostic build/package failed" }

      - name: Build and append Parallel Character Switch diagnostic
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_characterswitchdiag_candidate.py `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json `
            --build-metadata dist/characterswitchdiag_build.json `
            --output build/WoWCharacterSwitchDiag_5875_v1.dll
          if ($LASTEXITCODE -ne 0) { throw "Parallel CharacterSwitchDiag build/package failed" }

      - name: Patch Parallel TEST EXE farclip ceiling 777 to 1554
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          python tools/patch_farclip_candidate.py `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json `
            --report dist/farclip_patch.json
          if ($LASTEXITCODE -ne 0) { throw "Parallel farclip EXE patch failed" }

      - name: Final fail-closed runnable ZIP gate
        shell: pwsh
        run: |
          python tools/verify_candidate_package.py `
            --package dist/WoW112_WORK_CANDIDATE.zip `
            --package-metadata dist/candidate_metadata.json `
            --summary dist/candidate_summary.json `
            --report dist/final_package_verification.json `
            --finalize
          if ($LASTEXITCODE -ne 0) { throw "final package verification failed" }

      - name: Build and verify real-movement Rogue AutoRear PvE variant
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_rogue_auto_rear_candidate.py --sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "real-movement Rogue AutoRear build failed" }
          python tools/verify_candidate_package.py `
            --package dist/WoW112_PARALLEL_ROGUE_AUTO_REAR.zip `
            --package-metadata dist/rogue_auto_rear_metadata.json `
            --summary dist/rogue_auto_rear_summary.json `
            --report dist/rogue_auto_rear_final_verification.json `
            --finalize
          if ($LASTEXITCODE -ne 0) { throw "real-movement Rogue AutoRear ZIP failed final package verification" }
          python tools/verify_candidate_provenance.py `
            --sha "${{ github.sha }}" `
            --branch parallel `
            --package dist/WoW112_PARALLEL_ROGUE_AUTO_REAR.zip `
            --metadata dist/rogue_auto_rear_metadata.json `
            --summary dist/rogue_auto_rear_summary.json `
            --final-report dist/rogue_auto_rear_final_verification.json `
            --output dist/rogue_auto_rear_attestation.json
          if ($LASTEXITCODE -ne 0) { throw "AutoRear commit, branch or package attestation failed" }

      - name: Package and attest Parallel repo-managed addons
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/package_lazyrogue_addons.py --output dist/WoW112_LAZYROGUE_HYBRID_ADDONS.zip
          if ($LASTEXITCODE -ne 0) { throw "Parallel addon packaging failed" }
          @'
          import hashlib, json
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("dist/WoW112_LAZYROGUE_HYBRID_ADDONS.zip")
          with ZipFile(p) as z:
              names = [x.filename for x in z.infolist() if not x.is_dir()]
              if z.testzip() or len(names) != len(set(x.lower() for x in names)):
                  raise SystemExit("invalid Parallel addon archive")
          meta = {"schema_version": 1, "zip_name": p.name,
                  "addon_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  "file_count": len(names), "git_sha": "${{ github.sha }}"}
          Path("dist/addon_metadata.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")
          print("ADDON_METADATA: PASS", meta)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Parallel addon metadata failed" }

      - name: Attest exact branch, commit and finalized ZIP
        shell: pwsh
        run: |
          python tools/verify_candidate_provenance.py `
            --sha "${{ github.sha }}" `
            --branch "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "candidate provenance/verification attestation failed" }

      - name: Build and verify orientation-only Rogue PvE comparison
        if: github.ref_name == 'parallel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_rogue_angle_candidate.py --sha "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "angle-only Rogue x86 build failed" }
          python tools/verify_candidate_package.py `
            --package dist/WoW112_PARALLEL_ROGUE_ANGLE_ONLY.zip `
            --package-metadata dist/rogue_angle_metadata.json `
            --summary dist/rogue_angle_summary.json `
            --report dist/rogue_angle_final_verification.json `
            --finalize
          if ($LASTEXITCODE -ne 0) { throw "angle-only Rogue final ZIP gate failed" }
          python tools/verify_candidate_provenance.py `
            --sha "${{ github.sha }}" `
            --branch parallel `
            --package dist/WoW112_PARALLEL_ROGUE_ANGLE_ONLY.zip `
            --metadata dist/rogue_angle_metadata.json `
            --summary dist/rogue_angle_summary.json `
            --final-report dist/rogue_angle_final_verification.json `
            --output dist/rogue_angle_attestation.json
          if ($LASTEXITCODE -ne 0) { throw "angle-only Rogue candidate attestation failed" }

      - name: Write human-readable test card
        shell: pwsh
        run: >-
          python tools/write_candidate_test_card.py
          --summary dist/candidate_summary.json
          --output dist/TEST_THIS.txt

      - name: Upload runnable ZIP and candidate diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-WORK-CANDIDATE-${{ github.sha }}
          path: |
            dist/WoW112_WORK_CANDIDATE.zip
            dist/WoW112_PARALLEL_ROGUE_ANGLE_ONLY.zip
            dist/WoW112_PARALLEL_ROGUE_AUTO_REAR.zip
            dist/ROGUE_AUTO_REAR_TEST.txt
            dist/rogue_auto_rear_metadata.json
            dist/rogue_auto_rear_summary.json
            dist/rogue_auto_rear_final_verification.json
            dist/rogue_auto_rear_attestation.json
            dist/ROGUE_ANGLE_ONLY_TEST.txt
            dist/rogue_angle_metadata.json
            dist/rogue_angle_summary.json
            dist/rogue_angle_final_verification.json
            dist/rogue_angle_attestation.json
            dist/WoW112_LAZYROGUE_HYBRID_ADDONS.zip
            dist/addon_metadata.json
            dist/TEST_THIS.txt
            dist/candidate_metadata.json
            dist/candidate_summary.json
            dist/final_package_verification.json
            dist/farclip_patch.json
            dist/candidate_attestation.json
            dist/dll_conflict_audit.json
            dist/parallel_gui_regression.json
            dist/*_build.json
          if-no-files-found: error
          compression-level: 0
