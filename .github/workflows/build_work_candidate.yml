name: Build work candidate

on:
  push:
    branches:
      - work
    paths:
      - 'src/**'
      - 'runtime/current.json'
      - 'runtime/work_candidate.json'
      - 'CURRENT.json'
      - 'tools/build_active_module.py'
      - 'tools/build_changed_active.py'
      - 'tools/build_controlhub_candidate.py'
      - 'tools/build_autopoisons_candidate.py'
      - 'tools/package_current.py'
      - 'tools/verify_current.py'
      - 'tools/verify_runtime_artifacts.py'
      - 'tools/verify_verified_symbols.py'
      - 'tools/write_candidate_test_card.py'
      - 'runtime/verified_symbols_5875.json'
      - 'artifacts/runtime_cache/**'
      - '.github/workflows/build_work_candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-work-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: windows-2022
    steps:
      - name: Checkout current work tree
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply one-shot SafeBreak Alt reliability fix
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          python tools/apply_safebreak_alt_pause_fix.py
          git diff --quiet -- src/MovementCore/WoWMovementCore_5875_v20_AUTOPP_REARONLY_HARDLOS3D_RETRY.c
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/MovementCore/WoWMovementCore_5875_v20_AUTOPP_REARONLY_HARDLOS3D_RETRY.c
            git commit -m "fix: preserve SafeBreak Alt duration across Pick Pocket arbitration"
            git push origin HEAD:work
          }

      - name: Build changed active modules and package candidate
        if: github.event_name == 'push'
        shell: pwsh
        run: >-
          python tools/build_changed_active.py
          --base "${{ github.event.before }}"
          --output-dir build
          --package dist/WoW112_WORK_CANDIDATE.zip
          --package-metadata dist/candidate_metadata.json
          --summary dist/candidate_summary.json

      - name: Full active-stack build/package audit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: >-
          python tools/build_changed_active.py
          --all
          --output-dir build
          --package dist/WoW112_WORK_CANDIDATE.zip
          --package-metadata dist/candidate_metadata.json
          --summary dist/candidate_summary.json

      - name: Build and append WoWControlHub pilot
        shell: pwsh
        run: >-
          python tools/build_controlhub_candidate.py
          --package dist/WoW112_WORK_CANDIDATE.zip
          --package-metadata dist/candidate_metadata.json
          --summary dist/candidate_summary.json
          --build-metadata dist/controlhub_build.json
          --output build/WoWControlHub.dll

      - name: Build and append AutoPoisons provider
        shell: pwsh
        run: >-
          python tools/build_autopoisons_candidate.py
          --package dist/WoW112_WORK_CANDIDATE.zip
          --package-metadata dist/candidate_metadata.json
          --summary dist/candidate_summary.json
          --build-metadata dist/autopoisons_build.json
          --output build/WoWAutoPoisons_5875_v1.dll

      - name: Write human-readable test card
        shell: pwsh
        run: >-
          python tools/write_candidate_test_card.py
          --summary dist/candidate_summary.json
          --output dist/TEST_THIS.txt

      - name: Upload runnable ZIP and candidate diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-WORK-CANDIDATE-${{ github.sha }}
          path: |
            dist/WoW112_WORK_CANDIDATE.zip
            dist/TEST_THIS.txt
            dist/candidate_metadata.json
            dist/candidate_summary.json
            dist/controlhub_build.json
            dist/autopoisons_build.json
          if-no-files-found: error
          compression-level: 0
