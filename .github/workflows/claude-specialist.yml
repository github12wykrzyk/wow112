name: Claude Specialist

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Read-only task for Claude specialist'
        required: true
        type: string
      target_ref:
        description: 'Git ref Claude should inspect'
        required: false
        default: 'dev/windows-ah-canonical'
        type: string
      max_turns:
        description: 'Maximum Claude turns (1-20)'
        required: false
        default: '6'
        type: string
  push:
    branches:
      - 'feature/claude-autonomous-v1'
    paths:
      - '.github/workflows/claude-specialist.yml'
      - '.ai/claude/request.json'

permissions:
  contents: read

concurrency:
  group: claude-specialist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  specialist:
    name: Claude read-only specialist
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout control revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve Claude request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TASK: ${{ inputs.task }}
          DISPATCH_TARGET_REF: ${{ inputs.target_ref }}
          DISPATCH_MAX_TURNS: ${{ inputs.max_turns }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            task="$DISPATCH_TASK"
            target_ref="${DISPATCH_TARGET_REF:-dev/windows-ah-canonical}"
            max_turns="${DISPATCH_MAX_TURNS:-6}"
            request_id="dispatch-${GITHUB_RUN_ID}"
          else
            test -f .ai/claude/request.json
            task="$(jq -er '.task' .ai/claude/request.json)"
            target_ref="$(jq -er '.target_ref // "dev/windows-ah-canonical"' .ai/claude/request.json)"
            max_turns="$(jq -er '(.max_turns // 6) | tostring' .ai/claude/request.json)"
            request_id="$(jq -er '.request_id // "push"' .ai/claude/request.json)"
          fi

          if ! [[ "$max_turns" =~ ^[0-9]+$ ]] || [ "$max_turns" -lt 1 ] || [ "$max_turns" -gt 20 ]; then
            echo 'max_turns must be an integer from 1 to 20' >&2
            exit 1
          fi
          if [ -z "$task" ] || [ -z "$target_ref" ]; then
            echo 'task and target_ref must be non-empty' >&2
            exit 1
          fi

          safe_request_id="$(printf '%s' "$request_id" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          [ -n "$safe_request_id" ] || safe_request_id="request-${GITHUB_RUN_ID}"

          delim="CLAUDE_TASK_${GITHUB_RUN_ID}_${RANDOM}"
          {
            echo "task<<$delim"
            printf '%s\n' "$task"
            echo "$delim"
            echo "target_ref=$target_ref"
            echo "max_turns=$max_turns"
            echo "request_id=$safe_request_id"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout requested target
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.request.outputs.target_ref }}
          fetch-depth: 0

      - name: Resolve exact target SHA
        id: target
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record pre-Claude repository state
        id: baseline
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          h = hashlib.sha256()
          h.update(subprocess.check_output(['git', 'diff', '--binary', '--no-ext-diff', 'HEAD']))
          raw = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'])
          for name_b in sorted(x for x in raw.split(b'\0') if x):
              name = os.fsdecode(name_b)
              h.update(b'UNTRACKED\0' + name_b + b'\0')
              p = Path(name)
              if p.is_file():
                  h.update(hashlib.sha256(p.read_bytes()).digest())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'digest={h.hexdigest()}\n')
          PY

      - name: Verify Claude credential is available
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo 'CLAUDE_CODE_OAUTH_TOKEN is missing or unavailable to this workflow.' >&2
            exit 1
          fi
          echo 'Claude OAuth credential is present (value intentionally hidden).'

      - name: Run Claude specialist
        id: claude
        uses: anthropics/claude-code-base-action@4541c106b5f267e74536bf5dfaf887c09ae88edf
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: 'false'
          prompt: |
            You are a read-only specialist assisting the primary autonomous engineering agent for this repository.

            Repository: ${{ github.repository }}
            Requested ref: ${{ steps.request.outputs.target_ref }}
            Exact revision: ${{ steps.target.outputs.sha }}
            Request id: ${{ steps.request.outputs.request_id }}

            Hard rules:
            - Read and analyze only. Do not edit, create, delete, commit, push, or mutate repository files.
            - Follow AGENTS.md and repository-local authority/routing rules.
            - Prefer exact file/path/line evidence over speculation.
            - If evidence is insufficient, say what is missing instead of guessing.
            - Return a compact engineering report with: diagnosis, evidence, recommendation, risks, and tests.

            TASK:
            ${{ steps.request.outputs.task }}
          claude_args: |
            --max-turns ${{ steps.request.outputs.max_turns }}
            --permission-mode plan
            --allowedTools "Read,Glob,Grep,Bash(git status:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git rev-parse:*)"
            --disallowedTools "Edit,Write,NotebookEditCell"

      - name: Enforce read-only repository state
        shell: bash
        env:
          BEFORE_DIGEST: ${{ steps.baseline.outputs.digest }}
        run: |
          AFTER_DIGEST="$(python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path

          h = hashlib.sha256()
          h.update(subprocess.check_output(['git', 'diff', '--binary', '--no-ext-diff', 'HEAD']))
          raw = subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z'])
          for name_b in sorted(x for x in raw.split(b'\0') if x):
              name = os.fsdecode(name_b)
              h.update(b'UNTRACKED\0' + name_b + b'\0')
              p = Path(name)
              if p.is_file():
                  h.update(hashlib.sha256(p.read_bytes()).digest())
          print(h.hexdigest())
          PY
          )"
          if [ "$AFTER_DIGEST" != "$BEFORE_DIGEST" ]; then
            echo 'Claude specialist changed repository state relative to its pre-run baseline; failing closed.' >&2
            git status --short >&2
            exit 1
          fi
          echo 'Read-only repository state preserved.'

      - name: Extract Claude final report
        if: always() && steps.claude.outputs.execution_file != ''
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          CLAUDE_SESSION_ID: ${{ steps.claude.outputs.session_id }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          TARGET_REF: ${{ steps.request.outputs.target_ref }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['EXECUTION_FILE'])
          events = json.loads(path.read_text(encoding='utf-8'))
          report = ''

          for event in reversed(events):
              if isinstance(event, dict) and event.get('type') == 'result' and isinstance(event.get('result'), str):
                  report = event['result']
                  break

          if not report:
              for event in reversed(events):
                  if not isinstance(event, dict) or event.get('type') != 'assistant':
                      continue
                  content = ((event.get('message') or {}).get('content') or [])
                  chunks = [b.get('text', '') for b in content if isinstance(b, dict) and b.get('type') == 'text']
                  report = '\n'.join(x for x in chunks if x)
                  if report:
                      break

          if not report:
              report = 'No final Claude text result was found in the execution log.'

          Path('claude-specialist-report.md').write_text(report + '\n', encoding='utf-8')
          Path('claude-specialist-meta.json').write_text(json.dumps({
              'conclusion': os.environ.get('CLAUDE_CONCLUSION', ''),
              'session_id': os.environ.get('CLAUDE_SESSION_ID', ''),
              'request_id': os.environ.get('REQUEST_ID', ''),
              'target_ref': os.environ.get('TARGET_REF', ''),
              'target_sha': os.environ.get('TARGET_SHA', ''),
              'repository': os.environ.get('GITHUB_REPOSITORY', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
          }, indent=2) + '\n', encoding='utf-8')

          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as f:
              f.write('## Claude Specialist Result\n\n')
              f.write(report)
              f.write('\n')
          PY

      - name: Upload Claude report
        if: always() && hashFiles('claude-specialist-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-specialist-${{ steps.request.outputs.request_id }}-${{ github.run_id }}
          path: |
            claude-specialist-report.md
            claude-specialist-meta.json
          if-no-files-found: error
          retention-days: 14
