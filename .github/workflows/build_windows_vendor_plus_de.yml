name: WoW112 Vendor + DE Windows

on:
  push:
    branches: [feature/vendor-plus-de-windows]
    paths:
      - '.github/workflows/build_windows_vendor_plus_de.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          path: package

      - name: Checkout live Vendor V2 profit-first
        uses: actions/checkout@v4
        with:
          ref: feature/windows-headless-ah-fast
          path: vendor

      - name: Checkout POC08 F2 exact DE
        uses: actions/checkout@v4
        with:
          ref: feature/poc08-f2-de-hardening
          path: de

      - name: Checkout full DE coverage source
        uses: actions/checkout@v4
        with:
          ref: feature/poc08-e0-deid-coverage
          path: coverage

      - uses: dtolnay/rust-toolchain@stable

      # -------------------- VENDOR --------------------
      - name: Generate Vendor FULL-AH V2 profit-first
        shell: pwsh
        working-directory: vendor
        run: |
          python probes/Wow112HeadlessAndroid/tools/vendor_fullsweep_turbo_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive.rs probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_fullsweep.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/vendor_multibuy_names_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_fullsweep.rs probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_multibuy.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/vendor_multibuy_v2_neighborhood_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_multibuy.rs probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_multibuy_v2.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p='probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_multibuy_v2.rs'
          foreach ($m in @('REVALIDATE_RADIUS: u32 = 5','login_poc07_vendorlive_multibuy_v2','PROFIT_DESC_PAGE_DESC_TIE')) {
            if (-not (Select-String -Path $p -Pattern $m -SimpleMatch -Quiet)) { throw "Vendor marker missing: $m" }
          }
          $main='probes/Wow112HeadlessAndroid/src/main.rs'
          $t=Get-Content $main -Raw
          $t=$t.Replace('mod world_poc07_vendorlive;','mod world_poc07_vendorlive_multibuy_v2;')
          $t=$t.Replace('world_poc07_vendorlive::login_poc07_vendorlive','world_poc07_vendorlive_multibuy_v2::login_poc07_vendorlive_multibuy_v2')
          Set-Content $main $t -Encoding utf8

      - name: Build Vendor native Windows
        shell: pwsh
        working-directory: vendor
        run: cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release

      # -------------------- DE FULL COVERAGE + F2 --------------------
      - name: Apply live-proven BUY mailbox fastfix to DE primitive
        shell: pwsh
        working-directory: de
        run: |
          git fetch --no-tags --depth=1 origin feature/vendor-mailbox-fastfix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch='probes/Wow112HeadlessAndroid/tools/vendor_mailbox_fastfix_patch.py'
          git show FETCH_HEAD:$patch | Set-Content $patch -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $patch probes/Wow112HeadlessAndroid/src/world_poc07.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate DE V5.3 base
        shell: pwsh
        working-directory: de
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v4_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v5_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v52_turbo_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v53_class_ceiling_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build full 2343-item DE cache with provenance
        shell: pwsh
        run: |
          python coverage/probes/Wow112HeadlessAndroid/tools/build_de_cache_poc08_e0.py `
            --seed-cache de/probes/Wow112HeadlessAndroid/tools/v52_seed_cache.csv `
            --item-ids coverage/probes/Wow112HeadlessAndroid/tools/poc08_live_item_ids_20261005.txt `
            --output-cache "$env:RUNNER_TEMP/poc08-full-cache.csv" `
            --unresolved "$env:RUNNER_TEMP/poc08-full-unresolved.csv" `
            --workers 24 --timeout 10 --retries 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rows=@(Import-Csv "$env:RUNNER_TEMP/poc08-full-cache.csv")
          foreach($r in $rows){ if($r.source -eq 'LEGACY_SEED'){ $r.source='SeedLegacy' } }
          $rows | Export-Csv "$env:RUNNER_TEMP/poc08-full-cache-normalized.csv" -NoTypeInformation -Encoding utf8
          $unresolved=@(Import-Csv "$env:RUNNER_TEMP/poc08-full-unresolved.csv").Count
          $octo=@($rows|Where-Object {$_.source -eq 'OctoWow'}).Count
          $positive=@($rows|Where-Object {[int]$_.disenchant_id -gt 0}).Count
          Write-Host "[VENDOR+DE] DE CACHE rows=$($rows.Count)/2343 positive=$positive octo_conf2=$octo unresolved=$unresolved"
          if($rows.Count -lt 2200){throw "DE coverage too low: $($rows.Count)/2343"}
          if($unresolved -gt 0){Write-Warning "DE unresolved=$unresolved remain fail-closed"}
          python de/probes/Wow112HeadlessAndroid/tools/poc08_de_cache_to_rust_provenance.py --cache-csv "$env:RUNNER_TEMP/poc08-full-cache-normalized.csv" --output-rs de/probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate and harden POC08-F2 with full DE cache
        shell: pwsh
        working-directory: de
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc08_economy_audit_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_reference_de_model_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_b_compile_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_material_pricebook_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_risk_gate_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_provenance_audit_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs probes/Wow112HeadlessAndroid/src/world_poc08_e_provenance.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_f0_eligibility_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_e_provenance.rs probes/Wow112HeadlessAndroid/src/world_poc08_f0_eligibility.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_f1_live_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_f0_eligibility.rs probes/Wow112HeadlessAndroid/src/world_poc08_f1_live.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_exact_de_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_f1_live.rs probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_critical_hardening_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_order_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_history_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_pagination_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p='probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs'
          foreach($m in @('poc08_de_source_confidence(c.record.item_id) >= 2','WOW112_F2_EXPECT_AUCTION_ID','NO_AUTO_RETRY_FROM_THIS_POINT=YES','hard_max_purchases=1')){
            if(-not (Select-String -Path $p -Pattern $m -SimpleMatch -Quiet)){throw "F2 marker missing: $m"}
          }
          $main='probes/Wow112HeadlessAndroid/src/main.rs'
          $t=Get-Content $main -Raw
          $t=$t.Replace('mod world_poc07_vendorlive;','mod world_poc08_f2_live;')
          $t=$t.Replace('world_poc07_vendorlive::login_poc07_vendorlive','world_poc08_f2_live::login_poc08_economy_audit')
          $t=$t.Replace('[POC07-LIVE]', '[POC08-F2]')
          $t=$t.Replace('POC-07 LIVE SESSION PASS', 'POC-08F2 EXACT DE SESSION PASS')
          $t=$t.Replace('POC-07 live vendor autobuy engine', 'POC-08F2 full-cache exact audited DE buy-one')
          Set-Content $main $t -Encoding utf8

      - name: Build DE native Windows
        shell: pwsh
        working-directory: de
        run: cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release

      # -------------------- PACKAGE --------------------
      - name: Stage combined Windows package
        shell: pwsh
        run: |
          $d='dist/vendor-plus-de-windows'
          New-Item -ItemType Directory -Force "$d/vendor" | Out-Null
          New-Item -ItemType Directory -Force "$d/de/runtime" | Out-Null
          New-Item -ItemType Directory -Force "$d/de/source" | Out-Null
          Copy-Item vendor/probes/Wow112HeadlessAndroid/target/release/wow112-headless-android-probe.exe "$d/vendor/wow112-vendor-windows.exe"
          Copy-Item vendor/probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_multibuy_v2.rs "$d/vendor/world_poc07_vendorlive_multibuy_v2.rs"
          Copy-Item de/probes/Wow112HeadlessAndroid/target/release/wow112-headless-android-probe.exe "$d/de/wow112-de-windows.exe"
          Copy-Item de/probes/Wow112HeadlessAndroid/tools/RUN_POC08_F2_DE_2PASS_WINDOWS.ps1 "$d/de/"
          Copy-Item de/probes/Wow112HeadlessAndroid/tools/START_POC08_F2_DE_2PASS_WINDOWS.bat "$d/de/"
          Copy-Item de/probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs "$d/de/source/"
          Copy-Item "$env:RUNNER_TEMP/poc08-full-cache-normalized.csv" "$d/de/runtime/DE_DISENCHANT_CACHE_WITH_SOURCE.csv"
          Copy-Item "$env:RUNNER_TEMP/poc08-full-unresolved.csv" "$d/de/runtime/DE_CACHE_UNRESOLVED.csv"
          Copy-Item coverage/probes/Wow112HeadlessAndroid/tools/poc08_live_item_ids_20261005.txt "$d/de/runtime/LIVE_ITEM_IDS_2343.txt"
          $vh=(Get-FileHash "$d/vendor/wow112-vendor-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $dh=(Get-FileHash "$d/de/wow112-de-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          PACKAGE=WOW112-VENDOR-PLUS-DE-WINDOWS
          VENDOR_REF=feature/windows-headless-ah-fast
          VENDOR_MODE=FULL_AH_ALL_CLASSES_ALL_QUALITIES_ALL_STACKS_PROFIT_FIRST
          VENDOR_MIN_PROFIT_DEFAULT=1c
          VENDOR_REVALIDATION=ORIGINAL_PAGE_PLUS_MINUS_5_EXACT_TUPLE
          VENDOR_BINARY_SHA256=$vh
          DE_REF=feature/poc08-f2-de-hardening
          DE_CACHE_TARGET=2343_LIVE_ITEM_IDS
          DE_LIVE_PROVENANCE_MIN=2_OCTOWOW
          DE_CAPY_LEGACY=FAIL_CLOSED_FOR_LIVE_BUY
          DE_MODE=EXACT_AUDITED_TUPLE_FRESH_PRECHECK_ONE_BUY_PER_PROCESS
          DE_BINARY_SHA256=$dh
          NO_AUTO_RETRY_AFTER_UNCERTAIN_SEND=YES
          "@ | Set-Content "$d/BUILD_INFO.txt" -Encoding utf8
          @'
          WoW112 Vendor + Disenchant / native Windows package.

          vendor/wow112-vendor-windows.exe
            FULL AH VendorLive V2, all classes/qualities/stacks, profit-first ordering.
            Configure with existing WOW112_* environment variables. Recommended: min profit 1c, max buyout 15g, max purchases 100.

          de/START_POC08_F2_DE_2PASS_WINDOWS.bat
            POC08-F2 exact audited DE BUY-one. This build uses the full 2343-item DEID cache.
            Live BUY remains fail-closed: only provenance confidence >=2 (OctoWow) is eligible.
            CapyDB/legacy mappings can support audit visibility but do not authorize a live BUY.

          Safety: after any BUY SENT without a final PASS, do not automatically rerun. AH_MUTATION_UNCERTAIN is a hard stop.
          '@ | Set-Content "$d/00_START_HERE.txt" -Encoding utf8

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Windows-VENDOR-PLUS-DE-${{ github.sha }}
          path: dist/vendor-plus-de-windows
          if-no-files-found: error
          retention-days: 7
