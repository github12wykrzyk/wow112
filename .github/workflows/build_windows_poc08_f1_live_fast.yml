name: POC08-F2 Exact Audited DE 2-Pass Windows

on:
  push:
    branches: [feature/poc08-f2-de-hardening]
    paths:
      - 'probes/Wow112HeadlessAndroid/tools/poc08_f1_pilot_cache.csv'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_f2_exact_de_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_f2_critical_hardening_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_f2_order_fix.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_f2_history_fix.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_f2_pagination_fix.py'
      - 'probes/Wow112HeadlessAndroid/tools/RUN_POC08_F2_DE_2PASS_WINDOWS.ps1'
      - 'probes/Wow112HeadlessAndroid/tools/START_POC08_F2_DE_2PASS_WINDOWS.bat'
      - '.github/workflows/build_windows_poc08_f1_live_fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate V5.3 base
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v4_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v5_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v52_turbo_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v53_class_ceiling_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate minimal pilot provenance cache
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc08_de_cache_to_rust_provenance.py --cache-csv probes/Wow112HeadlessAndroid/tools/poc08_f1_pilot_cache.csv --output-rs probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host '[POC08-F2-CI] pilot cache PASS coverage=intentionally-minimal DE=9823 provenance=OctoWow'

      - name: Generate and harden POC08-F2 source
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc08_economy_audit_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_reference_de_model_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_b_compile_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_material_pricebook_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_risk_gate_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_provenance_audit_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs probes/Wow112HeadlessAndroid/src/world_poc08_e_provenance.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f0_eligibility_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_e_provenance.rs probes/Wow112HeadlessAndroid/src/world_poc08_f0_eligibility.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f1_live_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_f0_eligibility.rs probes/Wow112HeadlessAndroid/src/world_poc08_f1_live.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_exact_de_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_f1_live.rs probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_critical_hardening_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_order_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_history_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f2_pagination_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select F2 entrypoint
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/src/main.rs'
          $t=Get-Content $p -Raw
          $t=$t.Replace('mod world_poc07_vendorlive;','mod world_poc08_f2_live;')
          $t=$t.Replace('world_poc07_vendorlive::login_poc07_vendorlive','world_poc08_f2_live::login_poc08_economy_audit')
          $t=$t.Replace('[POC07-LIVE]', '[POC08-F2]')
          $t=$t.Replace('POC-07 LIVE SESSION PASS', 'POC-08F2 EXACT DE SESSION PASS')
          $t=$t.Replace('POC-07 live vendor autobuy engine', 'POC-08F2 exact audited DE buy-one')
          Set-Content $p $t -Encoding utf8

      - name: Static mutation and valuation safety assertions
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs'
          $main='probes/Wow112HeadlessAndroid/src/main.rs'
          foreach ($marker in @('WOW112_F2_EXPECT_AUCTION_ID','WOW112_F2_EXPECT_ITEM_ID','WOW112_F2_EXPECT_BUYOUT','WOW112_F2_EXPECT_COUNT','[POC08-F2] EXACT AUDIT TARGET PASS','audited-exact-tuple+fresh-page','poc07_buy_exact_one','hard_max_purchases=1','let mut truncated = false;','truncated={}')) {
            if (-not (Select-String -Path $p -Pattern $marker -SimpleMatch -Quiet)) { throw "missing F2 safety marker: $marker" }
          }
          if (-not (Select-String -Path $p -Pattern 'poc08_de_source_confidence(c.record.item_id) >= 2' -SimpleMatch -Quiet)) { throw 'F2 provenance>=2 gate missing' }
          $src=Get-Content $p -Raw
          $zero=$src.IndexOf('if truncated { safe_price = 0; }')
          $insert=$src.IndexOf('if safe_price > 0 { safe_prices.insert(material_id, safe_price); }')
          if ($zero -lt 0 -or $insert -lt 0 -or $zero -ge $insert) { throw 'unsafe truncation ordering: zero must precede SAFE-map insert' }
          foreach ($historyMarker in @('cols.len() < 7','safe_price = cols[5]','matches!(conf, "MEDIUM" | "HIGH")','values.push(safe_price)')) {
            if (-not (Select-String -Path $p -Pattern $historyMarker -SimpleMatch -Quiet)) { throw "history safety marker missing: $historyMarker" }
          }
          foreach ($pageMarker in @('expected_total: Option<u32>','previous_total != total','records.len() < 50','if list_from < total { truncated = true; }')) {
            if (-not (Select-String -Path $p -Pattern $pageMarker -SimpleMatch -Quiet)) { throw "pagination safety marker missing: $pageMarker" }
          }
          if (-not (Select-String -Path $main -Pattern 'error.contains("AH_MUTATION_")' -SimpleMatch -Quiet)) { throw 'AH mutation retry blocker missing from main' }
          if (-not (Select-String -Path probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs -Pattern '9823 => Some\(5\)' -Quiet)) { throw 'DE pilot item 9823 missing' }
          if (-not (Select-String -Path probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs -Pattern '9823 => 2' -SimpleMatch -Quiet)) { throw 'DE pilot Octo provenance confidence=2 missing' }
          if (Select-String -Path $p -Pattern 'let (auctioneer_candidates, _mailbox_guid)' -SimpleMatch -Quiet) { throw 'mailbox_guid integration regression' }
          Write-Host '[POC08-F2-CI] MUTATION+VALUATION+HISTORY+PAGINATION SAFETY ASSERTIONS PASS'

      - name: Build native Windows
        shell: pwsh
        run: cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release

      - name: Stage artifact
        shell: pwsh
        run: |
          $d='dist/poc08-f2'
          New-Item -ItemType Directory -Force "$d/runtime" | Out-Null
          New-Item -ItemType Directory -Force "$d/source" | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/wow112-headless-android-probe.exe "$d/wow112-headless-windows.exe"
          Copy-Item probes/Wow112HeadlessAndroid/tools/RUN_POC08_F2_DE_2PASS_WINDOWS.ps1 $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/START_POC08_F2_DE_2PASS_WINDOWS.bat $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/poc08_f1_pilot_cache.csv "$d/runtime/DE_PILOT_CACHE.csv"
          Copy-Item probes/Wow112HeadlessAndroid/src/world_poc08_f2_live.rs "$d/source/world_poc08_f2_live.rs"
          $h=(Get-FileHash "$d/wow112-headless-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          POC=08-F2-EXACT-AUDITED-DE-2PASS-HARDENED
          EXACT_SHA=$env:GITHUB_SHA
          BINARY_SHA256=$h
          PASS1=AUDIT_ONLY_ZERO_MUTATION
          PASS2=EXACT_AUDITED_TUPLE_REQUIRED
          HARD_MAX_PURCHASES=1
          FRESH_EXACT_AUCTION_PRECHECK=YES
          NO_AUTO_RETRY_AFTER_BUY_SEND=YES
          MATERIAL_BOOK_TRUNCATION=FAIL_CLOSED_ZERO_BEFORE_INSERT
          MATERIAL_PAGINATION=FAIL_CLOSED_ON_UNSTABLE_TOTAL_OR_SHORT_NONFINAL_PAGE
          HISTORY_INPUT=SAFE_PRICE_MEDIUM_HIGH_ONLY
          DE_PROVENANCE_MIN_CONFIDENCE=2
          DE_PILOT_ITEM=9823
          DE_PILOT_DEID=5
          DE_PILOT_HARD_MAX_BUYOUT=1500
          DE_MODEL_DISAGREEMENT_BPS=0
          "@ | Set-Content "$d/BUILD_INFO.txt" -Encoding utf8
          @'
          POC08-F2 hardened performs a two-pass guarded DE pilot.
          PASS 1 is read-only and displays the exact candidate.
          PASS 2 can buy only that exact auction/item/buyout/count if it still passes every risk gate.
          Material valuation fails closed on a truncated or unstable paginated material book.
          History reads only prior SAFE prices with MEDIUM/HIGH confidence.
          Pilot provenance requires Octo-web confidence or stronger.
          The existing fresh-page exact precheck runs again immediately before the send.
          After any sent BUY without a full final PASS, do not rerun until AH/mail state is checked.
          '@ | Set-Content "$d/00_START_HERE.txt" -Encoding utf8

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Windows-POC08-F2-HARDENED-${{ github.sha }}
          path: dist/poc08-f2
          if-no-files-found: error
          retention-days: 7
