name: POC07 DE V2 Android Fast Build

on:
  push:
    branches:
      - feature/android-headless-poc07-fast
    paths:
      - 'probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs'
      - '.github/workflows/build_android_poc07_de_v2_fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select DE V2 live entrypoint
        shell: bash
        run: |
          set -euo pipefail
          MAIN='probes/Wow112HeadlessAndroid/src/main.rs'
          grep -q 'mod world_poc07_vendorlive;' "$MAIN"
          grep -q 'world_poc07_vendorlive::login_poc07_vendorlive' "$MAIN"
          sed -i 's/mod world_poc07_vendorlive;/mod world_poc07_delive_v2;/' "$MAIN"
          sed -i 's/world_poc07_vendorlive::login_poc07_vendorlive/world_poc07_delive_v2::login_poc07_delive_v2/' "$MAIN"
          grep -q 'mod world_poc07_delive_v2;' "$MAIN"
          grep -q 'world_poc07_delive_v2::login_poc07_delive_v2' "$MAIN"

      - name: Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build POC07 DE V2 x86_64 Android
        shell: bash
        run: |
          set -euo pipefail
          LINKER="${ANDROID_SDK_ROOT}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          test -x "$LINKER"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$LINKER"
          export CC_x86_64_linux_android="$LINKER"
          cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release --target x86_64-linux-android

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN='probes/Wow112HeadlessAndroid/target/x86_64-linux-android/release/wow112-headless-android-probe'
          test -x "$BIN"
          mkdir -p dist/poc07-de-v2
          cp "$BIN" dist/poc07-de-v2/wow112-headless-android-probe
          cp probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs dist/poc07-de-v2/world_poc07_delive_v2.rs
          BIN_SHA="$(sha256sum dist/poc07-de-v2/wow112-headless-android-probe | awk '{print $1}')"
          {
            echo 'POC=07-DE-LIVE-V2-SCAN'
            echo "REPOSITORY=${GITHUB_REPOSITORY}"
            echo "BRANCH=${GITHUB_REF_NAME}"
            echo "EXACT_SHA=${GITHUB_SHA}"
            echo 'TARGET=x86_64-linux-android'
            echo 'ANDROID_API=21'
            echo "BINARY_SHA256=${BIN_SHA}"
            echo 'MUTATION=DISABLED'
            echo 'DE_SCOPE=QUALITY_2_3_ILVL_31_65'
            echo 'MATERIAL_PRICING=TARGETED_FULL_NAME_FILTERED_AH'
            echo 'DE_TABLE=CORRECTED_VANILLA_TIERS'
            echo 'DEFAULT_DE_NET_BPS=8500'
          } > dist/poc07-de-v2/BUILD_INFO.txt
          (cd dist/poc07-de-v2 && sha256sum wow112-headless-android-probe world_poc07_delive_v2.rs BUILD_INFO.txt > SHA256SUMS.txt)
          file dist/poc07-de-v2/wow112-headless-android-probe
          cat dist/poc07-de-v2/BUILD_INFO.txt

      - name: Upload POC07 DE V2 binary
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Android-POC07-DE-V2-${{ github.sha }}
          path: dist/poc07-de-v2
          if-no-files-found: error
          retention-days: 7
