name: One-shot Vanish 210s EXE patch

on:
  push:
    branches: [work]
    paths:
      - tools/patch_vanish210_exe.py
      - .github/workflows/one_shot_vanish210.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 1
      - name: Patch active EXE
        run: python tools/patch_vanish210_exe.py
      - name: Verify current state
        run: python tools/verify_current.py
      - name: Commit patched runtime state
        shell: bash
        run: |
          git config user.name "wow112-ai"
          git config user.email "wow112-ai@users.noreply.github.com"
          git rm .github/workflows/one_shot_vanish210.yml
          git add WoW_5875_BASE_MELEE_300YD_PP_BYPASS_STEALTH5_HARD.exe CURRENT.json runtime/current.json manifests/SHA256SUMS_WORK.txt artifacts/StealthCD/VANISH210_HARD_EXE.txt
          git commit -m "EXE: hardcode Vanish cooldown to 3m30s"
          git push origin HEAD:work
