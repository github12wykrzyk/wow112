name: Hotfix TERMINAL WIN cooperative stop

on:
  push:
    branches:
      - parallel
    paths:
      - '.github/workflows/hotfix_terminal_win_stop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch updater source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'tools/updater/UpdaterWindowsTerminalPortalFeature.cs'
          $text = Get-Content $path -Raw

          $oldStart = '            await StopTerminalWindowsWorkerAsync(account);' + [Environment]::NewLine + [Environment]::NewLine + '            var paths = TerminalWindowsPaths(account);' + [Environment]::NewLine + '            Directory.CreateDirectory(Path.GetDirectoryName(paths.Item1));'
          $newStart = '            await StopTerminalWindowsWorkerAsync(account);' + [Environment]::NewLine + [Environment]::NewLine + '            var paths = TerminalWindowsPaths(account);' + [Environment]::NewLine + '            var stopFile = paths.Item1 + ".stop";' + [Environment]::NewLine + '            try { if (File.Exists(stopFile)) File.Delete(stopFile); } catch { }' + [Environment]::NewLine + '            Directory.CreateDirectory(Path.GetDirectoryName(paths.Item1));'
          if (-not $text.Contains($oldStart)) { throw 'Start anchor not found' }
          $text = $text.Replace($oldStart, $newStart)

          $oldEnv = '                psi.EnvironmentVariables["WOW112_SUMMONER_NAMES"] = GetConfiguredSummonerNamesCsv();'
          $newEnv = $oldEnv + [Environment]::NewLine + '                psi.EnvironmentVariables["WOW112_STOP_FILE"] = stopFile;'
          if (-not $text.Contains($oldEnv)) { throw 'Env anchor not found' }
          $text = $text.Replace($oldEnv, $newEnv)

          $pattern = '(?s)        private async Task StopTerminalWindowsWorkerAsync\(WowAccount account\)\r?\n        \{.*?\r?\n        \}\r?\n\r?\n        private Task<TerminalWindowsProbe> ProbeTerminalWindowsWorkerAsync'
          $lines = @(
            '        private async Task StopTerminalWindowsWorkerAsync(WowAccount account)',
            '        {',
            '            var paths = TerminalWindowsPaths(account);',
            '            var stopFile = paths.Item1 + ".stop";',
            '            try',
            '            {',
            '                Directory.CreateDirectory(Path.GetDirectoryName(paths.Item1));',
            '                File.WriteAllText(stopFile, "STOP " + DateTime.UtcNow.ToString("O"), Encoding.ASCII);',
            '            }',
            '            catch { }',
            '',
            '            Log("TERMINAL WIN: " + account.Label + " cooperative STOP requested; czekam na zamknięcie world socket.");',
            '            await Task.Delay(1500);',
            '',
            '            int pid;',
            '            if (File.Exists(paths.Item1) && int.TryParse(File.ReadAllText(paths.Item1).Trim(), out pid) && pid > 0)',
            '            {',
            '                var wrapperStillRunning = false;',
            '                try',
            '                {',
            '                    using (var process = Process.GetProcessById(pid)) wrapperStillRunning = !process.HasExited;',
            '                }',
            '                catch { wrapperStillRunning = false; }',
            '',
            '                if (wrapperStillRunning)',
            '                {',
            '                    try { await RunTerminalProcessAsync("taskkill.exe", new[] { "/PID", pid.ToString(), "/T", "/F" }, 12000); }',
            '                    catch { }',
            '                    await Task.Delay(300);',
            '                }',
            '            }',
            '',
            '            try { if (File.Exists(paths.Item1)) File.Delete(paths.Item1); } catch { }',
            '            Log("TERMINAL WIN: " + account.Label + " STOP complete; stop tombstone pozostaje do następnego START.");',
            '        }',
            '',
            '        private Task<TerminalWindowsProbe> ProbeTerminalWindowsWorkerAsync'
          )
          $replacement = $lines -join [Environment]::NewLine
          $rx = [regex]::new($pattern)
          if (-not $rx.IsMatch($text)) { throw 'Stop method anchor not found' }
          $text = $rx.Replace($text, $replacement, 1)

          $oldFooter = 'Text = "Status co 3 s. Worker ma retry + pełny log lokalny. STOP zabija cały process tree danego konta."'
          $newFooter = 'Text = "Status co 3 s. STOP: worker zamyka world socket; taskkill tylko jako awaryjny fallback."'
          if (-not $text.Contains($oldFooter)) { throw 'Footer anchor not found' }
          $text = $text.Replace($oldFooter, $newFooter)

          $text = $text.Replace('root["backend"] = "windows-native-v1";', 'root["backend"] = "windows-native-v2-stop-safe";')
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Commit patch and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/updater/UpdaterWindowsTerminalPortalFeature.cs
          git rm .github/workflows/hotfix_terminal_win_stop.yml
          git commit -m "fix(updater): cooperative STOP releases terminal account session"
          git push origin HEAD:parallel
