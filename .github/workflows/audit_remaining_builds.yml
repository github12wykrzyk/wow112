name: Audit remaining active builds

on:
  push:
    branches:
      - work
    paths:
      - '.github/workflows/audit_remaining_builds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positional:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Build PositionalSpoof with clang-cl i686
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          clang-cl --target=i686-pc-windows-msvc /nologo /c /O2 /GS- /GR- /EHsc- /Zl /Brepro /clang:-fno-builtin /Fo"Positional.obj" "src/PositionalSpoof/WoWPositionalSpoof_v0_36_WotFRetry5_NoPP_SmartEnergy700_StealthCDSafe_NoFailHook_GateGCDFix_RECONSTRUCTED.c"
          if errorlevel 1 exit /b 1
          link /nologo /DLL /MACHINE:X86 /NODEFAULTLIB /ENTRY:DllMain@12 /Brepro /OUT:"Positional.dll" "Positional.obj"
          if errorlevel 1 exit /b 1
          dumpbin /headers "Positional.dll" | findstr /C:"14C machine (x86)"
          if errorlevel 1 exit /b 1
          certutil -hashfile "Positional.dll" SHA256

  playeresp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Build PlayerESP with MSVC x86 and explicit Win32 imports
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /c /O2 /GS- /GR- /EHsc- /Zl /Brepro /Fo"PlayerESP.obj" "src/WoWPlayerESP/WoWPlayerESP_v1_2_range_sweep.c"
          if errorlevel 1 exit /b 1
          link /nologo /DLL /MACHINE:X86 /NODEFAULTLIB /ENTRY:DllMain@12 /Brepro /OUT:"PlayerESP.dll" "PlayerESP.obj" kernel32.lib user32.lib gdi32.lib
          if errorlevel 1 exit /b 1
          dumpbin /headers "PlayerESP.dll" | findstr /C:"14C machine (x86)"
          if errorlevel 1 exit /b 1
          certutil -hashfile "PlayerESP.dll" SHA256
