name: TELE08 B canonical live gate

on:
  push:
    branches:
      - live/tele08-b-e2e-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      WOW112_PASSWORD: ${{ secrets.WOW112_PASSWORD }}
      WOW112_REALM_INDEX: '1'
      WOW112_RECONNECT_LIMIT: '1'
      WOW112_RECONNECT_DELAY_MS: '0'
      WOW112_TELE08_CUSTOMER_ACCOUNT: 'taxi1'
      WOW112_TELE08_CUSTOMER_CHARACTER: '__FIRST__'
      WOW112_TELE08_SLAVE1_ACCOUNT: 'taxi2'
      WOW112_TELE08_SLAVE1_CHARACTER: '__FIRST__'
      WOW112_TELE08_SUMMONER_ACCOUNT: 'taxi3'
      WOW112_TELE08_SUMMONER_CHARACTER: 'Teletanaris'

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify canonical stored source
        shell: pwsh
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele08_b_live_runtime

      - name: Build exact canonical live runner
        shell: pwsh
        run: cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele08_b_live_runtime

      - name: Autonomous real-server B E2E
        shell: pwsh
        run: |
          $status = 'TELE08_B_LIVE_STATUS.txt'
          if ([string]::IsNullOrWhiteSpace($env:WOW112_PASSWORD)) {
            @"
          result=SKIPPED_NO_SECRET
          detail=Repository Actions secret WOW112_PASSWORD is not configured for this workflow.
          sha=$env:GITHUB_SHA
          canonical_source=true
          "@ | Set-Content -Encoding UTF8 $status
            Write-Host 'TELE08 B LIVE: SKIPPED_NO_SECRET'
            exit 0
          }

          @"
          result=RUNNING
          sha=$env:GITHUB_SHA
          canonical_source=true
          ci_source_patching=false
          customer_account=$env:WOW112_TELE08_CUSTOMER_ACCOUNT
          customer_character_mode=FIRST
          second_sender_account=$env:WOW112_TELE08_SLAVE1_ACCOUNT
          second_sender_character_mode=FIRST
          summoner_account=$env:WOW112_TELE08_SUMMONER_ACCOUNT
          summoner_character=$env:WOW112_TELE08_SUMMONER_CHARACTER
          sender_identity=direct_guid_two_sender
          pacing=ack_per_case
          send_gap_ms=2500
          split=6+6
          "@ | Set-Content -Encoding UTF8 $status

          $exe = 'probes/Wow112HeadlessAndroid/target/release/tele08_b_live_runtime.exe'
          & $exe
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            @"
          result=FAIL
          detail=tele08_b_live_runtime exited rc=$rc. Inspect uploaded evidence.
          sha=$env:GITHUB_SHA
          canonical_source=true
          ci_source_patching=false
          "@ | Set-Content -Encoding UTF8 $status
            throw "TELE08 B canonical LIVE E2E failed rc=$rc"
          }

          @"
          result=PASS
          detail=Canonical stored source completed the real 12-case whisper TX/RX/classification suite with taxi1+taxi2 split 6+6.
          sha=$env:GITHUB_SHA
          canonical_source=true
          ci_source_patching=false
          customer_account=$env:WOW112_TELE08_CUSTOMER_ACCOUNT
          second_sender_account=$env:WOW112_TELE08_SLAVE1_ACCOUNT
          sender_identity=direct_guid_two_sender
          pacing=ack_per_case
          split=6+6
          "@ | Set-Content -Encoding UTF8 $status
          Write-Host 'TELE08 B CANONICAL LIVE E2E PASS'

      - name: Upload canonical live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WoW112_TELE08_B_CANONICAL_LIVE_EVIDENCE
          path: |
            TELE08_B_LIVE_STATUS.txt
            tele08_b_live_runs/**
          if-no-files-found: warn
