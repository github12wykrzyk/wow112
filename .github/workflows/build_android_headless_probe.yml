name: Build Android WoW112 headless probe

# Bootstrap note: touching this workflow on parallel intentionally seeds the first
# branch-local Android artifact consumed by MULTIBOX TERMINAL in the updater.
on:
  workflow_dispatch:
  push:
    branches:
      - parallel
      - feature/updater-android-portal-control-v1
      - feature/android-headless-poc05-unified-v1
      - feature/summon-service-core-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/**'
      - '.github/workflows/build_android_headless_probe.yml'

permissions:
  contents: read

concurrency:
  group: build-android-wow112-headless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: PowerShell launcher syntax check
        shell: pwsh
        run: |
          $files = @(
            'probes/Wow112HeadlessAndroid/RUN_PORTAL_CLICKER.ps1',
            'probes/Wow112HeadlessAndroid/RUN_PORTAL_CLICKER_GUI.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              exit 1
            }
          }

      - name: Host compile check
        shell: bash
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml

      - name: Build Android x86_64 executables
        shell: bash
        run: |
          set -euo pipefail
          cd probes/Wow112HeadlessAndroid
          cargo ndk -t x86_64 --platform 21 build --release --bins

      - name: Verify and stage Android service bundle
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ROOT="probes/Wow112HeadlessAndroid/target"
          OUT="dist/android-headless-probe"
          mkdir -p "$OUT"

          copy_bin() {
            local name="$1"
            local src
            src="$(find "$TARGET_ROOT" -type f -name "$name" -perm -111 -print -quit)"
            if [[ -z "$src" ]]; then
              echo "required Android binary missing: $name" >&2
              exit 2
            fi
            cp "$src" "$OUT/$name"
            file "$OUT/$name"
          }

          copy_bin wow112-headless-android-probe
          copy_bin summon_service_helper
          copy_bin summon_service_ctl
          copy_bin summon_service_history
          copy_bin summon_service_report

          cp probes/Wow112HeadlessAndroid/README.md "$OUT/README.md"
          cp probes/Wow112HeadlessAndroid/RUN_POC05.cmd "$OUT/RUN_POC05.cmd"
          cp probes/Wow112HeadlessAndroid/RUN_POC05.ps1 "$OUT/RUN_POC05.ps1"
          cp probes/Wow112HeadlessAndroid/RUN_PORTAL_CLICKER.cmd "$OUT/RUN_PORTAL_CLICKER.cmd"
          cp probes/Wow112HeadlessAndroid/RUN_PORTAL_CLICKER.ps1 "$OUT/RUN_PORTAL_CLICKER.ps1"
          cp probes/Wow112HeadlessAndroid/RUN_PORTAL_CLICKER_GUI.cmd "$OUT/RUN_PORTAL_CLICKER_GUI.cmd"
          cp probes/Wow112HeadlessAndroid/RUN_PORTAL_CLICKER_GUI.ps1 "$OUT/RUN_PORTAL_CLICKER_GUI.ps1"

          MAIN_SHA="$(sha256sum "$OUT/wow112-headless-android-probe" | awk '{print $1}')"
          HELPER_SHA="$(sha256sum "$OUT/summon_service_helper" | awk '{print $1}')"
          cat > "$OUT/BUILD_INFO.txt" <<INFO
          POC=05
          PRODUCT=SUMMON_SERVICE_V1
          REPOSITORY=${GITHUB_REPOSITORY}
          BRANCH=${GITHUB_REF_NAME}
          EXACT_SHA=${GITHUB_SHA}
          WORKFLOW_RUN_ID=${GITHUB_RUN_ID}
          WORKFLOW_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}
          TARGET=x86_64-linux-android
          ANDROID_API=21
          SUMMONER_BINARY=wow112-headless-android-probe
          SUMMONER_BINARY_SHA256=${MAIN_SHA}
          HELPER_BINARY=summon_service_helper
          HELPER_BINARY_SHA256=${HELPER_SHA}
          TOOL_BINARIES=summon_service_ctl,summon_service_history,summon_service_report
          PORTAL_BACKEND=android-detached-v5
          INFO

          (
            cd "$OUT"
            sha256sum \
              wow112-headless-android-probe \
              summon_service_helper \
              summon_service_ctl \
              summon_service_history \
              summon_service_report \
              RUN_POC05.cmd \
              RUN_POC05.ps1 \
              RUN_PORTAL_CLICKER.cmd \
              RUN_PORTAL_CLICKER.ps1 \
              RUN_PORTAL_CLICKER_GUI.cmd \
              RUN_PORTAL_CLICKER_GUI.ps1 \
              README.md \
              BUILD_INFO.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          grep -Fx "PRODUCT=SUMMON_SERVICE_V1" "$OUT/BUILD_INFO.txt"
          grep -Fx "EXACT_SHA=${GITHUB_SHA}" "$OUT/BUILD_INFO.txt"
          grep -Fx "SUMMONER_BINARY_SHA256=${MAIN_SHA}" "$OUT/BUILD_INFO.txt"
          grep -Fx "HELPER_BINARY_SHA256=${HELPER_SHA}" "$OUT/BUILD_INFO.txt"

      - name: Upload Android service bundle
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Android-Headless-POC05-${{ github.sha }}
          path: dist/android-headless-probe
          if-no-files-found: error
          retention-days: 14
