name: Verify repository state

on:
  push:
    branches:
      - main
      - work
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifests and active runtime
        run: python3 tools/verify_repo.py
