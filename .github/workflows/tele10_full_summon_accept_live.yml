name: TELE10 full summon accept live
on:
  workflow_dispatch:
  push:
    branches: [feature/tele10-full-summon-accept-v1]
    paths:
      - '.github/workflows/tele10_full_summon_accept_live.yml'
      - 'probes/Wow112HeadlessAndroid/src/bin/tele06a_acceptor_runtime.rs'
      - 'probes/Wow112HeadlessAndroid/src/bin/tele07_supervisor.rs'
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WOW112_PASSWORD: ${{ secrets.WOW112_PASSWORD }}
      WOW112_REALM_INDEX: '1'
      WOW112_TELE08_CUSTOMER_ACCOUNT: 'taxi1'
      WOW112_TELE08_CUSTOMER_CHARACTER: '__FIRST__'
      WOW112_TELE08_SUMMONER_ACCOUNT: 'taxi3'
      WOW112_TELE08_SUMMONER_CHARACTER: 'Teletanaris'
      WOW112_TELE09_CUSTOMER_ACCOUNT: 'taxi1'
      WOW112_TELE09_CUSTOMER_CHARACTER: 'Feltaxi'
      WOW112_TELE07_CYCLES: '1'
      WOW112_TELE07_READY_TIMEOUT_SECS: '180'
      WOW112_TELE07_CYCLE_TIMEOUT_SECS: '150'
      WOW112_TELE07_STALE_SECS: '90'
      WOW112_TELE07_RESTART_BUDGET: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Stored-source build
        shell: pwsh
        run: |
          rustfmt --edition 2021 --config skip_children=true probes/Wow112HeadlessAndroid/src/bin/tele06a_acceptor_runtime.rs probes/Wow112HeadlessAndroid/src/bin/tele07_supervisor.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($bin in @('tele08_full_roundtrip','tele07_supervisor','tele06a_acceptor_runtime','tele06a_ritual_runtime')) {
            cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin $bin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Real request
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WOW112_PASSWORD)) { throw 'WOW112_PASSWORD secret required' }
          if (Test-Path 'tele08_roundtrip_runs') { Remove-Item 'tele08_roundtrip_runs' -Recurse -Force }
          & 'probes/Wow112HeadlessAndroid/target/release/tele08_full_roundtrip.exe'
          if ($LASTEXITCODE -ne 0) { throw "request phase failed rc=$LASTEXITCODE" }
          $status = Get-ChildItem tele08_roundtrip_runs -Filter STATUS.txt -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $status) { throw 'missing request STATUS.txt' }
          if ((Get-Content $status.FullName -Raw) -notmatch 'result=PASS') { throw 'request phase not PASS' }
          New-Item -ItemType Directory -Force -Path tele10_evidence | Out-Null
          Copy-Item $status.FullName tele10_evidence/REQUEST_STATUS.txt
      - name: Real summon accept teleport
        shell: pwsh
        run: |
          Start-Sleep -Milliseconds 1500
          $runDir = Join-Path $PWD 'tele10_evidence/SUMMON'
          New-Item -ItemType Directory -Force -Path $runDir | Out-Null
          $env:WOW112_TELE07_RUN_DIR = $runDir
          & 'probes/Wow112HeadlessAndroid/target/release/tele07_supervisor.exe' --cycles 1
          if ($LASTEXITCODE -ne 0) { throw "summon phase failed rc=$LASTEXITCODE" }
          $verdict = Get-Content (Join-Path $runDir 'SUPERVISOR_VERDICT.txt') -Raw
          $cycle = Get-Content (Join-Path $runDir 'CYCLE_RESULTS.txt') -Raw
          if ($verdict -notmatch 'result=PASS_TELE07') { throw "supervisor not PASS: $verdict" }
          if ($cycle -notmatch 'result=PASS_TELEPORT_COMPLETE') { throw "teleport not confirmed: $cycle" }
          'result=PASS' | Set-Content tele10_evidence/TELE10_STATUS.txt
          'chain=real_whisper>B>C>D>E>party>ritual>portal>summon_request>summon_response>teleport_ack_or_new_world>teleport_complete' | Add-Content tele10_evidence/TELE10_STATUS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WoW112_TELE10_FULL_SUMMON_ACCEPT_EVIDENCE
          path: |
            tele10_evidence/**
            tele08_roundtrip_runs/**
          if-no-files-found: warn
