name: TEMP Apply Summon Boot Recovery

on:
  push:
    branches:
      - feature/summon-service-core-v1
    paths:
      - '.github/workflows/_tmp_apply_boot_recovery.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/summon-service-core-v1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply structural boot recovery integration
        shell: python
        run: |
          from pathlib import Path

          # Runtime::open: reconcile persisted state before core restore.
          p = Path('probes/Wow112HeadlessAndroid/src/summon_service_runtime.rs')
          s = p.read_text()
          import_anchor = '''use crate::summon_service_core::{
              CoreError, DurableRequest, OperatorCommand, RequestPhase, SummonServiceCore,
          };
          '''
          import_new = '''use crate::summon_boot_recovery::reconcile_boot_snapshot;
          use crate::summon_service_core::{
              CoreError, DurableRequest, OperatorCommand, RequestPhase, ServiceSnapshot, SummonServiceCore,
          };
          '''
          if s.count(import_anchor) != 1:
              raise SystemExit(f'runtime import anchor count={s.count(import_anchor)}')
          s = s.replace(import_anchor, import_new, 1)

          start_marker = '            SummonServiceCore::restore_json('
          end_marker = '\n            .map_err(core_error)?'
          if s.count(start_marker) != 1:
              raise SystemExit(f'runtime restore start count={s.count(start_marker)}')
          start = s.index(start_marker)
          end0 = s.index(end_marker, start)
          end = end0 + len(end_marker)
          replacement = '''            let snapshot: ServiceSnapshot = serde_json::from_str(&text)
                  .map_err(|error| format!("parse summon service state {} failed: {error}", config.state_path.display()))?;
              let root = config
                  .state_path
                  .parent()
                  .unwrap_or_else(|| Path::new("."));
              let recovery = reconcile_boot_snapshot(root, snapshot)?;
              if let Some(request_id) = recovery.promoted_request_id.as_deref() {
                  eprintln!("[SUMMON-SERVICE] boot_recovery=portal_committed request={request_id} evidence=dual_durable");
              }
              SummonServiceCore::restore(
                  recovery.snapshot,
                  parser,
                  queue_config,
                  config.resource.clone(),
                  now_ms,
              )
              .map_err(core_error)?'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # Portal worker: any confirmed PortalUse blocks a second portal GUID for same request.
          p = Path('probes/Wow112HeadlessAndroid/src/summon_portal_worker.rs')
          s = p.read_text()
          operation_line = '        let operation_id = format!("{request_id}:portal-use:{portal_guid:016X}");'
          if s.count(operation_line) != 1:
              raise SystemExit(f'portal operation marker count={s.count(operation_line)}')
          preguard = '''        if mutations.records_for_request(&request_id).any(|record| {
              record.kind == MutationKind::PortalUse && record.state == MutationState::Confirmed
          }) {
              return Ok(None);
          }
          '''
          s = s.replace(operation_line, preguard + operation_line, 1)

          fn_marker = '    fn execute_once_transport_error_is_durable_uncertain_and_never_replayed() {'
          if s.count(fn_marker) != 1:
              raise SystemExit(f'portal test fn marker count={s.count(fn_marker)}')
          fn_pos = s.index(fn_marker)
          attr_pos = s.rfind('    #[test]', 0, fn_pos)
          if attr_pos < 0:
              raise SystemExit('portal test attribute not found')
          test = '''    #[test]
          fn confirmed_portal_for_request_blocks_different_guid_before_control_consumption() {
              let root = root("different_guid_idempotent");
              let (_runtime, _id) = ritual_ready(&root);
              let worker = PortalWorker::open(&root).unwrap();
              worker
                  .execute_portal_use_once(0xD00D, 30, |_| Ok(()))
                  .unwrap()
                  .unwrap();
              let second = worker
                  .execute_portal_use_once(0xBEEF, 31, |_| {
                      panic!("a request with confirmed portal use must never click a second portal guid")
                  })
                  .unwrap();
              assert!(second.is_none());
              let _ = fs::remove_dir_all(root);
          }

          '''
          s = s[:attr_pos] + test + s[attr_pos:]
          p.write_text(s)

      - name: Test library
        run: cargo test --lib --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Compile all test targets
        run: cargo test --no-run --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Cargo check
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probes/Wow112HeadlessAndroid/src/summon_service_runtime.rs \
                  probes/Wow112HeadlessAndroid/src/summon_portal_worker.rs
          git diff --cached --check
          git commit -m 'fix(summon): recover confirmed portal handoff without replay'
          git push origin HEAD:feature/summon-service-core-v1
