name: TEMP Apply Live Customer Trigger

on:
  push:
    branches:
      - feature/summon-service-core-v1
    paths:
      - '.github/workflows/_tmp_apply_live_customer_trigger.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/summon-service-core-v1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply one-shot request trigger
        shell: python
        run: |
          from pathlib import Path
          p = Path('probes/Wow112HeadlessAndroid/src/bin/tele06a_acceptor_runtime.rs')
          s = p.read_text()

          static_anchor = '    static ACCEPT_ATTEMPTED: AtomicBool = AtomicBool::new(false);'
          if s.count(static_anchor) != 1:
              raise SystemExit(f'static anchor count={s.count(static_anchor)}')
          s = s.replace(
              static_anchor,
              static_anchor + '\n    static SERVICE_REQUEST_ATTEMPTED: AtomicBool = AtomicBool::new(false);',
              1,
          )

          fn_anchor = '    fn configured_accept_from() -> Result<String, String> {'
          if s.count(fn_anchor) != 1:
              raise SystemExit(f'function anchor count={s.count(fn_anchor)}')
          helper = '''    fn maybe_send_service_request_once(
              stream: &mut TcpStream,
              crypto: &mut HeaderCrypto,
          ) -> Result<(), String> {
              let Some(target) = std::env::var("WOW112_SUMMON_REQUEST_TO")
                  .ok()
                  .map(|value| value.trim().to_string())
                  .filter(|value| !value.is_empty())
              else {
                  return Ok(());
              };
              let text = std::env::var("WOW112_SUMMON_REQUEST_TEXT")
                  .ok()
                  .map(|value| value.trim().to_string())
                  .filter(|value| !value.is_empty())
                  .ok_or_else(|| "WOW112_SUMMON_REQUEST_TO requires WOW112_SUMMON_REQUEST_TEXT".to_string())?;
              if SERVICE_REQUEST_ATTEMPTED
                  .compare_exchange(false, true, Ordering::SeqCst, Ordering::SeqCst)
                  .is_err()
              {
                  println!("[SUMMON-LIVE-CUSTOMER] request whisper already attempted; replay disabled");
                  return Ok(());
              }
              publish_runner_state(
                  "SUMMON_REQUEST_WHISPER_COMMITTED",
                  &format!("target={target} retry_allowed=false"),
              );
              tele_send_whisper(stream, crypto, &target, &text).map_err(|error| {
                  format!(
                      "TELE06A_REQUEST_WHISPER_UNCERTAIN target={target:?} retry_allowed=false cause={error}"
                  )
              })?;
              publish_runner_state(
                  "SUMMON_REQUEST_WHISPER_SENT",
                  &format!("target={target} text={text:?} retry_allowed=false"),
              );
              Ok(())
          }

          '''
          s = s.replace(fn_anchor, helper + fn_anchor, 1)

          call_anchor = '        reset_group_once(stream, &mut crypto)?;'
          if s.count(call_anchor) != 1:
              raise SystemExit(f'call anchor count={s.count(call_anchor)}')
          s = s.replace(
              call_anchor,
              call_anchor + '\n        maybe_send_service_request_once(stream, &mut crypto)?;',
              1,
          )

          transient_anchor = '    if error.contains("TELE06C_MOVE_MUTATION_UNCERTAIN") {'
          if s.count(transient_anchor) != 1:
              raise SystemExit(f'transient anchor count={s.count(transient_anchor)}')
          s = s.replace(
              transient_anchor,
              '    if error.contains("TELE06A_REQUEST_WHISPER_UNCERTAIN") {\n        return false;\n    }\n' + transient_anchor,
              1,
          )
          p.write_text(s)

      - name: Test library
        run: cargo test --lib --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Compile all test targets
        run: cargo test --no-run --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Cargo check
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probes/Wow112HeadlessAndroid/src/bin/tele06a_acceptor_runtime.rs
          git diff --cached --check
          git commit -m 'feat(summon): add guarded live customer request trigger'
          git push origin HEAD:feature/summon-service-core-v1
