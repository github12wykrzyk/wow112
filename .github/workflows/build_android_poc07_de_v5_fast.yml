name: POC07 DE V5 Android Fast Build

on:
  push:
    branches:
      - feature/android-headless-poc07-fast
    paths:
      - 'probes/Wow112HeadlessAndroid/tools/poc07_de_v5_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/RESOLVE_OCTOWOW_DE_GATE.ps1'
      - '.github/workflows/build_android_poc07_de_v5_fast.yml'
      - 'probes/Wow112HeadlessAndroid/tools/poc07_de_v4_patch.py'
      - 'probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate DE V4 then V5 source
        shell: bash
        run: |
          set -euo pipefail
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v4_patch.py \
            probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs \
            probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v5_patch.py \
            probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs \
            probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs
          grep -q 'login_poc07_delive_v5' probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs
          grep -q 'CANDIDATE EXPORT PASS' probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs
          grep -q 'EXTERNAL_OCTO_DB_REQUIRED' probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs

      - name: Exact DisenchantID gate smoke via CapyDB mirror
        shell: pwsh
        run: |
          @'
          rank,auction_id,item_id,count,buyout,unit_value,gross_value,expected_profit,page,owner_guid
          0,1,20406,1,2015,19372,19372,17357,40032,1
          1,2,41316,1,100,1090,1090,990,40000,2
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/candidates.csv" -Encoding utf8
          & ./probes/Wow112HeadlessAndroid/tools/RESOLVE_OCTOWOW_DE_GATE.ps1 `
            -CandidateCsv "$env:RUNNER_TEMP/candidates.csv" `
            -CacheCsv "$env:RUNNER_TEMP/cache.csv" `
            -SafeCsv "$env:RUNNER_TEMP/safe.csv" `
            -TimeoutSec 20 `
            -Retries 3
          $cache = @(Import-Csv "$env:RUNNER_TEMP/cache.csv")
          $twilight = $cache | Where-Object { $_.item_id -eq '20406' }
          $binding = $cache | Where-Object { $_.item_id -eq '41316' }
          if (-not $twilight -or [uint32]$twilight.disenchant_id -ne 0) { throw 'Gate smoke expected item 20406 DisenchantID=0' }
          if (-not $binding -or [uint32]$binding.disenchant_id -le 0) { throw 'Gate smoke expected item 41316 DisenchantID>0' }
          $safe = @(Import-Csv "$env:RUNNER_TEMP/safe.csv")
          if ($safe.item_id -contains '20406') { throw 'V5 gate failed: 20406 leaked into safe candidates' }
          if (-not ($safe.item_id -contains '41316')) { throw 'V5 gate failed: 41316 missing from safe candidates' }
          Write-Host '[V5-GATE-SMOKE] PASS 20406=BLOCKED 41316=ALLOWED'

      - name: Select DE V5 live entrypoint
        shell: bash
        run: |
          set -euo pipefail
          MAIN='probes/Wow112HeadlessAndroid/src/main.rs'
          grep -q 'mod world_poc07_vendorlive;' "$MAIN"
          grep -q 'world_poc07_vendorlive::login_poc07_vendorlive' "$MAIN"
          sed -i 's/mod world_poc07_vendorlive;/mod world_poc07_delive_v5;/' "$MAIN"
          sed -i 's/world_poc07_vendorlive::login_poc07_vendorlive/world_poc07_delive_v5::login_poc07_delive_v5/' "$MAIN"

      - name: Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;27.2.12479018'

      - name: Build POC07 DE V5 x86_64 Android
        shell: bash
        run: |
          set -euo pipefail
          LINKER="${ANDROID_SDK_ROOT}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$LINKER"
          export CC_x86_64_linux_android="$LINKER"
          cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release --target x86_64-linux-android

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN='probes/Wow112HeadlessAndroid/target/x86_64-linux-android/release/wow112-headless-android-probe'
          mkdir -p dist/poc07-de-v5
          cp "$BIN" dist/poc07-de-v5/wow112-headless-android-probe
          cp probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs dist/poc07-de-v5/world_poc07_delive_v5.rs
          cp probes/Wow112HeadlessAndroid/tools/poc07_de_v5_patch.py dist/poc07-de-v5/poc07_de_v5_patch.py
          cp probes/Wow112HeadlessAndroid/tools/RESOLVE_OCTOWOW_DE_GATE.ps1 dist/poc07-de-v5/RESOLVE_OCTOWOW_DE_GATE.ps1
          BIN_SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          {
            echo 'POC=07-DE-LIVE-V5-EXACT-GATED-SCAN'
            echo "REPOSITORY=${GITHUB_REPOSITORY}"
            echo "BRANCH=${GITHUB_REF_NAME}"
            echo "EXACT_SHA=${GITHUB_SHA}"
            echo 'TARGET=x86_64-linux-android'
            echo 'ANDROID_API=21'
            echo "BINARY_SHA256=${BIN_SHA}"
            echo 'MUTATION=DISABLED'
            echo 'DE_MODEL=V4_STRICT_ITEMLEVEL'
            echo 'CANDIDATE_EXPORT=CSV'
            echo 'DISENCHANT_GATE=CAPYDB_TURTLE_MIRROR_EXACT_DISENCHANT_ID'
            echo 'DIRECT_OCTOWOW_HTTP=NOT_USED_ANTI_BOT'
            echo 'GATE_FAIL_CLOSED=YES'
            echo 'UNKNOWN_CUSTOM_ITEM=NO_SAFE_CANDIDATE'
          } > dist/poc07-de-v5/BUILD_INFO.txt
          (cd dist/poc07-de-v5 && sha256sum * > SHA256SUMS.txt)
          cat dist/poc07-de-v5/BUILD_INFO.txt

      - name: Upload POC07 DE V5 binary
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Android-POC07-DE-V5-${{ github.sha }}
          path: dist/poc07-de-v5
          if-no-files-found: error
          retention-days: 7
