name: TEMP apply updater testpoint patch

on:
  push:
    branches:
      - feature/updater-testpoint-ping-v1

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/updater-testpoint-ping-v1
          fetch-depth: 0
      - name: Apply exact patch
        run: python tools/apply_updater_testpoint_patch.py
      - name: Remove temporary patch machinery
        run: |
          rm tools/apply_updater_testpoint_patch.py
          rm .github/workflows/tmp_apply_updater_testpoint_patch.yml
      - name: Commit patched tree
        run: |
          git config user.name "wow112-ai-patch"
          git config user.email "github12wykrzyk@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(updater): honor frozen parallel testpoint and emit live ping"
          git push origin HEAD:feature/updater-testpoint-ping-v1
