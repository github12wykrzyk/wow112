name: Recover SpeedFloor v0.4 source

on:
  push:
    paths:
      - '.github/workflows/recover_speedfloor_source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover terminal XZ stream and exact SpeedFloor source
        shell: python
        run: |
          import base64, hashlib, io, lzma, pathlib, subprocess, tarfile, zipfile

          TARGET='WoWNonPvPSpeedFloor_v0_4_ALWAYS_FLOOR7_1_DIAG.c'
          WANT='4766f7057415cc41458b33ba8e07221906c955b3abc602a53f818d914fc870a3'
          D='archives/V68_FULL_NO_EXE_BUNDLE_B64'
          FIX='archives/V68_BUNDLE_FIXUPS/part015_0.txt'
          OUT=pathlib.Path('recovery_out'); OUT.mkdir(exist_ok=True)
          report=[]

          def sh(*a,text=False): return subprocess.check_output(list(a),text=text,stderr=subprocess.DEVNULL)
          def clean(s): return ''.join(c for c in s if c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def strict_dec(s): return base64.b64decode(clean(s),validate=True)
          def accept(data,origin):
              h=hashlib.sha256(data).hexdigest(); report.append(f'CANDIDATE {origin} size={len(data)} sha256={h}')
              if h==WANT:
                  (OUT/TARGET).write_bytes(data); report.append(f'EXACT_MATCH {origin}'); return True
              return False
          def inspect_blob(blob,label):
              report.append(f'DECOMPRESSED {label} size={len(blob)} magic={blob[:16].hex()}')
              if zipfile.is_zipfile(io.BytesIO(blob)):
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      names=z.namelist(); report.append(f'ZIP members={len(names)}')
                      report.append('ZIP_SPEED='+'|'.join(n for n in names if 'SpeedFloor' in n or 'NonPvP' in n))
                      for n in names:
                          if pathlib.PurePosixPath(n).name==TARGET and accept(z.read(n),label+':'+n): return True
              try:
                  with tarfile.open(fileobj=io.BytesIO(blob),mode='r:*') as t:
                      ms=t.getmembers(); report.append(f'TAR members={len(ms)}')
                      report.append('TAR_SPEED='+'|'.join(m.name for m in ms if 'SpeedFloor' in m.name or 'NonPvP' in m.name))
                      for m in ms:
                          if m.isfile() and pathlib.PurePosixPath(m.name).name==TARGET:
                              f=t.extractfile(m)
                              if f and accept(f.read(),label+':'+m.name): return True
              except Exception as e:
                  report.append(f'NOT_TAR {label} {type(e).__name__}')
              # Nested direct ZIP signatures are also worth testing if wrapper bytes exist.
              p=blob.find(b'PK\x03\x04')
              if p>0 and zipfile.is_zipfile(io.BytesIO(blob[p:])):
                  return inspect_blob(blob[p:],label+f':embedded_zip@{p}')
              return False

          vals=[]
          for i in range(15):
              vals.append(clean(sh('git','show',f'HEAD:{D}/part{i:03d}.txt').decode()))
          prefix=''.join(vals)
          fix=clean(sh('git','show','HEAD:'+FIX).decode())
          report.append(f'prefix_chars={len(prefix)} fix_chars={len(fix)}')

          p15=f'{D}/part015.txt'
          revs=sh('git','log','--all','--format=%H','--',p15,text=True).splitlines()+['HEAD']
          variants=[]; seen=set()
          for rev in revs:
              try: v=clean(sh('git','show',f'{rev}:{p15}').decode())
              except Exception: continue
              h=hashlib.sha256(v.encode()).hexdigest()
              if h not in seen:
                  seen.add(h); variants.append((rev,v))
          report.append('variants='+'|'.join(f'{r[:12]} len={len(v)} eq={[i for i,c in enumerate(v) if c=="="]}' for r,v in variants))

          candidates=[]; cseen=set()
          def add(label,c15):
              c15=clean(c15)
              stream=prefix+c15
              if len(stream)%4: return
              # strict Base64: padding only at the very end.
              if '=' in stream[:-2]: return
              h=hashlib.sha256(c15.encode()).hexdigest()
              if h in cseen: return
              cseen.add(h); candidates.append((label,c15))

          # Strong hypothesis from the archive math: 120002 compressed bytes => 160004 Base64 chars,
          # so logical part015 is 10004 chars. Test every surviving 5004-char complement against verified 015a.
          for rev,v in variants:
              for off in range(0,max(0,len(v)-5004+1)):
                  w=v[off:off+5004]
                  add(f'fix+win5004:{rev[:8]}:{off}',fix+w)
                  add(f'win5004+fix:{rev[:8]}:{off}',w+fix)
              # Also test the exact natural split/tail shapes explicitly for auditability.
              if len(v)>=10004:
                  add(f'fix+v5000_10004:{rev[:8]}',fix+v[5000:10004])
                  add(f'fix+last5004:{rev[:8]}',fix+v[-5004:])

          report.append(f'terminal_candidates={len(candidates)}')
          recovered=False
          for label,c15 in candidates:
              stream=prefix+c15
              try: raw=strict_dec(stream)
              except Exception: continue
              if not raw.startswith(b'\xfd7zXZ\x00'): continue
              try:
                  d=lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
                  blob=d.decompress(raw)
              except lzma.LZMAError:
                  continue
              if not d.eof: continue
              report.append(f'XZ_EOF {label} b64={len(stream)} raw={len(raw)} out={len(blob)} unused={len(d.unused_data)} c15sha={hashlib.sha256(c15.encode()).hexdigest()}')
              if d.unused_data: continue
              if inspect_blob(blob,label):
                  recovered=True; break

          rp=OUT/'RECOVERY_REPORT.txt'; rp.write_text('\n'.join(report)+'\n',encoding='utf-8'); print(rp.read_text())
          target=OUT/TARGET
          if not target.exists(): raise SystemExit('No exact source in recovered terminal XZ candidates')
          h=hashlib.sha256(target.read_bytes()).hexdigest(); print(f'VERIFIED_EXACT_SOURCE sha256={h} size={target.stat().st_size}')
          if h!=WANT: raise SystemExit('hash mismatch')

      - name: Upload recovery report/source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedFloor-v0.4-source-recovery
          path: recovery_out/
          if-no-files-found: warn
