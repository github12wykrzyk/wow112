name: Recover SpeedFloor v0.4 source

on:
  push:
    paths:
      - '.github/workflows/recover_speedfloor_source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact source from recovered TAR record
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess

          TARGET='WoWNonPvPSpeedFloor_v0_4_ALWAYS_FLOOR7_1_DIAG.c'
          TAR_NAME=('./source/'+TARGET).encode('ascii')
          WANT='4766f7057415cc41458b33ba8e07221906c955b3abc602a53f818d914fc870a3'
          D='archives/V68_FULL_NO_EXE_BUNDLE_B64'
          FIX='archives/V68_BUNDLE_FIXUPS/part015_0.txt'
          OUT=pathlib.Path('recovery_out'); OUT.mkdir(exist_ok=True)
          report=[]

          def sh(*a,text=False): return subprocess.check_output(list(a),text=text,stderr=subprocess.DEVNULL)
          def clean(s): return ''.join(c for c in s if c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def tar_octal(field):
              raw=field.split(b'\0',1)[0].strip() or b'0'
              return int(raw,8)
          def tar_checksum_ok(hdr):
              if len(hdr)!=512: return False
              try: stored=tar_octal(hdr[148:156])
              except Exception: return False
              calc=sum(hdr[:148])+sum(b'        ')+sum(hdr[156:])
              return stored==calc

          prefix=''.join(clean(sh('git','show',f'HEAD:{D}/part{i:03d}.txt').decode()) for i in range(15))
          fix=clean(sh('git','show','HEAD:'+FIX).decode())
          p15=f'{D}/part015.txt'
          revs=sh('git','log','--all','--format=%H','--',p15,text=True).splitlines()+['HEAD']
          bylen={}
          for rev in revs:
              try: v=clean(sh('git','show',f'{rev}:{p15}').decode())
              except Exception: continue
              bylen.setdefault(len(v),(rev,v))

          # Any of these five prefixes reaches the target TAR member before their divergence point.
          specs=[]
          if 10005 in bylen:
              v=bylen[10005][1]
              for off in (2702,2936,3667,5000): specs.append((f'cur10005_off{off}',fix+v[off:off+5000]))
          if 10593 in bylen:
              v=bylen[10593][1]
              specs.append(('old10593_off5148',fix+v[5148:5148+5000]))

          recovered=False
          for label,c15 in specs:
              if len(c15)!=10000 or '=' in c15: continue
              raw=base64.b64decode(prefix+c15,validate=True)
              d=lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              blob=d.decompress(raw)
              q=blob.find(TAR_NAME)
              report.append(f'PREFIX {label} raw={len(raw)} out={len(blob)} eof={d.eof} tar_name_off={q}')
              if q<0: continue
              # TAR filename field starts at byte 0 of its 512-byte header.
              hdr_start=q
              hdr=blob[hdr_start:hdr_start+512]
              if len(hdr)!=512:
                  report.append(f'TAR_HEADER_TRUNCATED {label}'); continue
              size=tar_octal(hdr[124:136])
              mode=hdr[100:108].split(b'\0',1)[0].decode('ascii','replace')
              chkok=tar_checksum_ok(hdr)
              data_start=hdr_start+512
              data_end=data_start+size
              report.append(f'TAR_HEADER {label} off={hdr_start} mode={mode} size={size} checksum_ok={chkok} data_end={data_end} available={len(blob)}')
              if not chkok or data_end>len(blob): continue
              data=blob[data_start:data_end]
              got=hashlib.sha256(data).hexdigest()
              report.append(f'SOURCE_CANDIDATE {label} size={len(data)} sha256={got}')
              if got==WANT:
                  (OUT/TARGET).write_bytes(data)
                  report.append(f'EXACT_MATCH {label}')
                  recovered=True
                  break

          rp=OUT/'RECOVERY_REPORT.txt'; rp.write_text('\n'.join(report)+'\n',encoding='utf-8'); print(rp.read_text())
          target=OUT/TARGET
          if not recovered or not target.exists(): raise SystemExit('TAR member found but exact source hash did not verify')
          h=hashlib.sha256(target.read_bytes()).hexdigest()
          print(f'VERIFIED_EXACT_SOURCE sha256={h} size={target.stat().st_size}')
          if h!=WANT: raise SystemExit('hash mismatch')

      - name: Upload recovered exact source
        uses: actions/upload-artifact@v4
        with:
          name: SpeedFloor-v0.4-source-recovery
          path: recovery_out/
          if-no-files-found: error
