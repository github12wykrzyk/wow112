name: Recover SpeedFloor v0.4 source

on:
  push:
    paths:
      - '.github/workflows/recover_speedfloor_source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact source from natural repaired 015 split
        shell: python
        run: |
          import base64, hashlib, io, lzma, pathlib, subprocess, tarfile, zipfile

          TARGET='WoWNonPvPSpeedFloor_v0_4_ALWAYS_FLOOR7_1_DIAG.c'
          WANT='4766f7057415cc41458b33ba8e07221906c955b3abc602a53f818d914fc870a3'
          D='archives/V68_FULL_NO_EXE_BUNDLE_B64'
          FIX='archives/V68_BUNDLE_FIXUPS/part015_0.txt'
          OUT=pathlib.Path('recovery_out'); OUT.mkdir(exist_ok=True)
          report=[]

          def sh(*a,text=False): return subprocess.check_output(list(a),text=text,stderr=subprocess.DEVNULL)
          def clean(s): return ''.join(c for c in s if c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def accept(data,origin):
              h=hashlib.sha256(data).hexdigest(); report.append(f'CANDIDATE {origin} size={len(data)} sha256={h}')
              if h==WANT:
                  (OUT/TARGET).write_bytes(data); report.append(f'EXACT_MATCH {origin}'); return True
              return False
          def inspect(blob,label):
              report.append(f'DECOMPRESSED {label} size={len(blob)} magic={blob[:16].hex()}')
              if zipfile.is_zipfile(io.BytesIO(blob)):
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      names=z.namelist(); report.append(f'ZIP members={len(names)}')
                      report.append('ZIP_SPEED='+'|'.join(n for n in names if 'SpeedFloor' in n or 'NonPvP' in n))
                      for n in names:
                          if pathlib.PurePosixPath(n).name==TARGET and accept(z.read(n),label+':'+n): return True
              try:
                  with tarfile.open(fileobj=io.BytesIO(blob),mode='r:*') as t:
                      ms=t.getmembers(); report.append(f'TAR members={len(ms)}')
                      report.append('TAR_SPEED='+'|'.join(m.name for m in ms if 'SpeedFloor' in m.name or 'NonPvP' in m.name))
                      for m in ms:
                          if m.isfile() and pathlib.PurePosixPath(m.name).name==TARGET:
                              f=t.extractfile(m)
                              if f and accept(f.read(),label+':'+m.name): return True
              except Exception as e:
                  report.append(f'NOT_TAR {label} {type(e).__name__}')
              return False
          def test(label,stream):
              s=clean(stream)
              # tolerate historical redundant trailing '=' but never padding in the middle
              first=s.find('=')
              if first!=-1 and any(c!='=' for c in s[first:]):
                  report.append(f'REJECT_MIDPAD {label} len={len(s)} firsteq={first}'); return False
              try: raw=base64.b64decode(s,validate=False)
              except Exception as e:
                  report.append(f'B64_FAIL {label} len={len(s)} {type(e).__name__}'); return False
              report.append(f'B64_OK {label} chars={len(s)} raw={len(raw)} tail={s[-8:]}')
              if not raw.startswith(b'\xfd7zXZ\x00'): return False
              try:
                  d=lzma.LZMADecompressor(format=lzma.FORMAT_XZ); blob=d.decompress(raw)
              except Exception as e:
                  report.append(f'XZ_FAIL {label} {type(e).__name__}'); return False
              report.append(f'XZ_STATE {label} eof={d.eof} out={len(blob)} unused={len(d.unused_data)}')
              if not d.eof or d.unused_data: return False
              return inspect(blob,label)

          prefix=''.join(clean(sh('git','show',f'HEAD:{D}/part{i:03d}.txt').decode()) for i in range(15))
          fix=clean(sh('git','show','HEAD:'+FIX).decode())
          p15=f'{D}/part015.txt'
          revs=sh('git','log','--all','--format=%H','--',p15,text=True).splitlines()+['HEAD']
          variants=[]; seen=set()
          for rev in revs:
              try: v=clean(sh('git','show',f'{rev}:{p15}').decode())
              except Exception: continue
              h=hashlib.sha256(v.encode()).hexdigest()
              if h not in seen: seen.add(h); variants.append((rev,v))
          report.append(f'prefix={len(prefix)} fix={len(fix)}')
          report.append('variants='+'|'.join(f'{r[:12]}:{len(v)}:eq={[i for i,c in enumerate(v) if c=="="]}' for r,v in variants))

          exact=[]
          for rev,v in variants:
              tag=rev[:8]
              if len(v)>=5000:
                  exact.append((f'fix+v[5000:]:{tag}',prefix+fix+v[5000:]))
              if len(v)>=5001:
                  exact.append((f'fix+v[5000:-1]:{tag}',prefix+fix+v[5000:-1]))
                  exact.append((f'fix+v[5001:]:{tag}',prefix+fix+v[5001:]))
              if len(v)>=10004:
                  exact.append((f'fix+v[5000:10004]:{tag}',prefix+fix+v[5000:10004]))
                  exact.append((f'fix+v[-5004:]:{tag}',prefix+fix+v[-5004:]))
              if len(v)>=10005:
                  exact.append((f'fix+v[5000:10005]:{tag}',prefix+fix+v[5000:10005]))

          dedup=set(); recovered=False
          for label,stream in exact:
              h=hashlib.sha256(clean(stream).encode()).hexdigest()
              if h in dedup: continue
              dedup.add(h)
              if test(label,stream): recovered=True; break

          rp=OUT/'RECOVERY_REPORT.txt'; rp.write_text('\n'.join(report)+'\n',encoding='utf-8'); print(rp.read_text())
          target=OUT/TARGET
          if not target.exists(): raise SystemExit('Natural 015a+015b variants did not recover exact source')
          h=hashlib.sha256(target.read_bytes()).hexdigest(); print(f'VERIFIED_EXACT_SOURCE sha256={h} size={target.stat().st_size}')
          if h!=WANT: raise SystemExit('hash mismatch')

      - name: Upload recovery report/source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedFloor-v0.4-source-recovery
          path: recovery_out/
          if-no-files-found: warn
