name: Recover SpeedFloor v0.4 source

on:
  push:
    paths:
      - '.github/workflows/recover_speedfloor_source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact source using verified V68 fixup
        shell: python
        run: |
          import base64, hashlib, io, lzma, pathlib, re, subprocess, tarfile, zipfile

          TARGET='WoWNonPvPSpeedFloor_v0_4_ALWAYS_FLOOR7_1_DIAG.c'
          WANT='4766f7057415cc41458b33ba8e07221906c955b3abc602a53f818d914fc870a3'
          D='archives/V68_FULL_NO_EXE_BUNDLE_B64'
          FIX='archives/V68_BUNDLE_FIXUPS/part015_0.txt'
          OUT=pathlib.Path('recovery_out'); OUT.mkdir(exist_ok=True)
          report=[]

          def sh(*a,text=False): return subprocess.check_output(list(a),text=text,stderr=subprocess.DEVNULL)
          def clean(s): return ''.join(c for c in s if c in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          def dec(s):
              s=clean(s); s += '='*((-len(s))%4)
              return base64.b64decode(s,validate=False)
          def nkey(s): return [int(x) if x.isdigit() else x for x in re.split(r'(\d+)',pathlib.PurePosixPath(s).name)]
          def accept(data,origin):
              h=hashlib.sha256(data).hexdigest(); report.append(f'CANDIDATE {origin} size={len(data)} sha256={h}')
              if h==WANT:
                  (OUT/TARGET).write_bytes(data); report.append(f'EXACT_MATCH {origin}'); return True
              return False
          def inspect_archive(raw,label):
              try: blob=lzma.decompress(raw)
              except Exception: return False
              report.append(f'XZ_OK {label} compressed={len(raw)} decompressed={len(blob)} magic={blob[:8].hex()}')
              if zipfile.is_zipfile(io.BytesIO(blob)):
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      names=z.namelist(); report.append(f'ZIP members={len(names)} speed={"|".join(n for n in names if "SpeedFloor" in n)}')
                      for n in names:
                          if pathlib.PurePosixPath(n).name==TARGET and accept(z.read(n),label+':'+n): return True
              try:
                  with tarfile.open(fileobj=io.BytesIO(blob),mode='r:*') as t:
                      ms=t.getmembers(); report.append(f'TAR members={len(ms)} speed={"|".join(m.name for m in ms if "SpeedFloor" in m.name)}')
                      for m in ms:
                          if m.isfile() and pathlib.PurePosixPath(m.name).name==TARGET:
                              f=t.extractfile(m)
                              if f and accept(f.read(),label+':'+m.name): return True
              except Exception: pass
              return False

          paths=sh('git','ls-tree','-r','--name-only','HEAD',D,text=True).splitlines()
          parts=sorted([p for p in paths if re.search(r'part\d+\.txt$',p)],key=nkey)
          vals={pathlib.PurePosixPath(p).name:clean(sh('git','show','HEAD:'+p).decode()) for p in parts}
          fix=clean(sh('git','show','HEAD:'+FIX).decode())
          report.append(f'fix_len={len(fix)} fix_eq={fix.count("=")}')
          report.append('parts='+'|'.join(f'{k}:{len(v)}:eq{v.count("=")}' for k,v in vals.items()))

          # Recover every historical variant of part015.
          p15=f'{D}/part015.txt'
          commits=sh('git','log','--all','--format=%H','--',p15,text=True).splitlines()+['HEAD']
          variants=[]; seen=set()
          for rev in commits:
              try: v=clean(sh('git','show',f'{rev}:{p15}').decode())
              except Exception: continue
              h=hashlib.sha256(v.encode()).hexdigest()
              if h not in seen:
                  seen.add(h); variants.append((rev,v))
          report.append('p15_variants='+'|'.join(f'{r[:12]}:{len(v)}:eqpos={",".join(map(str,[i for i,c in enumerate(v) if c=="="]))}' for r,v in variants))

          prefix=''.join(vals[f'part{i:03d}.txt'] for i in range(15))
          suffix=''.join(vals[f'part{i:03d}.txt'] for i in range(16,23))
          report.append(f'prefix={len(prefix)} suffix={len(suffix)} suffix_eqpos={",".join(map(str,[i for i,c in enumerate(suffix) if c=="="]))}')

          candidates=[]; cseen=set()
          def add(label,c):
              c=clean(c)
              if len(c)!=10000 or '=' in c: return
              h=hashlib.sha256(c.encode()).hexdigest()
              if h not in cseen: cseen.add(h); candidates.append((label,c))

          # Most likely interpretation of part015_0: verified first 5000 chars (015a).
          for rev,v in variants:
              add(f'fix+first5000:{rev[:12]}',fix+v[:5000])
              add(f'fix+last5000:{rev[:12]}',fix+v[-5000:])
              add(f'first5000+fix:{rev[:12]}',v[:5000]+fix)
              add(f'last5000+fix:{rev[:12]}',v[-5000:]+fix)
              # If 5/593 bad characters were inserted, slide the complementary 5000-char window.
              for off in range(0,len(v)-4999):
                  w=v[off:off+5000]
                  if '=' in w: continue
                  add(f'fix+win:{rev[:8]}:{off}',fix+w)
                  add(f'win+fix:{rev[:8]}:{off}',w+fix)

          report.append(f'chunk15_candidates={len(candidates)}')
          for idx,(label,c15) in enumerate(candidates):
              stream=prefix+c15+suffix
              # A valid single Base64 stream may only have padding at its final tail.
              mids=stream[:-4].find('=')
              if mids!=-1: continue
              try: raw=dec(stream)
              except Exception: continue
              if not raw.startswith(b'\xfd7zXZ\x00'): continue
              if inspect_archive(raw,f'{label} idx={idx}'):
                  break

          rp=OUT/'RECOVERY_REPORT.txt'; rp.write_text('\n'.join(report)+'\n',encoding='utf-8'); print(rp.read_text())
          target=OUT/TARGET
          if not target.exists(): raise SystemExit('Exact source not recovered with verified 015a fixup')
          h=hashlib.sha256(target.read_bytes()).hexdigest(); print(f'VERIFIED_EXACT_SOURCE sha256={h} size={target.stat().st_size}')
          if h!=WANT: raise SystemExit('hash mismatch')

      - name: Upload recovered exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedFloor-v0.4-source-recovery
          path: recovery_out/
          if-no-files-found: warn
