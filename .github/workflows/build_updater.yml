name: Build WoW112 updater

on:
  push:
    branches:
      - parallel
      - 'feature/**'
    paths:
      - 'tools/updater/**'
      - 'probes/Wow112HeadlessAndroid/**'
      - '.github/workflows/build_updater.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-wow112-updater-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-updater:
    runs-on: windows-2022
    steps:
      - name: Checkout current tree
        uses: actions/checkout@v5

      - name: Verify current repository state
        shell: pwsh
        run: python tools/verify_current.py

      - name: Build terminal portal clicker x86
        if: ${{ hashFiles('probes/Wow112HeadlessAndroid/Cargo.toml') != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup target add i686-pc-windows-msvc
          cargo check --target i686-pc-windows-msvc --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "terminal portal cargo check failed" }
          cargo build --release --target i686-pc-windows-msvc --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "terminal portal cargo build failed" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/i686-pc-windows-msvc/release/wow112-headless-android-probe.exe dist/WoW112TerminalPortalClicker.exe

      - name: Compile WinForms updater and bootstrap x86
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio/MSBuild installation not found" }
          $csc = Join-Path $vs 'MSBuild\Current\Bin\Roslyn\csc.exe'
          if (-not (Test-Path $csc)) { throw "Roslyn csc.exe not found: $csc" }
          $ref = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          if (-not (Test-Path $ref)) { throw ".NET Framework 4.8 reference assemblies not found" }

          & $csc /nologo /target:winexe /platform:x86 /optimize+ /langversion:latest `
            /out:dist\WoW112UpdaterBootstrap.exe `
            /reference:"$ref\mscorlib.dll" `
            /reference:"$ref\System.dll" `
            /reference:"$ref\System.Core.dll" `
            tools\updater\UpdaterBootstrap.cs
          if ($LASTEXITCODE -ne 0) { throw "bootstrap csc failed with exit code $LASTEXITCODE" }

          & $csc /nologo /target:winexe /platform:x86 /optimize+ /langversion:latest `
            /out:dist\WoW112ParallelUpdater.exe `
            /win32manifest:tools\updater\Updater.manifest `
            /reference:"$ref\mscorlib.dll" `
            /reference:"$ref\System.dll" `
            /reference:"$ref\System.Core.dll" `
            /reference:"$ref\System.Drawing.dll" `
            /reference:"$ref\System.Windows.Forms.dll" `
            /reference:"$ref\System.Net.Http.dll" `
            /reference:"$ref\System.IO.Compression.dll" `
            /reference:"$ref\System.IO.Compression.FileSystem.dll" `
            /reference:"$ref\System.Security.dll" `
            /reference:"$ref\System.Web.Extensions.dll" `
            tools\updater\WoW112Updater.cs `
            tools\updater\UpdaterStableUi.cs `
            tools\updater\UpdaterUiSmoke.cs `
            tools\updater\UpdaterHost.cs `
            tools\updater\UpdaterGitHubMonitor.cs `
            tools\updater\UpdaterReadyQueueBar.cs `
            tools\updater\UpdaterLiveDashboardReconcile.cs `
            tools\updater\UpdaterDllSelectionFeature.cs `
            tools\updater\UpdaterDllCleanupFeature.cs `
            tools\updater\UpdaterSafety.cs `
            tools\updater\UpdaterAddons.cs `
            tools\updater\UpdaterNetworkCompat.cs `
            tools\updater\UpdaterProcessGuard.cs `
            tools\updater\UpdaterRealmlistFeature.cs `
            tools\updater\UpdaterAhEvidenceV2Bootstrap.cs `
            tools\updater\UpdaterAhEvidenceV2Model.cs `
            tools\updater\UpdaterAhEvidenceV2Logic.cs `
            tools\updater\UpdaterAhEvidenceV2Support.cs `
            tools\updater\UpdaterAccountsFeature.cs `
            tools\updater\UpdaterTerminalPortalFeature.cs `
            tools\updater\UpdaterSummonCoordinatorFeature.cs `
            tools\updater\UpdaterEconomyFeature.cs `
            tools\updater\UpdaterMaintenanceFeature.cs `
            tools\updater\UpdaterSummonUnknownReportFeature.cs `
            tools\updater\UpdaterIssueReportFeature.cs
          if ($LASTEXITCODE -ne 0) { throw "updater csc failed with exit code $LASTEXITCODE" }

          & $csc /nologo /target:exe /platform:x86 /optimize+ /langversion:latest `
            /out:dist\UpdaterAttestationTests.exe `
            /reference:"$ref\mscorlib.dll" `
            /reference:"$ref\System.dll" `
            /reference:"$ref\System.Core.dll" `
            tools\updater\UpdaterSafety.cs `
            tools\updater\UpdaterAttestationTests.cs
          if ($LASTEXITCODE -ne 0) { throw "updater attestation test compile failed" }
          & ./dist/UpdaterAttestationTests.exe
          if ($LASTEXITCODE -ne 0) { throw "updater attestation test failed" }

          & $csc /nologo /target:exe /platform:x86 /optimize+ /langversion:latest `
            /out:dist\UpdaterAddonsTests.exe `
            /reference:"$ref\mscorlib.dll" `
            /reference:"$ref\System.dll" `
            /reference:"$ref\System.Core.dll" `
            /reference:"$ref\System.IO.Compression.dll" `
            /reference:"$ref\System.IO.Compression.FileSystem.dll" `
            /reference:"$ref\System.Web.Extensions.dll" `
            tools\updater\UpdaterSafety.cs `
            tools\updater\UpdaterAddons.cs `
            tools\updater\UpdaterAddonsTests.cs
          if ($LASTEXITCODE -ne 0) { throw "updater addon test compile failed" }
          & ./dist/UpdaterAddonsTests.exe
          if ($LASTEXITCODE -ne 0) { throw "updater addon tests failed" }

      - name: Render and verify Windows dashboard
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/WoW112ParallelUpdater.exe -ArgumentList '--ui-smoke', 'dist/ui-checks' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'GUI smoke test timed out' }
          if ($process.ExitCode -ne 0) {
            Get-Content dist/ui-checks/failure.txt -ErrorAction SilentlyContinue
            throw 'GUI smoke test failed'
          }
          Get-Content dist/ui-checks/result.txt

      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Updater-UI-evidence-${{ github.sha }}
          path: dist/ui-checks
          if-no-files-found: warn

      - name: Verify updater and terminal PE32 x86 and hashes
        shell: pwsh
        run: |
          @'
          import hashlib, json, re, struct
          from pathlib import Path

          def inspect(path):
              p = Path(path)
              data = p.read_bytes()
              if data[:2] != b'MZ':
                  raise SystemExit(f'{p}: not an MZ executable')
              pe = struct.unpack_from('<I', data, 0x3C)[0]
              if data[pe:pe+4] != b'PE\0\0':
                  raise SystemExit(f'{p}: missing PE signature')
              machine = struct.unpack_from('<H', data, pe + 4)[0]
              if machine != 0x014C:
                  raise SystemExit(f'{p}: expected x86 machine 0x014C, got 0x{machine:04X}')
              return data, machine

          version_source = Path('tools/updater/UpdaterSafety.cs').read_text(encoding='utf-8')
          match = re.search(r'public const string Version\s*=\s*"([^"]+)"', version_source)
          if not match:
              raise SystemExit('UpdaterBuildInfo.Version not found')
          updater_version = match.group(1)

          updater = Path('dist/WoW112ParallelUpdater.exe')
          bootstrap = Path('dist/WoW112UpdaterBootstrap.exe')
          terminal = Path('dist/WoW112TerminalPortalClicker.exe')
          updater_data, updater_machine = inspect(updater)
          bootstrap_data, bootstrap_machine = inspect(bootstrap)
          terminal_data, terminal_machine = inspect(terminal)
          meta = {
              'name': updater.name,
              'updater_version': updater_version,
              'self_update_protocol': 1,
              'sha256': hashlib.sha256(updater_data).hexdigest(),
              'size': len(updater_data),
              'pe_machine': f'0x{updater_machine:04X}',
              'bootstrap_name': bootstrap.name,
              'bootstrap_sha256': hashlib.sha256(bootstrap_data).hexdigest(),
              'bootstrap_size': len(bootstrap_data),
              'bootstrap_pe_machine': f'0x{bootstrap_machine:04X}',
              'terminal_portal_name': terminal.name,
              'terminal_portal_sha256': hashlib.sha256(terminal_data).hexdigest(),
              'terminal_portal_size': len(terminal_data),
              'terminal_portal_pe_machine': f'0x{terminal_machine:04X}',
              'git_sha': '${{ github.sha }}',
              'channel': '${{ github.ref_name }}',
          }
          Path('dist/updater_build.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, indent=2))
          '@ | python -

      - name: Copy updater README
        shell: pwsh
        run: Copy-Item tools\updater\README.md dist\README_UPDATER.md

      - name: Upload updater
        uses: actions/upload-artifact@v4
        with:
          name: WoW112ParallelUpdater-${{ github.sha }}
          path: |
            dist/WoW112ParallelUpdater.exe
            dist/WoW112UpdaterBootstrap.exe
            dist/WoW112TerminalPortalClicker.exe
            dist/updater_build.json
            dist/README_UPDATER.md
          if-no-files-found: error
          compression-level: 0
