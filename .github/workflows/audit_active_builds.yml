name: Persist verified active build routing

on:
  push:
    branches:
      - work
    paths:
      - '.github/workflows/audit_active_builds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Apply source-equivalent AutoLoot clang asm formatting
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/AutoLootPP/WoWAutoLootPP_v0_14_PP300YD_HU_ATTACKABLE_LEVELGATE3_NOSKIP_SELECTORCHECK_RECONSTRUCTED.c')
          s=p.read_text(encoding='utf-8')
          old='    __asm { mov eax, fs:[30h] mov peb, eax }'
          new='    __asm mov eax, fs:[30h]\n    __asm mov peb, eax'
          if s.count(old)!=1:
              raise SystemExit('expected exact one-line clang asm pattern not found once')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

      - name: Reconfirm AutoLoot x86 build
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          clang-cl --target=i686-pc-windows-msvc /nologo /c /O2 /GS- /GR- /EHsc- /Zl /Brepro /clang:-fno-builtin /Fo"AutoLootPP.obj" "src/AutoLootPP/WoWAutoLootPP_v0_14_PP300YD_HU_ATTACKABLE_LEVELGATE3_NOSKIP_SELECTORCHECK_RECONSTRUCTED.c"
          if errorlevel 1 exit /b 1
          link /nologo /DLL /MACHINE:X86 /NODEFAULTLIB /ENTRY:DllMain@12 /Brepro /OUT:"AutoLootPP.dll" "AutoLootPP.obj"
          if errorlevel 1 exit /b 1
          dumpbin /headers "AutoLootPP.dll" | findstr /C:"14C machine (x86)"
          if errorlevel 1 exit /b 1

      - name: Record verified build profiles and refreshed AutoLoot source hash
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          rp=Path('runtime/current.json')
          runtime=json.loads(rp.read_text(encoding='utf-8'))
          profiles={
            'WoWStealthCDGuardian_5875_v2_HARD5S_WATCHDOG.dll':'msvc_x86_crtless',
            'PickPocketSelectiveRange_5875_v10_PP300_PICKLOCK300_9YD.dll':'msvc_x86_crtless',
            'WoWNonPvPSpeedFloor_v0_4_ALWAYS_FLOOR7_1_DIAG.dll':'clangcl_i686_crtless',
            'WoWAutoLootPP_v0_14_PP300YD_HU_ATTACKABLE_LEVELGATE3_NOSKIP_SELECTORCHECK.dll':'clangcl_i686_crtless',
            'WoWLongPickPocket_v1_0_ALLRANGE_360FACING_HARDLOS025.dll':'clangcl_i686_crtless',
            'MovementCore_V68_MINING_HARDLOS_COMBAT_AUTOPP_F11_BLACKLIST_HARDLOS3D_REARONLY_RETRY.dll':'clangcl_i686_crtless',
          }
          auto='WoWAutoLootPP_v0_14_PP300YD_HU_ATTACKABLE_LEVELGATE3_NOSKIP_SELECTORCHECK.dll'
          for item in runtime['active_dlls']:
              name=item['name']
              if name in profiles:
                  item['build_recipe']={
                    'tool':'tools/build_active_module.py',
                    'profile':profiles[name],
                    'status':'verified_x86_candidate_build'
                  }
              if name==auto:
                  p=Path(item['source_path'])
                  data=p.read_bytes()
                  item['source_sha256']=hashlib.sha256(data).hexdigest()
                  item['source_size']=len(data)
                  print('AutoLoot source',item['source_sha256'],item['source_size'])
          rp.write_text(json.dumps(runtime,indent=2)+'\n',encoding='utf-8')

      - name: Commit verified source/build metadata candidate
        shell: bash
        run: |
          git config user.name 'github12wykrzyk'
          git config user.email '102224296+github12wykrzyk@users.noreply.github.com'
          git add runtime/current.json src/AutoLootPP/WoWAutoLootPP_v0_14_PP300YD_HU_ATTACKABLE_LEVELGATE3_NOSKIP_SELECTORCHECK_RECONSTRUCTED.c
          git commit -m 'infra: record verified x86 build profiles'
          git push origin HEAD:work
