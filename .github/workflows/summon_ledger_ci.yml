name: Summon Ledger CI

on:
  push:
    branches:
      - 'feature/summon-ledger-v1'
    paths:
      - 'services/summon_ledger/**'
      - 'runtime/parallel_tasks/summon-ledger-v1.json'
      - '.github/workflows/summon_ledger_ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/summon_ledger/**'
      - 'runtime/parallel_tasks/summon-ledger-v1.json'
      - '.github/workflows/summon_ledger_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Unit, durability and 50k performance tests
        run: python -m unittest discover -s services/summon_ledger/tests -p "test_*.py" -v
