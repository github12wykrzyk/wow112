name: Fast hotfix slave 1-5 + Silithus

on:
  push:
    branches:
      - feature/summon-slave1-5-silithus-hotfix-v1
    paths:
      - .github/workflows/fast_hotfix_slave_silithus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s, encoding='utf-8', newline='')
          def rep(s, old, new, label):
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {n}')
              return s.replace(old,new,1)

          p='src/AutoSummonAssist/WoWAutoSummonAssist_5875_v1.c'
          s=read(p)
          old='''    /* SLAVE is a hard role only for the level-1 helper alt. It always keeps\n     * portal assist and Anti-AFK enabled; GUI/profile writes cannot turn them off. */\n    if(level==1u) {\n        g_summonRole=1u;\n        g_roleUserSelected=0u;\n        if(!g_enabled) g_enabled=1u;\n        if(!g_antiAfkEnabled) antiAfkSetEnabled(1u);\n        return;\n    }\n\n    /* Above level 1 there is no SLAVE role. Level 20 keeps the historical\n     * MASTER default for a fresh world session, but the user may toggle it to\n     * NONE. Other levels default to NONE and may opt into MASTER. */\n    if(g_summonRole==1u) g_summonRole=0u;\n    if(!g_roleUserSelected) g_summonRole=(level==20u)?2u:0u;\n    if(g_enabled) {\n        g_enabled=0u;\n        resetPortal();\n    }'''
          new='''    /* Level 1 remains the forced helper SLAVE. Levels 2-5 may opt into\n     * SLAVE manually. Any active SLAVE keeps portal assist and Anti-AFK ON. */\n    if(level==1u) {\n        g_summonRole=1u;\n        g_roleUserSelected=0u;\n        if(!g_enabled) g_enabled=1u;\n        if(!g_antiAfkEnabled) antiAfkSetEnabled(1u);\n        return;\n    }\n\n    if(level>=2u && level<=5u && g_summonRole==1u && g_roleUserSelected) {\n        if(!g_enabled) g_enabled=1u;\n        if(!g_antiAfkEnabled) antiAfkSetEnabled(1u);\n        return;\n    }\n\n    /* Outside an explicitly selected level-2..5 SLAVE profile, preserve the\n     * historical defaults: level 20 starts MASTER, all other levels NONE. */\n    if(g_summonRole==1u) g_summonRole=0u;\n    if(!g_roleUserSelected) g_summonRole=(level==20u)?2u:0u;\n    if(g_enabled) {\n        g_enabled=0u;\n        resetPortal();\n    }'''
          s=rep(s,old,new,'native enforceLevelProfile')

          old='''    /* Level 1 is a forced SLAVE with Anti-AFK ON. Above level 1, SLAVE is\n     * unavailable; level 20 starts as MASTER but may be toggled to NONE. */'''
          new='''    /* Level 1 is forced SLAVE. Levels 2-5 may manually use SLAVE; while\n     * selected it keeps portal assist and Anti-AFK ON. Above level 5 SLAVE is unavailable. */'''
          s=rep(s,old,new,'native timer comment')

          old='''    if(id==32u) {\n        if(v->u32>2u) return 0;\n        if(g_playerLevel==1u) {\n            g_summonRole=1u;\n            g_roleUserSelected=0u;\n            if(!g_enabled) g_enabled=1u;\n            if(!g_antiAfkEnabled) antiAfkSetEnabled(1u);\n            return 1;\n        }\n        if(v->u32==1u) return 0;\n        g_summonRole=v->u32;\n        g_roleUserSelected=1u;\n        if(g_enabled) {\n            g_enabled=0u;\n            resetPortal();\n        }\n        return 1;\n    }\n    if(v->u32>1u) return 0;\n    if(id==1u){\n        u32 wanted=(g_playerLevel==1u)?1u:0u;\n        g_enabled=wanted;\n        if(!g_enabled) resetPortal();\n        return 1;\n    }'''
          new='''    if(id==32u) {\n        if(v->u32>2u) return 0;\n        if(g_playerLevel==1u) {\n            g_summonRole=1u;\n            g_roleUserSelected=0u;\n            if(!g_enabled) g_enabled=1u;\n            if(!g_antiAfkEnabled) antiAfkSetEnabled(1u);\n            return 1;\n        }\n        if(v->u32==1u) {\n            if(g_playerLevel<2u || g_playerLevel>5u) return 0;\n            g_summonRole=1u;\n            g_roleUserSelected=1u;\n            if(!g_enabled) g_enabled=1u;\n            if(!g_antiAfkEnabled) antiAfkSetEnabled(1u);\n            return 1;\n        }\n        g_summonRole=v->u32;\n        g_roleUserSelected=1u;\n        if(g_enabled) {\n            g_enabled=0u;\n            resetPortal();\n        }\n        return 1;\n    }\n    if(v->u32>1u) return 0;\n    if(id==1u){\n        u32 wanted=(g_summonRole==1u)?1u:0u;\n        g_enabled=wanted;\n        if(!g_enabled) resetPortal();\n        return 1;\n    }'''
          s=rep(s,old,new,'native setValue role policy')
          write(p,s)

          p='src/WoWPlayerESP/WoWPlayerESP_v1_3_CHALLENGES.c'
          s=read(p)
          s=rep(s,'if(level.u32!=1u)return FALSE;','if(level.u32<1u||level.u32>5u)return FALSE;','GUI slave guard')
          write(p,s)

          p='tools/verify_parallel_gui_contract.py'
          s=read(p)
          s=rep(s,"'if(level.u32!=1u)return FALSE;'","'if(level.u32<1u||level.u32>5u)return FALSE;'",'GUI verifier')
          write(p,s)

          p='tools/updater/UpdaterSummonCoordinatorFeature.cs'
          s=read(p)
          s=rep(s,
'''                new SummonCoordinatorRouteConfig { Id = "hydraxian", Slot = 1 },\n                new SummonCoordinatorRouteConfig { Id = "hyjal", Slot = 2 },\n                new SummonCoordinatorRouteConfig { Id = "winterspring", Slot = 3 }''',
'''                new SummonCoordinatorRouteConfig { Id = "hydraxian", Slot = 1 },\n                new SummonCoordinatorRouteConfig { Id = "hyjal", Slot = 2 },\n                new SummonCoordinatorRouteConfig { Id = "winterspring", Slot = 3 },\n                new SummonCoordinatorRouteConfig { Id = "silithus", Slot = 4 }''','coordinator defaults')
          s=rep(s,'Version = 4, WorkerAId = "", WorkerBId = "",','Version = 5, WorkerAId = "", WorkerBId = "",','coordinator default version')
          s=rep(s,'if (cfg == null || cfg.Version < 1 || cfg.Version > 4) return fallback;','if (cfg == null || cfg.Version < 1 || cfg.Version > 5) return fallback;','coordinator load bound')
          s=rep(s,'cfg.Version = 4;\n                }\n\n                if (cfg.Routes == null) cfg.Routes = DefaultSummonRoutes();',
'''cfg.Version = 4;\n                }\n\n                if (cfg.Version == 4)\n                {\n                    if (cfg.Routes == null) cfg.Routes = DefaultSummonRoutes();\n                    var hasSilithus = cfg.Routes.Any(r => r != null && string.Equals(r.Id, "silithus", StringComparison.OrdinalIgnoreCase));\n                    var slot4Used = cfg.Routes.Any(r => r != null && r.Slot == 4);\n                    if (!hasSilithus && !slot4Used)\n                        cfg.Routes.Add(new SummonCoordinatorRouteConfig { Id = "silithus", Slot = 4 });\n                    cfg.Version = 5;\n                }\n\n                if (cfg.Routes == null) cfg.Routes = DefaultSummonRoutes();''','coordinator V4 migration')
          s=rep(s,'cfg.Version = 4;\n            var hyjal = cfg.Routes.FirstOrDefault','cfg.Version = 5;\n            var hyjal = cfg.Routes.FirstOrDefault','coordinator save version')
          s=rep(s,'V4: jedna wspólna para slave obsługuje summonerów FIFO. Default: hydraxian=1, hyjal=2, winterspring=3.','V5: jedna wspólna para slave obsługuje summonerów FIFO. Default: hydraxian=1, hyjal=2, winterspring=3, silithus=4.','coordinator footer')
          write(p,s)

          p='src/AddOns/SummonScout/SummonScout_CompetitionSmartHot.lua'
          s=read(p)
          s=rep(s,
'''        "hyjal", "hydraxian", "waterlords", "waterlord", "azshara", "azsh",\n        "winterspring", "everlook", "tanaris", "telabim", "tel abim",''',
'''        "hyjal", "hydraxian", "waterlords", "waterlord", "azshara", "azsh",\n        "winterspring", "silithus", "everlook", "tanaris", "telabim", "tel abim",''','competition Silithus cue')
          write(p,s)

          # Service/display labels: cosmetic but keeps Silithus first-class wherever hot modules use local maps.
          candidates=[
            'src/AddOns/SummonScout/SummonScout_WhisperConfirmSpam.lua',
            'src/AddOns/SummonScout/SummonScout_FallbackRouterHot.lua',
            'src/AddOns/SummonScout/SummonScout_DestinationInfoGuardHot.lua',
            'src/AddOns/SummonScout/SummonScout_PostPaymentOfferHot.lua',
          ]
          for p in candidates:
              s=read(p)
              if 'silithus = "Silithus"' not in s:
                  if 'winterspring = "Winterspring",' in s:
                      s=s.replace('winterspring = "Winterspring",','winterspring = "Winterspring",\n    silithus = "Silithus",',1)
                  elif 'winterspring = "Winterspring" }' in s:
                      s=s.replace('winterspring = "Winterspring" }','winterspring = "Winterspring", silithus = "Silithus" }',1)
                  else:
                      raise SystemExit(f'{p}: could not find Winterspring label anchor')
                  write(p,s)

          # Guarded assertions for the requested behavior.
          native=read('src/AutoSummonAssist/WoWAutoSummonAssist_5875_v1.c')
          assert 'g_playerLevel<2u || g_playerLevel>5u' in native
          assert 'u32 wanted=(g_summonRole==1u)?1u:0u;' in native
          gui=read('src/WoWPlayerESP/WoWPlayerESP_v1_3_CHALLENGES.c')
          assert 'if(level.u32<1u||level.u32>5u)return FALSE;' in gui
          coord=read('tools/updater/UpdaterSummonCoordinatorFeature.cs')
          assert 'Id = "silithus", Slot = 4' in coord and 'cfg.Version = 5;' in coord
          comp=read('src/AddOns/SummonScout/SummonScout_CompetitionSmartHot.lua')
          assert '"winterspring", "silithus", "everlook"' in comp
          print('HOTFIX_PATCH_PASS')
          PY

      - name: Verify parallel GUI contract
        run: python tools/verify_parallel_gui_contract.py

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AutoSummonAssist/WoWAutoSummonAssist_5875_v1.c \
                  src/WoWPlayerESP/WoWPlayerESP_v1_3_CHALLENGES.c \
                  tools/verify_parallel_gui_contract.py \
                  tools/updater/UpdaterSummonCoordinatorFeature.cs \
                  src/AddOns/SummonScout/SummonScout_CompetitionSmartHot.lua \
                  src/AddOns/SummonScout/SummonScout_WhisperConfirmSpam.lua \
                  src/AddOns/SummonScout/SummonScout_FallbackRouterHot.lua \
                  src/AddOns/SummonScout/SummonScout_DestinationInfoGuardHot.lua \
                  src/AddOns/SummonScout/SummonScout_PostPaymentOfferHot.lua
          git diff --cached --check
          git diff --cached --stat
          git commit -m "hotfix(summon): allow slave 1-5 and add silithus route"
          git push origin HEAD:${GITHUB_REF_NAME}
