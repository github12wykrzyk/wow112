name: Fast hotfix slave 1-5 and Silithus

on:
  push:
    branches:
      - feature/summon-slave1-5-silithus-hotfix-v1
    paths:
      - HOTFIX_TRIGGER_SLAVE_SILITHUS.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and run guarded patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/hotfix.py
          python /tmp/hotfix.py

      - name: Verify parallel GUI behavioral contract
        run: python tools/verify_parallel_gui_contract.py

      - name: Diff safety check
        run: git diff --check

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AutoSummonAssist/WoWAutoSummonAssist_5875_v1.c src/WoWPlayerESP/WoWPlayerESP_v1_3_CHALLENGES.c tools/verify_parallel_gui_contract.py tools/updater/UpdaterSummonCoordinatorFeature.cs src/AddOns/SummonScout/SummonScout_CompetitionSmartHot.lua src/AddOns/SummonScout/SummonScout_WhisperConfirmSpam.lua src/AddOns/SummonScout/SummonScout_FallbackRouterHot.lua src/AddOns/SummonScout/SummonScout_DestinationInfoGuardHot.lua src/AddOns/SummonScout/SummonScout_PostPaymentOfferHot.lua src/AddOns/SummonScout/SummonScout_FallbackRouterHubAckHot.lua
          git diff --cached --stat
          git commit -m "hotfix(summon): allow slave 1-5 and add silithus route"
          git push origin HEAD:${GITHUB_REF_NAME}
