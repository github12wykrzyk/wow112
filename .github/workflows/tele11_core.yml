name: TELE11 terminal service core
on:
  workflow_dispatch:
  push:
    branches: [feature/tele11-terminal-service-v1]
    paths:
      - '.github/workflows/tele11_core.yml'
      - 'probes/Wow112HeadlessAndroid/Cargo.toml'
      - 'probes/Wow112HeadlessAndroid/src/lib.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_*.rs'
      - 'probes/Wow112HeadlessAndroid/src/destination_registry.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele_response_engine.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele10_*.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele11_*.rs'
      - 'probes/Wow112HeadlessAndroid/src/bin/tele10_ledger.rs'
      - 'probes/Wow112HeadlessAndroid/src/bin/tele06a_acceptor_runtime.rs'
      - 'probes/Wow112HeadlessAndroid/src/bin/tele06a_ritual_runtime.rs'
      - 'probes/Wow112HeadlessAndroid/src/bin/tele11_*.rs'
      - 'probes/Wow112HeadlessAndroid/tele08_request_queue/**'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test reusable service core
        shell: pwsh
        run: |
          cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path probes/Wow112HeadlessAndroid/tele08_request_queue/Cargo.toml -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test TELE11 contracts
        shell: pwsh
        run: |
          foreach ($bin in @('tele11_external_worker','tele11_ingress_once','tele11_service')) {
            cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin $bin -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo run --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin $bin -- --self-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build exact stored runtime
        shell: pwsh
        run: |
          foreach ($bin in @('tele10_ledger','tele06a_acceptor_runtime','tele06a_ritual_runtime','tele11_external_worker','tele11_ingress_once','tele11_service')) {
            cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin $bin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
