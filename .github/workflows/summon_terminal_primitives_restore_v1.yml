name: Summon Terminal Primitives Restore V1

on:
  push:
    branches:
      - feature/summon-terminal-primitives-restore-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-compile-test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact SHA
        shell: pwsh
        run: |
          "exact_sha=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Cargo test all headless targets
        shell: pwsh
        working-directory: probes/Wow112HeadlessAndroid
        run: |
          cargo test --all-targets --verbose 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scope guard
        if: always()
        shell: pwsh
        run: |
          $base = "a5ee048c620c55542460d54d7750e81f0f8f8da4"
          git fetch --depth=1 origin $base
          $changed = git diff --name-only "$base..$env:GITHUB_SHA"
          $forbidden = $changed | Where-Object { $_ -like 'src/AddOns/*' -or $_ -like 'tools/operator_console/*' -or $_ -like 'packaging/*' }
          if ($forbidden) { $forbidden | Write-Error; exit 1 }
          $changed | ForEach-Object { "changed=$_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summon-terminal-primitives-restore-${{ github.sha }}
          path: probes/Wow112HeadlessAndroid/cargo-test.log
          if-no-files-found: warn
