name: TELE08 E response engine CI

on:
  push:
    branches:
      - feature/tele08-e-response-engine-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/src/lib.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele_response_engine.rs'
      - '.github/workflows/tele08_e_response_engine_ci.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Track E only
        run: |
          rustfmt --edition 2021 \
            probes/Wow112HeadlessAndroid/src/lib.rs \
            probes/Wow112HeadlessAndroid/src/tele_response_engine.rs
      - name: Commit Track E formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            probes/Wow112HeadlessAndroid/src/lib.rs \
            probes/Wow112HeadlessAndroid/src/tele_response_engine.rs; then
            echo "Track E sources already rustfmt-clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probes/Wow112HeadlessAndroid/src/lib.rs probes/Wow112HeadlessAndroid/src/tele_response_engine.rs
          git commit -m "TELE08 E: rustfmt response engine"
          git push origin HEAD:feature/tele08-e-response-engine-v1
      - name: Verify Track E formatting
        run: |
          rustfmt --edition 2021 --check \
            probes/Wow112HeadlessAndroid/src/lib.rs \
            probes/Wow112HeadlessAndroid/src/tele_response_engine.rs
      - name: Check
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Test
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
