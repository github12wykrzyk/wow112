name: TELE-02 Android smoke bundle

on:
  push:
    branches:
      - feature/tele02-whisper-name-tx-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/**'
      - '.github/workflows/tele01_compile.yml'
      - 'runtime/parallel_tasks/tele02-whisper-name-tx-v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tele02-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: PowerShell launcher syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'probes/Wow112HeadlessAndroid/RUN_TELE_SNIFFER.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Cargo check TELE-02
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Build Android x86_64 executable
        shell: bash
        run: |
          set -euo pipefail
          cd probes/Wow112HeadlessAndroid
          cargo ndk -t x86_64 --platform 21 build --release
      - name: Stage TELE-02 smoke bundle
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find probes/Wow112HeadlessAndroid/target -type f -name wow112-headless-android-probe -perm -111 -print -quit)"
          test -n "$BIN"
          OUT="dist/tele02-smoke"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/wow112-headless-android-probe"
          cp probes/Wow112HeadlessAndroid/RUN_TELE_SNIFFER.ps1 "$OUT/RUN_TELE_SNIFFER.ps1"
          cp probes/Wow112HeadlessAndroid/RUN_TELE_SNIFFER.cmd "$OUT/RUN_TELE_SNIFFER.cmd"
          BIN_SHA="$(sha256sum "$OUT/wow112-headless-android-probe" | awk '{print $1}')"
          cat > "$OUT/BUILD_INFO.txt" <<INFO
          TELE_STAGE=02
          REPOSITORY=${GITHUB_REPOSITORY}
          BRANCH=${GITHUB_REF_NAME}
          EXACT_SHA=${GITHUB_SHA}
          WORKFLOW_RUN_ID=${GITHUB_RUN_ID}
          TARGET=x86_64-linux-android
          ANDROID_API=21
          MODE=tele-sniffer
          NAME_RESOLUTION=cmsg-name-query
          ONE_SHOT_TX=optional
          INVITE=disabled
          CAST=disabled
          PORTAL_USE=disabled
          BINARY_SHA256=${BIN_SHA}
          INFO
          (
            cd "$OUT"
            sha256sum wow112-headless-android-probe RUN_TELE_SNIFFER.ps1 RUN_TELE_SNIFFER.cmd BUILD_INFO.txt > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Upload TELE-02 smoke bundle
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-TELE02-${{ github.sha }}
          path: dist/tele02-smoke
          if-no-files-found: error
          retention-days: 14
