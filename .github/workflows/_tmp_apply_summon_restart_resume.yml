name: TEMP Apply Summon Restart Resume

on:
  push:
    branches:
      - feature/summon-service-core-v1
    paths:
      - '.github/workflows/_tmp_apply_summon_restart_resume.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/summon-service-core-v1
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact restart-resume patch
        shell: python
        run: |
          from pathlib import Path

          # 1) Core: PortalCommitted is an observation wait, not a mutation window.
          p = Path('probes/Wow112HeadlessAndroid/src/summon_service_core.rs')
          s = p.read_text()
          old = '''        if let Some(phase) = phase {
              if phase != RequestPhase::AwaitingPayment {
                  self.mark_uncertain(
                      &request_id,
                      "reconnect_during_active_mutation_window_do_not_replay",
                      now_ms,
                  )?;
              }
          }
          '''
          new = '''        if let Some(phase) = phase {
              if !matches!(phase, RequestPhase::PortalCommitted | RequestPhase::AwaitingPayment) {
                  self.mark_uncertain(
                      &request_id,
                      "reconnect_during_active_mutation_window_do_not_replay",
                      now_ms,
                  )?;
              }
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'core reconnect anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''        let mut resume_payment = None::<String>;
          let mut queued_ids = Vec::<String>::new();
          let ids: Vec<String> = service.requests.keys().cloned().collect();
          for request_id in &ids {
              let phase = service.requests[request_id].phase;
              match phase {
                  RequestPhase::Queued => {
                      queued_ids.push(request_id.clone());
                  }
                  RequestPhase::AwaitingPayment => {
                      if resume_payment.is_some() {
                          if let Some(record) = service.requests.get_mut(request_id) {
                              record.phase = RequestPhase::BlockedUncertain;
                              record.last_error =
                                  Some("multiple_active_requests_in_snapshot".to_string());
                          }
                          service.state = ServiceState::BlockedUncertain;
                      } else {
                          resume_payment = Some(request_id.clone());
                      }
                  }
                  RequestPhase::Inviting
                  | RequestPhase::RitualCommitted
                  | RequestPhase::PortalCommitted => {
                      if let Some(record) = service.requests.get_mut(request_id) {
                          record.phase = RequestPhase::BlockedUncertain;
                          record.last_error =
                              Some("restart_during_active_request_do_not_replay".to_string());
                      }
                      service.state = ServiceState::BlockedUncertain;
                  }
                  RequestPhase::Completed
                  | RequestPhase::Failed
                  | RequestPhase::BlockedUncertain => {}
              }
          }

          if let Some(request_id) = resume_payment {
              service.enqueue_durable(&request_id, Some(0))?;
              let outcome = service
                  .queue
                  .activate_next(&service.resource, now_ms)
                  .map_err(|error| CoreError::Queue(format!("{error:?}")))?;
              let job = outcome
                  .events
                  .iter()
                  .find_map(|event| match event {
                      QueueEvent::JobActivated { job } if job.request_id == request_id => {
                          Some(job.clone())
                      }
                      _ => None,
                  })
                  .ok_or_else(|| {
                      CoreError::Snapshot(
                          "could_not_restore_awaiting_payment_as_active".to_string(),
                      )
                  })?;
              service.active = Some(ActiveRuntime {
                  request_id,
                  job_id: job.job_id,
              });
          }
          '''
          new = '''        let mut resume_wait = None::<String>;
          let mut queued_ids = Vec::<String>::new();
          let ids: Vec<String> = service.requests.keys().cloned().collect();
          for request_id in &ids {
              let phase = service.requests[request_id].phase;
              match phase {
                  RequestPhase::Queued => {
                      queued_ids.push(request_id.clone());
                  }
                  RequestPhase::PortalCommitted | RequestPhase::AwaitingPayment => {
                      if resume_wait.is_some() {
                          if let Some(record) = service.requests.get_mut(request_id) {
                              record.phase = RequestPhase::BlockedUncertain;
                              record.last_error =
                                  Some("multiple_active_requests_in_snapshot".to_string());
                          }
                          service.state = ServiceState::BlockedUncertain;
                      } else {
                          resume_wait = Some(request_id.clone());
                      }
                  }
                  RequestPhase::Inviting | RequestPhase::RitualCommitted => {
                      if let Some(record) = service.requests.get_mut(request_id) {
                          record.phase = RequestPhase::BlockedUncertain;
                          record.last_error =
                              Some("restart_during_active_request_do_not_replay".to_string());
                      }
                      service.state = ServiceState::BlockedUncertain;
                  }
                  RequestPhase::Completed
                  | RequestPhase::Failed
                  | RequestPhase::BlockedUncertain => {}
              }
          }

          if let Some(request_id) = resume_wait {
              service.enqueue_durable(&request_id, Some(0))?;
              let outcome = service
                  .queue
                  .activate_next(&service.resource, now_ms)
                  .map_err(|error| CoreError::Queue(format!("{error:?}")))?;
              let job = outcome
                  .events
                  .iter()
                  .find_map(|event| match event {
                      QueueEvent::JobActivated { job } if job.request_id == request_id => {
                          Some(job.clone())
                      }
                      _ => None,
                  })
                  .ok_or_else(|| {
                      CoreError::Snapshot(
                          "could_not_restore_waiting_request_as_active".to_string(),
                      )
                  })?;
              service.active = Some(ActiveRuntime {
                  request_id,
                  job_id: job.job_id,
              });
          }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'core restore anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Runtime regression test for safe PortalCommitted restart.
          p = Path('probes/Wow112HeadlessAndroid/src/summon_service_runtime.rs')
          s = p.read_text()
          marker = '''    #[test]
              fn summon_completion_without_portal_proof_is_rejected() {
          '''
          test = '''    #[test]
              fn restart_after_portal_commit_resumes_wait_without_replay() {
                  let root = root("portal_resume");
                  let config = ServiceRuntimeConfig::new(&root, "session-portal-resume");
                  let mut runtime = SummonServiceRuntime::open(config.clone(), 1).unwrap();
                  let id = runtime
                      .on_whisper("Clienta", "hyjal pls", None, Some("live"), 10)
                      .unwrap()
                      .unwrap();
                  runtime.start_next(20).unwrap();
                  runtime.mark_ritual_committed(&id, "ritual-1").unwrap();
                  runtime.mark_portal_committed(&id).unwrap();
                  drop(runtime);

                  let restored = SummonServiceRuntime::open(config, 100).unwrap();
                  assert_eq!(restored.active_request_id(), Some(id.as_str()));
                  assert_eq!(restored.request(&id).unwrap().phase, RequestPhase::PortalCommitted);
                  assert_ne!(restored.core().state(), crate::summon_service_core::ServiceState::BlockedUncertain);
                  let _ = fs::remove_dir_all(root);
              }

          '''
          if s.count(marker) != 1:
              raise SystemExit(f'runtime test marker count={s.count(marker)}')
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)

          # 3) World driver reconstructs durable summon correlation from TELE10 ledger.
          p = Path('probes/Wow112HeadlessAndroid/src/world_summon_service.rs')
          s = p.read_text()
          import_anchor = '''use wow112_headless_android_probe::summon_service_runtime::{
              ServiceRuntimeConfig, SummonServiceRuntime,
          };
          '''
          import_new = import_anchor + '''use wow112_headless_android_probe::summon_service_recovery::resolve_resume_summon;
          use wow112_headless_android_probe::tele10_trade_payment::SummonStatus;
          '''
          if s.count(import_anchor) != 1:
              raise SystemExit(f'world import anchor count={s.count(import_anchor)}')
          s = s.replace(import_anchor, import_new, 1)

          start_marker = 'fn request_driver(runtime: &SummonServiceRuntime, request_id: &str) -> Result<ActiveDriver, String> {'
          end_marker = '\nfn reconcile_driver('
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit(f'request_driver markers start={s.count(start_marker)} end={s.count(end_marker)}')
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          new = '''fn request_driver(runtime: &SummonServiceRuntime, request_id: &str) -> Result<ActiveDriver, String> {
              let record = runtime
                  .request(request_id)
                  .ok_or_else(|| format!("request missing id={request_id}"))?;
              let phase = match record.phase {
                  RequestPhase::Inviting => DriverPhase::ResetGroup { sent_at_ms: None },
                  RequestPhase::PortalCommitted | RequestPhase::AwaitingPayment => {
                      let ledger = LedgerStore::open(tele10_ledger_path())?;
                      let resumed = resolve_resume_summon(
                          &ledger.state,
                          &record.customer,
                          &record.destination,
                      )?
                      .ok_or_else(|| format!(
                          "durable summon correlation missing request_id={} customer={:?} destination={:?}",
                          request_id, record.customer, record.destination
                      ))?;
                      match record.phase {
                          RequestPhase::PortalCommitted => {
                              if resumed.summon_status != SummonStatus::RitualStarted {
                                  return Err(format!(
                                      "portal resume ledger status mismatch request_id={} summon_id={} status={:?}",
                                      request_id, resumed.summon_id, resumed.summon_status
                                  ));
                              }
                              DriverPhase::AwaitingPortal {
                                  target_guid: resumed.client_guid,
                                  summon_id: resumed.summon_id,
                              }
                          }
                          RequestPhase::AwaitingPayment => {
                              if resumed.summon_status != SummonStatus::Summoned {
                                  return Err(format!(
                                      "payment resume ledger status mismatch request_id={} summon_id={} status={:?}",
                                      request_id, resumed.summon_id, resumed.summon_status
                                  ));
                              }
                              DriverPhase::AwaitingPayment {
                                  since_ms: now_ms(),
                                  summon_id: Some(resumed.summon_id),
                              }
                          }
                          _ => unreachable!(),
                      }
                  }
                  other => {
                      return Err(format!(
                          "cannot create active driver request_id={request_id} phase={other:?}"
                      ))
                  }
              };
              Ok(ActiveDriver {
                  request_id: record.request_id.clone(),
                  customer: record.customer.clone(),
                  destination: record.destination.clone(),
                  trigger_message: record.trigger_message.clone(),
                  phase,
              })
          }
          '''
          s = s[:start] + new + s[end:]
          p.write_text(s)

      - name: Test library
        run: cargo test --lib --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Compile all test targets
        run: cargo test --no-run --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Cargo check
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add probes/Wow112HeadlessAndroid/src/summon_service_core.rs \
                  probes/Wow112HeadlessAndroid/src/summon_service_runtime.rs \
                  probes/Wow112HeadlessAndroid/src/world_summon_service.rs
          git diff --cached --check
          git commit -m 'fix(summon): resume post-portal and payment waits safely'
          git push origin HEAD:feature/summon-service-core-v1
