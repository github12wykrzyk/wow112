name: One-shot MovementCore PickPocket 360 source patch

on:
  push:
    branches:
      - work
    paths:
      - '.github/workflows/oneshot_patch_movementcore_pp360.yml'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python tools/patch_movementcore_pp360_once.py

      - name: Commit source fix and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/patch_movementcore_pp360_once.py .github/workflows/oneshot_patch_movementcore_pp360.yml
          git add src/MovementCore/WoWMovementCore_5875_v20_AUTOPP_REARONLY_HARDLOS3D_RETRY.c .github/workflows/build_work_candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align PickPocket facing with MovementCore rear spoof"
          git push origin HEAD:work
