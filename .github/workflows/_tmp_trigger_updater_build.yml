name: TEMP trigger updater build

on:
  push:
    branches:
      - fix/terminal-win-side-by-side-worker-v1
    paths:
      - .github/workflows/_tmp_trigger_updater_build.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official updater workflow on this exact branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/actions/workflows/build_updater.yml/dispatches" -f ref="$REF"
          echo "DISPATCHED build_updater.yml ref=$REF"
