name: Feature preflight and canonical integration

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.event_name != 'push' || github.event.created != true }}
    runs-on: windows-2022
    outputs:
      auto_integrate: ${{ steps.queue.outputs.eligible }}
      task_id: ${{ steps.queue.outputs.task_id }}
      queue_reason: ${{ steps.queue.outputs.reason }}
      delivery_profiles: ${{ steps.queue.outputs.delivery_profiles }}
    steps:
      - name: Checkout exact feature revision (shallow fast path)
        uses: actions/checkout@v5
        with:
          fetch-depth: 8

      - name: Fetch shallow canonical main integration base
        shell: pwsh
        run: |
          git fetch --depth=8 origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "cannot fetch canonical main integration base" }

      - name: Run routed fast gates and compile changed native modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/parallel_feature_preflight.py --base origin/main --branch "${{ github.head_ref || github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "feature preflight failed" }

      - name: Resolve explicit auto-integration opt-in
        id: queue
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/parallel_task_state.py queue-check --branch "${{ github.ref_name }}" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "task queue check failed" }

  profile_gates:
    name: Verify declared delivery profiles
    needs: preflight
    if: github.event_name == 'push' && needs.preflight.outputs.delivery_profiles != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout exact preflighted feature revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run exact feature-SHA profile gates
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_SHA: ${{ github.sha }}
          FEATURE_BRANCH: ${{ github.ref_name }}
          DELIVERY_PROFILES: ${{ needs.preflight.outputs.delivery_profiles }}
        run: |
          set -euo pipefail
          python tools/parallel_ci_dispatch.py \
            --repo "${{ github.repository }}" \
            --ref "$FEATURE_BRANCH" \
            --sha "$FEATURE_SHA" \
            --profiles "$DELIVERY_PROFILES"

  integrate:
    name: Integrate opted-in feature
    needs:
      - preflight
      - profile_gates
    if: ${{ always() && github.event_name == 'push' && needs.preflight.result == 'success' && needs.preflight.outputs.auto_integrate == 'true' && (needs.profile_gates.result == 'success' || needs.profile_gates.result == 'skipped') }}
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    outputs:
      canonical_sha: ${{ steps.integrate.outputs.canonical_sha }}
      parallel_sha: ${{ steps.integrate.outputs.parallel_sha }}
      standard_run_id: ${{ steps.integrate.outputs.standard_run_id }}
      economy_run_id: ${{ steps.integrate.outputs.economy_run_id }}
      updater_run_id: ${{ steps.integrate.outputs.updater_run_id }}
      autologinbridge_run_id: ${{ steps.integrate.outputs.autologinbridge_run_id }}
      delivery_run_ids: ${{ steps.integrate.outputs.delivery_run_ids }}
    steps:
      - name: Checkout exact preflighted feature revision (full merge history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Revalidate, integrate canonical main and verify exact delivery
        id: integrate
        shell: pwsh
        env:
          FEATURE_SHA: ${{ github.sha }}
          FEATURE_BRANCH: ${{ github.ref_name }}
          TASK_ID: ${{ needs.preflight.outputs.task_id }}
          DELIVERY_PROFILES: ${{ needs.preflight.outputs.delivery_profiles }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "wow112-ai-integration"
          git config user.email "github12wykrzyk@users.noreply.github.com"

          $maxAttempts = 6
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Integration attempt $attempt/$maxAttempts for $env:TASK_ID @ $env:FEATURE_SHA"

            git checkout --detach $env:FEATURE_SHA
            if ($LASTEXITCODE -ne 0) { throw "cannot restore exact feature SHA" }

            git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/parallel:refs/remotes/origin/parallel
            if ($LASTEXITCODE -ne 0) { throw "cannot fetch canonical main and delivery alias" }

            $base = (git rev-parse refs/remotes/origin/main).Trim()
            $alias = (git rev-parse refs/remotes/origin/parallel).Trim()
            if ($alias -ne $base) {
              throw "parallel delivery alias diverged from canonical main: main=$base parallel=$alias"
            }
            Write-Host "Canonical main base: $base"

            python tools/parallel_feature_preflight.py --base refs/remotes/origin/main --branch "$env:FEATURE_BRANCH"
            if ($LASTEXITCODE -ne 0) {
              throw "feature no longer passes preflight against canonical main $base"
            }

            $deliveryGateRaw = python tools/parallel_delivery_route.py `
              --base refs/remotes/origin/main `
              --branch "$env:FEATURE_BRANCH" `
              --task-id "$env:TASK_ID"
            if ($LASTEXITCODE -ne 0) { throw "delivery route classifier failed" }
            $deliveryGate = (($deliveryGateRaw -join "`n") | ConvertFrom-Json)
            if ($null -eq $deliveryGate -or $null -eq $deliveryGate.require_standard) {
              throw "delivery route classifier returned invalid output"
            }
            Write-Host "Post-integration delivery route: require_standard=$($deliveryGate.require_standard) fast_path=$($deliveryGate.fast_path) reason=$($deliveryGate.reason) profiles_used=$($deliveryGate.profiles_used -join ',')"

            git checkout -B __canonical_integrate refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw "cannot create canonical integration worktree" }

            git merge --no-ff $env:FEATURE_SHA -m "merge(queue): $env:TASK_ID"
            if ($LASTEXITCODE -ne 0) {
              git merge --abort 2>$null
              throw "merge conflict while integrating $env:TASK_ID; manual arbitration required"
            }

            python tools/parallel_task_state.py mark-integrated --task-id "$env:TASK_ID" --feature-sha "$env:FEATURE_SHA"
            if ($LASTEXITCODE -ne 0) { throw "cannot mark integrated task state" }
            git add "runtime/parallel_tasks/$env:TASK_ID.json"
            if ($LASTEXITCODE -ne 0) { throw "cannot stage integrated task state" }
            git commit --amend --no-edit
            if ($LASTEXITCODE -ne 0) { throw "cannot amend integration commit with task state" }

            git push --atomic origin HEAD:refs/heads/main HEAD:refs/heads/parallel
            if ($LASTEXITCODE -eq 0) {
              $integrated = (git rev-parse HEAD).Trim()
              $remoteMain = ((git ls-remote origin refs/heads/main) -split "`t")[0].Trim()
              $remoteParallel = ((git ls-remote origin refs/heads/parallel) -split "`t")[0].Trim()
              if ($remoteMain -ne $integrated -or $remoteParallel -ne $integrated) {
                throw "canonical refs diverged after atomic push: expected=$integrated main=$remoteMain parallel=$remoteParallel"
              }

              "canonical_sha=$integrated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "parallel_sha=$integrated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

              if ($deliveryGate.require_standard -eq $true) {
                python tools/parallel_ci_dispatch.py `
                  --repo "${{ github.repository }}" `
                  --ref parallel `
                  --sha "$integrated" `
                  --standard `
                  --profiles "$env:DELIVERY_PROFILES" `
                  --github-output "$env:GITHUB_OUTPUT"
              }
              else {
                python tools/parallel_ci_dispatch.py `
                  --repo "${{ github.repository }}" `
                  --ref parallel `
                  --sha "$integrated" `
                  --profiles "$env:DELIVERY_PROFILES" `
                  --github-output "$env:GITHUB_OUTPUT"
              }
              if ($LASTEXITCODE -ne 0) {
                throw "exact integrated delivery gates failed for $integrated"
              }

              # The feature is now provably contained in canonical main and exact
              # delivery passed. Remove only this exact queue branch; failure to
              # clean up is non-fatal and can be handled by the persistent sweeper.
              git push origin --delete "$env:FEATURE_BRANCH"
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "feature cleanup failed for $env:FEATURE_BRANCH"
              }

              Write-Host "CANONICAL_QUEUE: PASS task=$env:TASK_ID feature=$env:FEATURE_SHA main=$integrated parallel=$integrated profiles=$env:DELIVERY_PROFILES standard=$($deliveryGate.require_standard) route=$($deliveryGate.reason)"
              exit 0
            }

            $jitterMax = 250 * $attempt + 1
            $delayMs = 250 + (Get-Random -Minimum 0 -Maximum $jitterMax)
            Write-Host "Canonical refs moved before atomic push; retrying from fresh main after ${delayMs}ms."
            Start-Sleep -Milliseconds $delayMs
          }

          throw "canonical integration CAS retry limit exceeded; feature remains safe on $env:FEATURE_BRANCH"
