name: Parallel feature preflight

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - parallel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-feature-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: windows-2022
    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch current parallel integration base
        shell: pwsh
        run: git fetch origin parallel:refs/remotes/origin/parallel

      - name: Run fast repository and parallel gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verify_current.py
          if ($LASTEXITCODE -ne 0) { throw "verify_current failed" }
          python tools/verify_runtime_artifacts.py
          if ($LASTEXITCODE -ne 0) { throw "runtime artifact verification failed" }
          python tools/verify_verified_symbols.py
          if ($LASTEXITCODE -ne 0) { throw "verified-symbol check failed" }
          python tools/verify_parallel_dependency_registry.py
          if ($LASTEXITCODE -ne 0) { throw "parallel dependency audit failed" }
          python tools/verify_candidate_source_scope.py
          if ($LASTEXITCODE -ne 0) { throw "candidate source scope failed" }
          python tools/verify_parallel_candidate_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "parallel candidate manifest failed" }
          python tools/verify_parallel_gui_abi.py
          if ($LASTEXITCODE -ne 0) { throw "parallel GUI ABI/contract preflight failed" }
          python tools/ai_experiments.py validate
          if ($LASTEXITCODE -ne 0) { throw "experiment ledger validation failed" }
