name: Parallel feature preflight

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - parallel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-feature-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: windows-2022
    outputs:
      auto_integrate: ${{ steps.queue.outputs.eligible }}
      task_id: ${{ steps.queue.outputs.task_id }}
      queue_reason: ${{ steps.queue.outputs.reason }}
      delivery_profiles: ${{ steps.queue.outputs.delivery_profiles }}
    steps:
      - name: Checkout exact feature revision (shallow fast path)
        uses: actions/checkout@v5
        with:
          fetch-depth: 8

      - name: Fetch shallow current parallel integration base
        shell: pwsh
        run: |
          git fetch --depth=8 origin +refs/heads/parallel:refs/remotes/origin/parallel
          if ($LASTEXITCODE -ne 0) { throw "cannot fetch parallel integration base" }

      - name: Run routed fast gates and compile changed native modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The preflight starts shallow. If an older feature needs a deeper
          # fork point, parallel_feature_preflight deepens only the feature/base
          # refs and falls back to full history only when required for correctness.
          python tools/parallel_feature_preflight.py --base origin/parallel --branch "${{ github.head_ref || github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw "parallel feature preflight failed" }

      - name: Resolve explicit auto-integration opt-in
        id: queue
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/parallel_task_state.py queue-check --branch "${{ github.ref_name }}" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "parallel task queue check failed" }

  profile_gates:
    name: Verify declared delivery profiles
    needs: preflight
    if: github.event_name == 'push' && needs.preflight.outputs.delivery_profiles != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout exact preflighted feature revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run exact feature-SHA profile gates
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_SHA: ${{ github.sha }}
          FEATURE_BRANCH: ${{ github.ref_name }}
          DELIVERY_PROFILES: ${{ needs.preflight.outputs.delivery_profiles }}
        run: |
          set -euo pipefail
          python tools/parallel_ci_dispatch.py \
            --repo "${{ github.repository }}" \
            --ref "$FEATURE_BRANCH" \
            --sha "$FEATURE_SHA" \
            --profiles "$DELIVERY_PROFILES"

  integrate:
    name: Integrate opted-in feature
    needs:
      - preflight
      - profile_gates
    if: ${{ always() && github.event_name == 'push' && needs.preflight.result == 'success' && needs.preflight.outputs.auto_integrate == 'true' && (needs.profile_gates.result == 'success' || needs.profile_gates.result == 'skipped') }}
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    concurrency:
      # This is the single integration mutex. Independent feature coding and
      # preflight remain concurrent; only trunk movement is serialized.
      group: parallel-integration-queue
      cancel-in-progress: false
    outputs:
      parallel_sha: ${{ steps.integrate.outputs.parallel_sha }}
      standard_run_id: ${{ steps.integrate.outputs.standard_run_id }}
      economy_run_id: ${{ steps.integrate.outputs.economy_run_id }}
      updater_run_id: ${{ steps.integrate.outputs.updater_run_id }}
      autologinbridge_run_id: ${{ steps.integrate.outputs.autologinbridge_run_id }}
      delivery_run_ids: ${{ steps.integrate.outputs.delivery_run_ids }}
    steps:
      - name: Checkout exact preflighted feature revision (full merge history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Revalidate, integrate and verify exact parallel delivery
        id: integrate
        shell: pwsh
        env:
          FEATURE_SHA: ${{ github.sha }}
          FEATURE_BRANCH: ${{ github.ref_name }}
          TASK_ID: ${{ needs.preflight.outputs.task_id }}
          DELIVERY_PROFILES: ${{ needs.preflight.outputs.delivery_profiles }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "wow112-ai-integration"
          git config user.email "github12wykrzyk@users.noreply.github.com"

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Integration attempt $attempt/$maxAttempts for $env:TASK_ID @ $env:FEATURE_SHA"

            git checkout --detach $env:FEATURE_SHA
            if ($LASTEXITCODE -ne 0) { throw "cannot restore exact feature SHA" }

            git fetch origin +refs/heads/parallel:refs/remotes/origin/parallel
            if ($LASTEXITCODE -ne 0) { throw "cannot fetch current parallel" }

            $base = (git rev-parse refs/remotes/origin/parallel).Trim()
            Write-Host "Current parallel base: $base"

            # Re-run the same branch-local routed checks against the live
            # integration base. Integration keeps full history for merge safety.
            python tools/parallel_feature_preflight.py --base refs/remotes/origin/parallel --branch "$env:FEATURE_BRANCH"
            if ($LASTEXITCODE -ne 0) {
              throw "feature no longer passes preflight against current parallel $base"
            }

            $deliveryGateRaw = python tools/parallel_diagnostic_fastpath.py `
              --base refs/remotes/origin/parallel `
              --branch "$env:FEATURE_BRANCH" `
              --task-id "$env:TASK_ID"
            if ($LASTEXITCODE -ne 0) {
              throw "diagnostic fast-path classifier failed"
            }
            $deliveryGate = (($deliveryGateRaw -join "`n") | ConvertFrom-Json)
            if ($null -eq $deliveryGate -or $null -eq $deliveryGate.require_standard) {
              throw "diagnostic fast-path classifier returned invalid output"
            }
            Write-Host "Post-integration delivery gate: require_standard=$($deliveryGate.require_standard) fast_path=$($deliveryGate.fast_path) reason=$($deliveryGate.reason)"

            git checkout -B __parallel_integrate refs/remotes/origin/parallel
            if ($LASTEXITCODE -ne 0) { throw "cannot create integration worktree" }

            git merge --no-ff $env:FEATURE_SHA -m "merge(queue): $env:TASK_ID"
            if ($LASTEXITCODE -ne 0) {
              git merge --abort 2>$null
              throw "merge conflict while integrating $env:TASK_ID; manual arbitration required"
            }

            python tools/parallel_task_state.py mark-integrated --task-id "$env:TASK_ID" --feature-sha "$env:FEATURE_SHA"
            if ($LASTEXITCODE -ne 0) { throw "cannot mark integrated task state" }
            git add "runtime/parallel_tasks/$env:TASK_ID.json"
            if ($LASTEXITCODE -ne 0) { throw "cannot stage integrated task state" }
            git commit --amend --no-edit
            if ($LASTEXITCODE -ne 0) { throw "cannot amend integration commit with task state" }

            git push origin HEAD:refs/heads/parallel
            if ($LASTEXITCODE -eq 0) {
              $integrated = (git rev-parse HEAD).Trim()
              $remoteHead = ((git ls-remote origin refs/heads/parallel) -split "`t")[0].Trim()
              if ($remoteHead -ne $integrated) {
                throw "parallel moved before downstream dispatch; expected $integrated got $remoteHead"
              }

              "parallel_sha=$integrated" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              if ($deliveryGate.require_standard -eq $true) {
                python tools/parallel_ci_dispatch.py `
                  --repo "${{ github.repository }}" `
                  --ref parallel `
                  --sha "$integrated" `
                  --standard `
                  --profiles "$env:DELIVERY_PROFILES" `
                  --github-output "$env:GITHUB_OUTPUT"
              }
              else {
                python tools/parallel_ci_dispatch.py `
                  --repo "${{ github.repository }}" `
                  --ref parallel `
                  --sha "$integrated" `
                  --profiles "$env:DELIVERY_PROFILES" `
                  --github-output "$env:GITHUB_OUTPUT"
              }
              if ($LASTEXITCODE -ne 0) {
                throw "exact integrated parallel delivery gates failed for $integrated"
              }

              Write-Host "PARALLEL_QUEUE: PASS task=$env:TASK_ID feature=$env:FEATURE_SHA parallel=$integrated profiles=$env:DELIVERY_PROFILES standard=$($deliveryGate.require_standard)"
              exit 0
            }

            Write-Host "Parallel moved before push; retrying from fresh HEAD."
          }

          throw "parallel integration CAS retry limit exceeded; feature remains safe on $env:FEATURE_BRANCH"
