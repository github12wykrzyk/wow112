name: TELE08 B whisper parser

on:
  push:
    branches:
      - feature/tele08-b-whisper-parser-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/src/lib.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_whisper_parser.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_whisper_parser_tests.rs'
      - '.github/workflows/tele08_b_whisper_parser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tele08-b-whisper-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --all
      - name: Commit rustfmt if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- probes/Wow112HeadlessAndroid/src/lib.rs probes/Wow112HeadlessAndroid/src/tele08_whisper_parser.rs probes/Wow112HeadlessAndroid/src/tele08_whisper_parser_tests.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add probes/Wow112HeadlessAndroid/src/lib.rs probes/Wow112HeadlessAndroid/src/tele08_whisper_parser.rs probes/Wow112HeadlessAndroid/src/tele08_whisper_parser_tests.rs
            git commit -m 'style(tele08): rustfmt whisper parser'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Format check
        run: cargo fmt --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --all -- --check
      - name: Library check
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib
      - name: Parser tests
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib
