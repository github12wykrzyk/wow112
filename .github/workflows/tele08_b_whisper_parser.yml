name: TELE08 B whisper parser

on:
  push:
    branches:
      - feature/tele08-b-whisper-parser-v1
      - feature/tele10-canonical-stored-source-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/src/lib.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_whisper_parser.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_whisper_parser_tests.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele10_clarification.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele10_clarification_tests.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele10_message_audit_tests.rs'
      - 'runtime/parallel_tasks/tele08-b-whisper-parser-v1.json'
      - 'HANDOFF_TELE08_B_WHISPER_PARSER.md'
      - '.github/workflows/tele08_b_whisper_parser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tele08-b-whisper-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Track B format check
        shell: bash
        run: |
          rustfmt --edition 2021 --check \
            probes/Wow112HeadlessAndroid/src/lib.rs \
            probes/Wow112HeadlessAndroid/src/tele08_whisper_parser.rs \
            probes/Wow112HeadlessAndroid/src/tele08_whisper_parser_tests.rs \
            probes/Wow112HeadlessAndroid/src/tele10_clarification.rs \
            probes/Wow112HeadlessAndroid/src/tele10_clarification_tests.rs \
            probes/Wow112HeadlessAndroid/src/tele10_message_audit_tests.rs
      - name: Library check
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib
      - name: Parser and clarification tests
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib
