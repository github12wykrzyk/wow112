name: TELE08 D destination registry

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tele08-d-destination-registry-v1

permissions:
  contents: read

jobs:
  registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Track D sources
        run: rustfmt --edition 2021 --check probes/Wow112HeadlessAndroid/src/lib.rs probes/Wow112HeadlessAndroid/src/destination_registry.rs

      - name: Library compile check
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib

      - name: Registry unit and contract tests
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib
