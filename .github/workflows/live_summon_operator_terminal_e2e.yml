name: Live Summon Operator Terminal E2E

on:
  push:
    branches:
      - 'feature/summon-live-ledger-e2e-v1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wow112-live-summon-headless
  cancel-in-progress: false

env:
  LIVE_TEST_PAY_COPPER: '1'

jobs:
  live-e2e:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      WOW112_PASSWORD: ${{ secrets.WOW112_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify live secret exists
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WOW112_PASSWORD)) {
            throw 'WOW112_PASSWORD repo secret is missing'
          }
          Write-Host 'WOW112_PASSWORD available (value not printed).'

      - name: Verify Summon Ledger V1 before live mutation
        shell: pwsh
        run: |
          python -m unittest discover -s services/summon_ledger/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build required live binaries
        shell: pwsh
        run: |
          foreach ($bin in @('tele08_full_roundtrip','tele10_ledger','tele07_supervisor','tele06a_acceptor_runtime','tele06a_ritual_runtime')) {
            cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin $bin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Resolve taxi1 real first character
        id: taxi1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'taxi1_discovery'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:WOW112_TELE08_CUSTOMER_ACCOUNT = 'taxi1'
          $env:WOW112_TELE08_CUSTOMER_CHARACTER = '__FIRST__'
          $env:WOW112_TELE08_SUMMONER_ACCOUNT = 'taxi3'
          $env:WOW112_TELE08_SUMMONER_CHARACTER = 'Teletanaris'
          $env:WOW112_TELE08_ROUNDTRIP_ROOT = $root
          & probes/Wow112HeadlessAndroid/target/release/tele08_full_roundtrip.exe
          if ($LASTEXITCODE -ne 0) { throw "taxi1 discovery roundtrip failed: $LASTEXITCODE" }
          $guid = Get-ChildItem -Path $root -Filter GUID_CUSTOMER.txt -Recurse -File -ErrorAction Stop |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $guid) { throw 'GUID_CUSTOMER.txt missing after taxi1 discovery' }
          $body = Get-Content $guid.FullName -Raw
          $match = [regex]::Match($body, '(?m)^name=(.+)$')
          if (-not $match.Success) { throw 'taxi1 character name missing in GUID_CUSTOMER.txt' }
          $character = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($character)) { throw 'taxi1 character resolved empty' }
          "character=$character" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved taxi1 character: $character"

      - name: Run real taxi1 whisper-to-payment E2E
        shell: pwsh
        run: |
          $env:WOW112_TELE10_PAY_SETTLE_MS = '4000'
          Write-Host "Using minimal live sentinel payment=$env:LIVE_TEST_PAY_COPPER copper; production default remains 40000c."
          & ./tools/summon_operator_livetest/Run-LiveTest.ps1 -NoBuild -Cycles 1 -CustomerAccount 'taxi1' -CustomerCharacter '${{ steps.taxi1.outputs.character }}' -PayCopper ([int]$env:LIVE_TEST_PAY_COPPER) -Destination 'winterspring'
          exit $LASTEXITCODE

      - name: Verify effective client identity from runtime evidence
        shell: pwsh
        run: |
          $report = Get-ChildItem tools/summon_operator_livetest/results -Filter FINAL_REPORT.json -Recurse -File |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $report) { throw 'FINAL_REPORT.json missing' }
          $runDir = Split-Path $report.FullName -Parent
          $customerLog = Get-ChildItem $runDir -Filter 'CYCLE_001_CUSTOMER_R00.stdout.log' -File | Select-Object -First 1
          if ($null -eq $customerLog) { throw 'customer runtime log missing' }
          $text = Get-Content $customerLog.FullName -Raw
          $character = '${{ steps.taxi1.outputs.character }}'
          if ($text -notmatch '(?i)account=TAXI1') { throw 'runtime evidence does not prove TAXI1 account' }
          if ($text -notmatch [regex]::Escape("character=$character")) { throw "runtime evidence does not prove character=$character" }
          $proof = [ordered]@{
            account = 'taxi1'
            character = $character
            proof = 'customer runtime authenticated identity'
            source_log = $customerLog.Name
          }
          $proof | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $runDir 'EFFECTIVE_CLIENT.json')
          Write-Host "Effective client PASS: taxi1/$character"

      - name: Bridge real settlement into SQLite Summon Ledger V1
        shell: pwsh
        run: |
          $report = Get-ChildItem tools/summon_operator_livetest/results -Filter FINAL_REPORT.json -Recurse -File |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $report) { throw 'FINAL_REPORT.json missing' }
          $runDir = Split-Path $report.FullName -Parent
          $legacy = Join-Path $runDir 'tele10_payment_ledger.json'
          $db = Join-Path $runDir 'summon_ledger.sqlite3'
          $events = Join-Path $runDir 'summon_events.jsonl'
          $summary = Join-Path $runDir 'summon_ledger_bridge.json'
          $query = Join-Path $runDir 'find_player_1h.json'
          $session = 'live-' + [IO.Path]::GetFileName($runDir)
          python tools/summon_operator_livetest/tele10_to_sqlite_ledger.py --legacy $legacy --db $db --events $events --session $session --summary $summary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m services.summon_ledger --db $db find-player '${{ steps.taxi1.outputs.character }}' --since 1h | Set-Content -Encoding UTF8 $query
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $q = Get-Content $query -Raw | ConvertFrom-Json
          $expected = [int64]$env:LIVE_TEST_PAY_COPPER
          if ([int]$q.payment_count -lt 1) { throw 'SQLite ledger query has no PaymentReceived for taxi1 character' }
          if ([int64]$q.paid_total_copper -lt $expected) { throw "SQLite ledger paid total is $($q.paid_total_copper), expected >=$expected" }
          $match = @($q.requests | Where-Object {
            $_.customer -eq '${{ steps.taxi1.outputs.character }}' -and
            $_.destination -eq 'winterspring' -and
            $_.summon_state -eq 'completed' -and
            $_.payment_state -eq 'paid' -and
            [int64]$_.paid_copper -ge $expected
          })
          if ($match.Count -lt 1) { throw 'SQLite request projection is not completed+paid for Winterspring' }
          Write-Host "SQLITE_LEDGER_PASS customer=${{ steps.taxi1.outputs.character }} paid=$($q.paid_total_copper)c payments=$($q.payment_count)"

      - name: Summarize final report
        if: always()
        shell: pwsh
        run: |
          $report = Get-ChildItem tools/summon_operator_livetest/results -Filter FINAL_REPORT.json -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $report) {
            Write-Host 'No FINAL_REPORT.json produced.'
            exit 0
          }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          $runDir = Split-Path $report.FullName -Parent
          $queryPath = Join-Path $runDir 'find_player_1h.json'
          $sqlite = if (Test-Path $queryPath) { Get-Content $queryPath -Raw | ConvertFrom-Json } else { $null }
          Write-Host ("FINAL result={0} customer={1}/{2} payment={3}c whisper={4} supervisor_exit={5} trade_complete={6} paid={7}/{8} uncertain={9}" -f `
            $data.result, $data.customer_account, $data.customer, $data.payment_copper, $data.whisper.passed, $data.summon_payment.supervisor_exit_code, `
            $data.summon_payment.server_trade_complete, $data.summon_payment.paid_summon_count, `
            $data.cycles_requested, $data.summon_payment.hard_uncertain)
          if ($null -ne $sqlite) {
            Write-Host ("SQLITE customer={0} payments={1} paid_total={2}" -f $sqlite.customer, $sqlite.payment_count, $sqlite.paid_total_copper)
          }

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Summon-Live-SQLite-Evidence-${{ github.sha }}
          path: tools/summon_operator_livetest/results/**
          if-no-files-found: warn
