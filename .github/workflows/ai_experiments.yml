name: Verify AI experiment registry

on:
  push:
    branches:
      - main
      - work
      - parallel
      - 'feature/**'
    paths:
      - 'runtime/ai_experiments.json'
      - 'runtime/ai_experiment_index.json'
      - 'tools/ai_experiments.py'
      - 'tools/test_ai_experiments.py'
      - '.github/workflows/ai_experiments.yml'
      - 'AGENTS.md'
      - 'AI_START_HERE.md'
      - 'AI_INDEX.json'
      - 'CURRENT.json'
      - 'runtime/current.json'
      - 'runtime/ai_startup_snapshot.json'
      - 'tools/ai_startup_snapshot.py'
      - 'tools/test_ai_startup_snapshot.py'
      - 'PROJECT_INSTRUCTIONS.md'
      - 'docs/AI_EXPERIMENTS.md'
  pull_request:
    branches:
      - main
      - work
      - parallel
    paths:
      - 'runtime/ai_experiments.json'
      - 'runtime/ai_experiment_index.json'
      - 'tools/ai_experiments.py'
      - 'tools/test_ai_experiments.py'
      - '.github/workflows/ai_experiments.yml'
      - 'AGENTS.md'
      - 'AI_START_HERE.md'
      - 'AI_INDEX.json'
      - 'CURRENT.json'
      - 'runtime/current.json'
      - 'runtime/ai_startup_snapshot.json'
      - 'tools/ai_startup_snapshot.py'
      - 'tools/test_ai_startup_snapshot.py'
      - 'PROJECT_INSTRUCTIONS.md'
      - 'docs/AI_EXPERIMENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-experiments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
      - name: Validate experiment registry
        run: python3 tools/ai_experiments.py validate
      - name: Verify compact experiment routing index
        run: python3 tools/ai_experiments.py index --check
      - name: Verify compact startup snapshot
        run: python3 tools/ai_startup_snapshot.py --check
      - name: Test AI routing and startup projections
        run: python3 -m unittest discover -s tools -p 'test_ai_*.py' -v
      - name: Verify current runtime references
        run: python3 tools/verify_current.py
      - name: Verify recoverable runtime artifacts
        run: python3 tools/verify_runtime_artifacts.py
      - name: Verify shared native symbols
        run: python3 tools/verify_verified_symbols.py
