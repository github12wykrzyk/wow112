name: AH DE autonomous control plane v1

on:
  push:
    branches:
      - feature/ah-de-autonomous-control-v1
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ah-de-autonomous-control-v1
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_BRANCH: dev/windows-ah-de-liquidation-v3
      BUILD_WORKFLOW: build_windows_ah_de_liquidation_v3.yml
      STATE_DIR: autonomous_state/ah_de
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Initialize control-plane state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR"
          cat > "$STATE_DIR/AUTONOMOUS_STATE.json" <<JSON
          {
            "state": "VALIDATING",
            "candidate_sha": "$GITHUB_SHA",
            "candidate_branch": "$GITHUB_REF_NAME",
            "base_branch": "$BASE_BRANCH",
            "human_live_gate": true,
            "live_mutation_from_ci": false
          }
          JSON

      - name: Safety policy gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH":"refs/remotes/origin/$BASE_BRANCH"
          git diff --name-only "origin/$BASE_BRANCH...HEAD" | tee "$STATE_DIR/CHANGED_FILES.txt"

          if grep -E '(^|/)(vendor_stable|VENDOR_STABLE|windows-ah-canonical)(/|$)' "$STATE_DIR/CHANGED_FILES.txt"; then
            echo 'POLICY FAIL: Vendor Stable path touched.' >&2
            exit 20
          fi

          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/ah_de_autonomous_control.yml').read_text(encoding='utf-8')
          forbidden=[
              'WOW112_AUTOBUY_CONFIRM=' + 'YES',
              'WOW112_F1_LIVE_CONFIRM=' + 'BUY_ONE_NOW',
              'V32' + 'LIVE3',
              'DE_' + 'LIVE3',
          ]
          hits=[x for x in forbidden if x in text]
          if hits:
              raise SystemExit('POLICY FAIL: autonomous CI contains live-mutation arm token(s): '+','.join(hits))
          print('LIVE_ARM_POLICY=PASS')
          PY

          grep -q 'NO_AUTO_RETRY_FROM_THIS_POINT=YES' probes/Wow112HeadlessAndroid/src/world_poc07.rs || {
            echo 'POLICY FAIL: no-retry mutation contract marker missing in buy primitive.' >&2; exit 22; }
          grep -q 'MUTATION_BOUNDARY_NO_RETRY' packaging/ah_latest/launcher/_launcher/RUN_DE_LAB.ps1 || {
            echo 'POLICY FAIL: launcher mutation-boundary hard stop missing.' >&2; exit 23; }
          grep -q 'WOW112_UNIFIED_DE_MAX_SPEND' packaging/ah_latest/launcher/_launcher/RUN_DE_LAB.ps1 || {
            echo 'POLICY FAIL: DE spend cap missing.' >&2; exit 24; }
          grep -q 'HELLO_TIMEOUT_SECS' probes/Wow112HeadlessAndroid/tools/poc05_ah_hello_resilience_patch.py || {
            echo 'POLICY FAIL: AH hello time-budget patch missing.' >&2; exit 25; }

          echo 'SAFETY_POLICY=PASS' | tee "$STATE_DIR/POLICY.txt"

      - name: Corporate release-only updater contract
        shell: bash
        run: |
          set -euo pipefail
          START=packaging/ah_latest/START_AH_LATEST.bat
          BOOT=packaging/ah_latest/bootstrap_latest.ps1
          PUB=.github/workflows/publish_ah_de_latest_release.yml

          for p in "$START" "$BOOT" "$PUB" \
            packaging/ah_latest/launcher/START_AH.bat \
            packaging/ah_latest/launcher/_launcher/START_AH.ps1 \
            packaging/ah_latest/launcher/_launcher/RUN_DE_LAB.ps1; do
            test -s "$p" || { echo "CORP CONTRACT FAIL: missing $p" >&2; exit 26; }
          done

          if grep -n -E 'https?://(raw\.githubusercontent\.com|api\.github\.com)' "$START" "$BOOT"; then
            echo 'CORP CONTRACT FAIL: runtime updater references a blocked GitHub host URL.' >&2
            exit 27
          fi
          grep -q 'releases/download/ah-de-latest' "$START" || { echo 'starter is not release-only' >&2; exit 28; }
          grep -q 'releases/download/ah-de-latest' "$BOOT" || { echo 'bootstrap is not release-only' >&2; exit 29; }
          grep -q 'WoW112_AH_BOOTSTRAP_LATEST.sha256' "$START" || { echo 'starter bootstrap hash verification missing' >&2; exit 32; }
          grep -q 'RUNTIME_CHANNEL=GITHUB_RELEASE_ONLY' "$PUB" || { echo 'release channel marker missing' >&2; exit 33; }
          grep -q 'LAUNCHER_BUNDLE=YES' "$PUB" || { echo 'launcher bundle marker missing' >&2; exit 34; }
          grep -q 'launcher/START_AH.bat' "$PUB" || { echo 'START_AH launcher not bundled' >&2; exit 35; }
          grep -q 'launcher/_launcher/START_AH.ps1' "$PUB" || { echo 'menu launcher not bundled' >&2; exit 36; }
          grep -q 'launcher/_launcher/RUN_DE_LAB.ps1' "$PUB" || { echo 'DE launcher not bundled' >&2; exit 37; }

          pwsh -NoLogo -NoProfile -Command '$null=[scriptblock]::Create((Get-Content "packaging/ah_latest/bootstrap_latest.ps1" -Raw)); Write-Host "BOOTSTRAP_PARSE=PASS"'

          python - <<'PY'
          from pathlib import Path
          import zipfile, tempfile
          extras={
              Path('packaging/ah_latest/launcher/START_AH.bat'): 'launcher/START_AH.bat',
              Path('packaging/ah_latest/launcher/_launcher/START_AH.ps1'): 'launcher/_launcher/START_AH.ps1',
              Path('packaging/ah_latest/launcher/_launcher/RUN_DE_LAB.ps1'): 'launcher/_launcher/RUN_DE_LAB.ps1',
              Path('packaging/ah_latest/START_AH_LATEST.bat'): 'bootstrap/START_AH_LATEST.bat',
              Path('packaging/ah_latest/bootstrap_latest.ps1'): 'bootstrap/bootstrap_latest.ps1',
          }
          with tempfile.NamedTemporaryFile(suffix='.zip') as f:
              with zipfile.ZipFile(f.name,'w',zipfile.ZIP_DEFLATED) as z:
                  for src,arc in extras.items(): z.write(src,arc)
              with zipfile.ZipFile(f.name,'r') as z:
                  names=set(z.namelist())
                  missing=set(extras.values())-names
                  if missing: raise SystemExit('mock release missing '+','.join(sorted(missing)))
          print('CORP_RELEASE_BUNDLE_MOCK=PASS')
          PY

          echo 'CORP_RELEASE_ONLY_CONTRACT=PASS' | tee "$STATE_DIR/CORP_RELEASE_CHANNEL.txt"

      - name: Dispatch exact DE build workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "$BUILD_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "BUILD_DISPATCHED sha=$GITHUB_SHA branch=$GITHUB_REF_NAME"

      - name: Wait for exact candidate build
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID=''
          for i in $(seq 1 80); do
            DATA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$BUILD_WORKFLOW" --branch "$GITHUB_REF_NAME" --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,createdAt)
            RUN_ID=$(echo "$DATA" | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha==$sha)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo 'CONTROL FAIL: dispatched build run was not found.' >&2
            exit 30
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "BUILD_RUN_ID=$RUN_ID" | tee "$STATE_DIR/BUILD_RUN.txt"

          for i in $(seq 1 200); do
            STATUS=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            if [[ "$STATUS" == 'completed' ]]; then break; fi
            sleep 10
          done
          STATUS=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
          CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          echo "BUILD_STATUS=$STATUS" | tee -a "$STATE_DIR/BUILD_RUN.txt"
          echo "BUILD_CONCLUSION=$CONCLUSION" | tee -a "$STATE_DIR/BUILD_RUN.txt"
          if [[ "$STATUS" != 'completed' || "$CONCLUSION" != 'success' ]]; then
            echo "CONTROL FAIL: exact candidate build status=$STATUS conclusion=$CONCLUSION" >&2
            exit 31
          fi

      - name: Download exact candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p candidate_artifact
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir candidate_artifact
          find candidate_artifact -maxdepth 4 -type f -print | tee "$STATE_DIR/ARTIFACT_FILES.txt"

      - name: Artifact and mutation-contract validation
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find candidate_artifact -type f -name '*.exe' -print -quit)
          UNIFIED=$(find candidate_artifact -type f -name 'world_poc08_unified.rs' -print -quit)
          HELLO=$(find candidate_artifact -type f -name 'world_poc05_retry.rs' -print -quit)
          INFO=$(find candidate_artifact -type f -name 'BUILD_INFO.txt' -print -quit)
          [[ -n "$EXE" && -n "$UNIFIED" && -n "$HELLO" && -n "$INFO" ]] || {
            echo 'CONTROL FAIL: required build evidence missing.' >&2; exit 40; }

          python - "$EXE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          if p.read_bytes()[:2] != b'MZ':
              raise SystemExit('PE/MZ validation failed')
          print('PE_MZ=PASS')
          PY

          grep -q 'poc08_f0_liquidation_decision(c)' "$UNIFIED" || { echo 'missing V3.1 liquidation decision' >&2; exit 41; }
          grep -q 'Poc07Strategy::Disenchant' "$UNIFIED" || { echo 'missing DE route' >&2; exit 42; }
          grep -q 'WOW112_UNIFIED_DE_MAX_SPEND' "$UNIFIED" || { echo 'missing DE spend cap in built source' >&2; exit 43; }
          grep -q 'NO_AUTO_RETRY_FROM_THIS_POINT=YES' "$UNIFIED" || { echo 'missing no-retry mutation marker' >&2; exit 44; }
          grep -q 'HELLO_TIMEOUT_SECS' "$HELLO" || { echo 'missing AH hello time budget' >&2; exit 45; }
          grep -q 'SMSG_COMPRESSED_UPDATE_OBJECT_OPCODE' "$HELLO" || { echo 'missing background packet exemption' >&2; exit 46; }
          grep -q 'AH_HELLO_RESILIENCE=TIME_BUDGET_BACKGROUND_EXEMPT_FRESH_NPC_FIRST' "$INFO" || { echo 'missing build provenance marker' >&2; exit 47; }

          SHA=$(sha256sum "$EXE" | awk '{print $1}')
          echo "EXE_SHA256=$SHA" | tee "$STATE_DIR/ARTIFACT_VALIDATION.txt"
          echo 'ARTIFACT_POLICY=PASS' | tee -a "$STATE_DIR/ARTIFACT_VALIDATION.txt"

      - name: Mark READY FOR HUMAN LIVE
        shell: bash
        env:
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        run: |
          set -euo pipefail
          EXE=$(find candidate_artifact -type f -name '*.exe' -print -quit)
          EXE_SHA=$(sha256sum "$EXE" | awk '{print $1}')
          cat > "$STATE_DIR/AUTONOMOUS_STATE.json" <<JSON
          {
            "state": "READY_FOR_HUMAN_LIVE",
            "candidate_sha": "$GITHUB_SHA",
            "candidate_branch": "$GITHUB_REF_NAME",
            "build_run_id": "$RUN_ID",
            "exe_sha256": "$EXE_SHA",
            "policy": "PASS",
            "corp_release_channel": "PASS",
            "build": "PASS",
            "artifact_validation": "PASS",
            "human_live_gate": true,
            "live_mutation_from_ci": false,
            "auto_retry_after_send": false
          }
          JSON
          cat > "$STATE_DIR/SUMMARY.txt" <<EOF
          AH-DE AUTONOMOUS CONTROL PLANE V1
          candidate=$GITHUB_SHA
          build_run=$RUN_ID
          state=READY_FOR_HUMAN_LIVE
          policy=PASS
          corp_release_channel=PASS
          exact_build=PASS
          artifact_validation=PASS
          live_mutation_from_ci=NO
          human_live_gate=REQUIRED
          retry_after_send=FORBIDDEN
          EOF
          cat "$STATE_DIR/SUMMARY.txt"

      - name: Upload autonomous evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AH-DE-AUTONOMOUS-CONTROL-${{ github.sha }}
          path: |
            autonomous_state/ah_de/**
          if-no-files-found: error
          retention-days: 14
