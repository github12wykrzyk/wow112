name: One-shot terminal party leader invite guard

on:
  push:
    branches:
      - fix/terminal-party-leader-invite-guard-v1
    paths:
      - '.github/workflows/one_shot_terminal_party_leader_guard.yml'

permissions:
  contents: write

jobs:
  patch-check-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: fix/terminal-party-leader-invite-guard-v1
          fetch-depth: 0

      - name: Apply exact one-block patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('probes/Wow112HeadlessAndroid/src/world_portal.rs')
          text = path.read_text(encoding='utf-8')
          old = (
              "    if members.iter().any(|member| member.guid == leader_guid) {\n"
              "        return Ok(());\n"
              "    }\n"
          )
          new = (
              "    if members.iter().any(|member| member.guid == leader_guid) {\n"
              "        if auto_invite_missing {\n"
              "            *last_invite = None;\n"
              "        }\n"
              "        return Ok(());\n"
              "    }\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exact nonleader block once, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('exact replacement PASS')
          PY

      - name: Diff safety gate
        shell: bash
        run: |
          set -euo pipefail
          target='probes/Wow112HeadlessAndroid/src/world_portal.rs'
          git diff --check -- "$target"
          changed="$(git diff --name-only -- "$target")"
          test "$changed" = "$target"
          git diff -- "$target"

      - name: Host cargo check
        shell: bash
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml

      - name: Remove one-shot workflow and commit only intended staged changes
        shell: bash
        run: |
          set -euo pipefail
          target='probes/Wow112HeadlessAndroid/src/world_portal.rs'
          workflow='.github/workflows/one_shot_terminal_party_leader_guard.yml'
          rm "$workflow"
          git add "$target" "$workflow"
          git diff --cached --check -- "$target" "$workflow"
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' "$workflow" "$target" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git diff --cached -- "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(terminal): suppress nonleader master invite retries'
          git push origin HEAD:fix/terminal-party-leader-invite-guard-v1
