name: POC08-E Guarded DE Buy-One Smoke Windows

on:
  push:
    branches: [feature/poc08-e-buyone-smoke]
    paths:
      - 'probes/Wow112HeadlessAndroid/tools/poc08_e_buyone_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/RUN_POC08_E_BUYONE_WINDOWS.ps1'
      - 'probes/Wow112HeadlessAndroid/tools/RUN_POC08_E_SCAN_WINDOWS.ps1'
      - 'probes/Wow112HeadlessAndroid/tools/START_POC08_E_BUYONE_WINDOWS.bat'
      - 'probes/Wow112HeadlessAndroid/tools/START_POC08_E_SCAN_WINDOWS.bat'
      - '.github/workflows/build_windows_poc08_e_buyone_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Python patch syntax smoke
        shell: pwsh
        run: |
          python -m py_compile probes/Wow112HeadlessAndroid/tools/poc08_e_buyone_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host '[POC08-E-SMOKE] patch py_compile PASS'

      - name: Generate V5.3 base and DEID cache
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v4_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v5_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v52_turbo_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v53_class_ceiling_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/build_de_cache_v52.py --seed-cache probes/Wow112HeadlessAndroid/tools/v52_seed_cache.csv --missing-ids probes/Wow112HeadlessAndroid/tools/v52_missing_item_ids.txt --output-cache "$env:RUNNER_TEMP/poc08-base-cache.csv" --unresolved "$env:RUNNER_TEMP/poc08-base-unresolved.csv" --workers 16 --timeout 15 --retries 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/build_de_cache_v52.py --seed-cache "$env:RUNNER_TEMP/poc08-base-cache.csv" --missing-ids probes/Wow112HeadlessAndroid/tools/v53_extra_item_ids.txt --output-cache "$env:RUNNER_TEMP/poc08-cache.csv" --unresolved "$env:RUNNER_TEMP/poc08-unresolved.csv" --workers 4 --timeout 15 --retries 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_de_cache_to_rust.py --cache-csv "$env:RUNNER_TEMP/poc08-cache.csv" --output-rs probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate guarded E source
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc08_economy_audit_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_reference_de_model_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_b_compile_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_material_pricebook_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_risk_gate_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_e_buyone_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs probes/Wow112HeadlessAndroid/src/world_poc08_e_buyone.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host '[POC08-E-SMOKE] generator chain PASS'

      - name: Static transaction safety assertions
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/src/world_poc08_e_buyone.rs'
          $required=@('WOW112_POC08_E_ACTION','WOW112_DE_BUY_CONFIRM','POC08_E_DIRTY_JOURNAL_BLOCK','status=PREPARED','status=COMMITTED','TARGETED REVALIDATE PASS','mail.stack == target.count','c.record.owner_guid != player_guid','hard_max_purchases=1','poc06_perform_auction_action','GUARDED DE BUY-ONE PASS','NO_DE_CANDIDATE_PASS')
          foreach($m in $required){ if(-not (Select-String -Path $p -SimpleMatch $m -Quiet)){ throw "POC08-E safety marker missing: $m" } }
          if(-not (Select-String -Path probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs -Pattern '20406 => Some\(0\)' -Quiet)){ throw 'Twilight DE=0 regression missing' }
          if(-not (Select-String -Path probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs -Pattern '41316 => Some\([1-9][0-9]*\)' -Quiet)){ throw 'known-positive DE regression missing' }
          Write-Host '[POC08-E-SMOKE] static transaction guards PASS'

      - name: Select E entrypoint
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/src/main.rs'
          $t=Get-Content $p -Raw
          $t=$t.Replace('mod world_poc07_vendorlive;','mod world_poc08_e_buyone;')
          $t=$t.Replace('world_poc07_vendorlive::login_poc07_vendorlive','world_poc08_e_buyone::login_poc08_economy_audit')
          $t=$t.Replace('[POC07-LIVE]', '[POC08-E]')
          $t=$t.Replace('POC-07 LIVE SESSION PASS', 'POC-08E BUY-ONE SESSION PASS')
          $t=$t.Replace('POC-07 live vendor autobuy engine', 'POC-08E guarded DE buy-one')
          Set-Content $p $t -Encoding utf8

      - name: Compile native Windows binary
        shell: pwsh
        run: |
          cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host '[POC08-E-SMOKE] native compile PASS'

      - name: Native EXE fail-fast startup smoke
        shell: pwsh
        run: |
          $exe='probes/Wow112HeadlessAndroid/target/release/wow112-headless-android-probe.exe'
          if(-not (Test-Path $exe)){ throw 'EXE missing after build' }
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "[POC08-E-SMOKE] exe_sha256=$hash size=$((Get-Item $exe).Length)"
          Remove-Item Env:WOW112_ACCOUNT -ErrorAction SilentlyContinue
          Remove-Item Env:WOW112_PASSWORD -ErrorAction SilentlyContinue
          $o=& $exe 2>&1; $c=$LASTEXITCODE
          if($c -ne 2 -or ($o -join "`n") -notmatch 'missing WOW112_ACCOUNT'){ throw "missing-account fail-fast failed exit=$c output=$($o -join ' | ')" }
          $env:WOW112_ACCOUNT='octowar1'
          Remove-Item Env:WOW112_PASSWORD -ErrorAction SilentlyContinue
          $o=& $exe 2>&1; $c=$LASTEXITCODE
          if($c -ne 2 -or ($o -join "`n") -notmatch 'missing WOW112_PASSWORD'){ throw "missing-password fail-fast failed exit=$c output=$($o -join ' | ')" }
          $env:WOW112_PASSWORD='smoke-not-a-real-password'
          $env:WOW112_AUTH_ADDR='127.0.0.1:9'
          $o=& $exe 2>&1; $c=$LASTEXITCODE
          if($c -ne 2 -or ($o -join "`n") -notmatch 'auth connect .* failed'){ throw "local-refused startup path failed exit=$c output=$($o -join ' | ')" }
          Write-Host '[POC08-E-SMOKE] native fail-fast paths PASS'

      - name: Stage artifact
        shell: pwsh
        run: |
          $d='dist/poc08-e'
          New-Item -ItemType Directory -Force "$d/source" | Out-Null
          New-Item -ItemType Directory -Force "$d/runtime" | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/wow112-headless-android-probe.exe "$d/wow112-headless-windows.exe"
          Copy-Item probes/Wow112HeadlessAndroid/tools/RUN_POC08_E_BUYONE_WINDOWS.ps1 $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/RUN_POC08_E_SCAN_WINDOWS.ps1 $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/START_POC08_E_BUYONE_WINDOWS.bat $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/START_POC08_E_SCAN_WINDOWS.bat $d
          Copy-Item "$env:RUNNER_TEMP/poc08-cache.csv" "$d/runtime/DE_DISENCHANT_CACHE.csv"
          Copy-Item "$env:RUNNER_TEMP/poc08-unresolved.csv" "$d/runtime/DE_CACHE_UNRESOLVED.csv"
          Copy-Item probes/Wow112HeadlessAndroid/src/world_poc08_e_buyone.rs "$d/source/world_poc08_e_buyone.rs"
          Copy-Item probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs "$d/source/poc08_de_cache_generated.rs"
          $h=(Get-FileHash "$d/wow112-headless-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $info=@('POC=08-E-GUARDED-DE-BUY-ONE',"EXACT_SHA=$env:GITHUB_SHA","EXE_SHA256=$h",'MAX_PURCHASES=1','DEFAULT_MAX_SINGLE_BUY=5g','REVALIDATION=TARGETED_EXACT_NAME_AND_TUPLE','FINAL_SUCCESS=SERVER_ACK_AND_EXACT_NEW_MAIL_STACK','DIRTY_JOURNAL=FAIL_CLOSED','DE_UNKNOWN=FAIL_CLOSED','DE_DISTRIBUTION=REFERENCE_CLASSIC_NOT_OCTO_VERIFIED')
          $info | Set-Content "$d/BUILD_INFO.txt" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Windows-POC08-E-BUYONE-SMOKE-${{ github.sha }}
          path: dist/poc08-e
          if-no-files-found: error
