name: POC08-F0 DE Buy Eligibility Audit Windows

on:
  push:
    branches: [feature/windows-headless-ah-fast]
    paths:
      - 'probes/Wow112HeadlessAndroid/tools/poc08_live_item_ids_20261005.txt'
      - 'probes/Wow112HeadlessAndroid/tools/build_de_cache_poc08_provenance.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_de_cache_to_rust_provenance.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_economy_audit_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_reference_de_model_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_b_compile_fix.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_material_pricebook_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_risk_gate_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_provenance_audit_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/poc08_f0_eligibility_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/RUN_POC08_F0_ELIGIBILITY_WINDOWS.ps1'
      - 'probes/Wow112HeadlessAndroid/tools/START_POC08_F0_ELIGIBILITY_WINDOWS.bat'
      - '.github/workflows/build_windows_poc08_f0_eligibility_fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify live input
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/tools/poc08_live_item_ids_20261005.txt'
          $ids = Get-Content $p | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^\d+$' } | ForEach-Object { [int]$_ } | Sort-Object -Unique
          if ($ids.Count -ne 2343) { throw "expected 2343 unique live IDs, got $($ids.Count)" }
          Write-Host "[POC08-F0-CI] live input PASS count=$($ids.Count)"

      - name: Generate V5.3 base
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v4_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v2.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v5_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v4.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v52_turbo_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v5.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc07_de_v53_class_ceiling_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v52.rs probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build provenance cache
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/build_de_cache_poc08_provenance.py --seed-cache probes/Wow112HeadlessAndroid/tools/v52_seed_cache.csv --missing-ids probes/Wow112HeadlessAndroid/tools/v52_missing_item_ids.txt --output-cache "$env:RUNNER_TEMP/f0-base.csv" --unresolved "$env:RUNNER_TEMP/f0-base-unresolved.csv" --workers 16 --timeout 12 --retries 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/build_de_cache_poc08_provenance.py --seed-cache "$env:RUNNER_TEMP/f0-base.csv" --missing-ids probes/Wow112HeadlessAndroid/tools/v53_extra_item_ids.txt --output-cache "$env:RUNNER_TEMP/f0-mid.csv" --unresolved "$env:RUNNER_TEMP/f0-mid-unresolved.csv" --workers 8 --timeout 12 --retries 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/build_de_cache_poc08_provenance.py --seed-cache "$env:RUNNER_TEMP/f0-mid.csv" --missing-ids probes/Wow112HeadlessAndroid/tools/poc08_live_item_ids_20261005.txt --output-cache "$env:RUNNER_TEMP/f0-cache.csv" --unresolved "$env:RUNNER_TEMP/f0-unresolved.csv" --workers 32 --timeout 10 --retries 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_de_cache_to_rust_provenance.py --cache-csv "$env:RUNNER_TEMP/f0-cache.csv" --output-rs probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate POC08-F0 source
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/poc08_economy_audit_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_delive_v53.rs probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_reference_de_model_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_economy_audit.rs probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_b_compile_fix.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_material_pricebook_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_b_reference_compare.rs probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_risk_gate_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_c_pricebook.rs probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_provenance_audit_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_d_risk.rs probes/Wow112HeadlessAndroid/src/world_poc08_e_provenance.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/poc08_f0_eligibility_patch.py probes/Wow112HeadlessAndroid/src/world_poc08_e_provenance.rs probes/Wow112HeadlessAndroid/src/world_poc08_f0_eligibility.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select F0 entrypoint
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/src/main.rs'
          $t=Get-Content $p -Raw
          $t=$t.Replace('mod world_poc07_vendorlive;','mod world_poc08_f0_eligibility;')
          $t=$t.Replace('world_poc07_vendorlive::login_poc07_vendorlive','world_poc08_f0_eligibility::login_poc08_economy_audit')
          $t=$t.Replace('[POC07-LIVE]', '[POC08-F0]')
          $t=$t.Replace('POC-07 LIVE SESSION PASS', 'POC-08F0 ELIGIBILITY AUDIT SESSION PASS')
          $t=$t.Replace('POC-07 live vendor autobuy engine', 'POC-08F0 DE buy eligibility audit')
          Set-Content $p $t -Encoding utf8

      - name: Static read-only assertions
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/src/world_poc08_f0_eligibility.rs'
          $cache='probes/Wow112HeadlessAndroid/src/poc08_de_cache_generated.rs'
          foreach ($marker in @('hard read-only; BUY is disabled','mutation=DISABLED','POC08-F0','BUY_ELIGIBILITY_AUDIT')) {
            if (-not (Select-String -Path $p -Pattern $marker -SimpleMatch -Quiet)) { throw "missing F0 marker: $marker" }
          }
          if (Select-String -Path $p -Pattern 'POC06_CMSG_AUCTION_PLACE_BID_OPCODE' -SimpleMatch -Quiet) {
            Write-Host '[POC08-F0-CI] inherited opcode symbol present via included base source; runtime hard read-only assertion remains mandatory'
          }
          if (-not (Select-String -Path $cache -Pattern '20406 => Some\(0\)' -Quiet)) { throw 'Twilight regression missing' }
          Write-Host '[POC08-F0-CI] READ-ONLY ASSERTIONS PASS'

      - name: Build native Windows
        shell: pwsh
        run: cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release

      - name: Stage artifact
        shell: pwsh
        run: |
          $d='dist/poc08-f0'
          New-Item -ItemType Directory -Force "$d/runtime" | Out-Null
          New-Item -ItemType Directory -Force "$d/source" | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/wow112-headless-android-probe.exe "$d/wow112-headless-windows.exe"
          Copy-Item probes/Wow112HeadlessAndroid/tools/RUN_POC08_F0_ELIGIBILITY_WINDOWS.ps1 $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/START_POC08_F0_ELIGIBILITY_WINDOWS.bat $d
          Copy-Item "$env:RUNNER_TEMP/f0-cache.csv" "$d/runtime/DE_DISENCHANT_CACHE_WITH_SOURCE.csv"
          Copy-Item "$env:RUNNER_TEMP/f0-unresolved.csv" "$d/runtime/DE_CACHE_UNRESOLVED.csv"
          Copy-Item probes/Wow112HeadlessAndroid/src/world_poc08_f0_eligibility.rs "$d/source/world_poc08_f0_eligibility.rs"
          $h=(Get-FileHash "$d/wow112-headless-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          POC=08-F0-DE-BUY-ELIGIBILITY-AUDIT
          EXACT_SHA=$env:GITHUB_SHA
          BINARY_SHA256=$h
          MUTATION=DISABLED
          ZERO_BUY=YES
          LIVE_INPUT_IDS=2343
          F0_MIN_SAFE_PROFIT=5000
          F0_MIN_SAFE_ROI_BPS=5000
          F0_MAX_PLOSS_BPS=2000
          F0_MAX_MODEL_DISAGREEMENT_BPS=2500
          F0_MIN_EDGE_VS_VENDOR=2000
          F0_HARD_MAX_SINGLE_BUYOUT=50000
          "@ | Set-Content "$d/BUILD_INFO.txt" -Encoding utf8
          @'
          POC08-F0 is READ ONLY.
          It applies the proposed first DE BUY-ONE eligibility gates but never sends an AH mutation.
          Review POC08_F0_ELIGIBLE.csv before any future mutation build.
          '@ | Set-Content "$d/00_START_HERE.txt" -Encoding utf8

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Windows-POC08-F0-ELIGIBILITY-${{ github.sha }}
          path: dist/poc08-f0
          if-no-files-found: error
          retention-days: 7
