name: TEMP SummonScout P0.3b transform fix

on:
  push:
    branches:
      - 'tmp/summonscout-p03b-generator'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch and validate transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          transform_path = Path('tools/summonscout_hot_transform.py')
          text = transform_path.read_text(encoding='utf-8')
          pattern = re.compile(r'    event_anchor = \(.*?    s = _one\(s, event_anchor, event_rebind, "hot defaults before script swap"\)\n', re.S)
          replacement = '''    event_anchor = (\n        "W112_SUMMONSCOUT_CORE_API_NATIVE = true\\n\\n"\n        'frame:SetScript("OnEvent", function()\\n'\n    )\n    event_rebind = (\n        "W112_SUMMONSCOUT_CORE_API_NATIVE = true\\n\\n"\n        "-- PLAYER_LOGIN is not fired by an in-world hot execution. Re-apply\\n"\n        "-- defaults/migrations only for a real hot generation before scripts swap.\\n"\n        "if hotReload then EventAPI.setDefaults() end\\n\\n"\n        'frame:SetScript("OnEvent", function()\\n'\n    )\n    s = _one(s, event_anchor, event_rebind, "hot defaults after core-native API export")\n'''
          text, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'transform event anchor replacement count={count}')
          transform_path.write_text(text, encoding='utf-8')

          test_path = Path('tools/test_ai_summonscout_engine_v2_core_api_state.py')
          test = test_path.read_text(encoding='utf-8')
          if 'import importlib.util' not in test:
              test = test.replace('import unittest\n', 'import importlib.util\nimport unittest\n', 1)
          insert = '''\n    def test_hot_transform_accepts_core_native_export_anchor(self):\n        transform_path = ROOT / "tools" / "summonscout_hot_transform.py"\n        spec = importlib.util.spec_from_file_location("summonscout_hot_transform", transform_path)\n        module = importlib.util.module_from_spec(spec)\n        spec.loader.exec_module(module)\n        transformed = module.transform_core(CORE.read_bytes()).decode("utf-8")\n        self.assertIn("W112_SUMMONSCOUT_CORE_API_NATIVE = true", transformed)\n        self.assertIn("if hotReload then EventAPI.setDefaults() end", transformed)\n        self.assertLess(\n            transformed.index("W112_SUMMONSCOUT_CORE_API_NATIVE = true"),\n            transformed.index("if hotReload then EventAPI.setDefaults() end"),\n        )\n'''
          marker = '\n\nif __name__ == "__main__":\n'
          if 'test_hot_transform_accepts_core_native_export_anchor' not in test:
              if marker not in test:
                  raise SystemExit('test insertion marker missing')
              test = test.replace(marker, insert + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          python tools/test_ai_summonscout_engine_v2_core_api_state.py
          python -m py_compile tools/summonscout_hot_transform.py
      - name: Commit validated blobs and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wow112-ai-generator"
          git config user.email "github12wykrzyk@users.noreply.github.com"
          git rm .github/workflows/_tmp_summonscout_p03b_transformfix.yml
          git add tools/summonscout_hot_transform.py tools/test_ai_summonscout_engine_v2_core_api_state.py
          git commit -m "gen: validate P0.3b hot transform anchor"
          git push origin HEAD:refs/heads/tmp/summonscout-p03b-generator
