name: POC07 Vendor Capy Guard Windows

on:
  push:
    branches: [feature/windows-headless-ah-fast]
    paths:
      - 'probes/Wow112HeadlessAndroid/tools/vendor_capy_guard_patch.py'
      - 'probes/Wow112HeadlessAndroid/tools/RUN_VENDOR_CAPY_GUARD_WINDOWS.ps1'
      - 'probes/Wow112HeadlessAndroid/tools/START_VENDOR_CAPY_GUARD_WINDOWS.bat'
      - '.github/workflows/build_windows_poc07_vendor_capy_guard_fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Launcher self test
        shell: pwsh
        run: |
          & probes/Wow112HeadlessAndroid/tools/RUN_VENDOR_CAPY_GUARD_WINDOWS.ps1 -SelfTest

      - name: Generate guarded source
        shell: pwsh
        run: |
          python probes/Wow112HeadlessAndroid/tools/vendor_fullsweep_turbo_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive.rs probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_fullsweep.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python probes/Wow112HeadlessAndroid/tools/vendor_capy_guard_patch.py probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_fullsweep.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p='probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_fullsweep.rs'
          foreach ($m in @('CAPY_GUARD_BLOCKED','HARD POLICY PASS','EXACT TARGET PASS','CAPY_GUARD_MAX_BUYOUT_COPPER','CAPY_GUARD_MIN_PROFIT_COPPER')) {
            if (-not (Select-String -Path $p -SimpleMatch -Pattern $m -Quiet)) { throw "missing marker $m" }
          }

      - name: Select entrypoint
        shell: pwsh
        run: |
          $p='probes/Wow112HeadlessAndroid/src/main.rs'
          $t=Get-Content $p -Raw
          $t=$t.Replace('mod world_poc07_vendorlive;','mod world_poc07_vendorlive_fullsweep;')
          $t=$t.Replace('world_poc07_vendorlive::login_poc07_vendorlive','world_poc07_vendorlive_fullsweep::login_poc07_vendorlive_fullsweep')
          Set-Content $p $t -Encoding utf8

      - name: Build native Windows
        shell: pwsh
        run: cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --release

      - name: Stage artifact
        shell: pwsh
        run: |
          $d='dist/vendor-capy-guard'
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/wow112-headless-android-probe.exe "$d/wow112-headless-windows.exe"
          Copy-Item probes/Wow112HeadlessAndroid/src/world_poc07_vendorlive_fullsweep.rs $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/RUN_VENDOR_CAPY_GUARD_WINDOWS.ps1 $d
          Copy-Item probes/Wow112HeadlessAndroid/tools/START_VENDOR_CAPY_GUARD_WINDOWS.bat $d
          $h=(Get-FileHash "$d/wow112-headless-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "POC=POC07-VENDOR-CAPY-GUARD-V2`nEXACT_SHA=$env:GITHUB_SHA`nBINARY_SHA256=$h`nSTRATEGY=VENDOR_ONLY_HARD`nMIN_PROFIT_COPPER=2`nMAX_BUYOUT_COPPER=200000`nEXTERNAL_POLICY=ONE_REQUIRED_ANY_MISMATCH_VETO`nGUID_CACHE=YES`nLEDGER=YES`nHARD_MAX_PURCHASES=1`nFAIL_CLOSED=YES" | Set-Content "$d/BUILD_INFO.txt" -Encoding utf8
          'Run START_VENDOR_CAPY_GUARD_WINDOWS.bat. Vendor only, full sweep, >1c profit, <=20g buyout, external DB guard, exact-target BUY, max one purchase per process.' | Set-Content "$d/00_START_HERE.txt" -Encoding utf8

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WoW112-Windows-POC07-VENDOR-CAPY-GUARD-V2-${{ github.sha }}
          path: dist/vendor-capy-guard
          if-no-files-found: error
          retention-days: 7
