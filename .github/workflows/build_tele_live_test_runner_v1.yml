name: TELE live test runner V1.3 TELE06B LOGINWATCH

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tele06b-portal-completion-v1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply TELE-06A V4 runtime patch
        shell: pwsh
        run: ./tools/patch_tele06a_v4.ps1

      - name: Apply runner V1.1 runtime-state patch
        shell: pwsh
        run: ./tools/patch_live_runner_v11.ps1

      - name: Apply TELE-06A sequential party V1.2 patch
        shell: pwsh
        run: ./tools/patch_tele06a_party_seq_v12.ps1

      - name: Apply TELE-06B portal + completion runtime patch
        shell: pwsh
        run: ./tools/patch_tele06b_portal_v1.ps1

      - name: Apply 3s login watchdog
        shell: pwsh
        run: ./tools/patch_login_watchdog_3s.ps1

      - name: Party state machine unit tests (dependency-free)
        shell: pwsh
        run: |
          rustc --edition 2021 --test probes/Wow112HeadlessAndroid/src/tele_party_seq.rs -o $env:TEMP/tele_party_seq_test.exe
          & "$env:TEMP/tele_party_seq_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'party state machine tests failed' }

      - name: Apply runner V1.1 script patch
        shell: pwsh
        run: ./tools/patch_live_runner_script_v11.ps1

      - name: Apply TELE-06B runner V1.2 patch
        shell: pwsh
        run: ./tools/patch_tele06b_runner_v1.ps1

      - name: Apply runner V1.3 reconnect tolerance
        shell: pwsh
        run: ./tools/patch_runner_reconnect_tolerance_v13.ps1

      - name: Runner V1.3 parser self-test
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File probes/Wow112HeadlessAndroid/windows/LIVE_TEST_RUNNER.ps1 -SelfTest

      - name: Ritual V4 contract tests
        shell: pwsh
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: Check TELE06B acceptor
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime

      - name: Check summoner
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: Runtime startup smoke
        shell: pwsh
        run: |
          $bins = @(
            'probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe',
            'probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe'
          )
          foreach ($exe in $bins) {
            $out = Join-Path $env:TEMP ((Split-Path $exe -Leaf) + '.out')
            $err = Join-Path $env:TEMP ((Split-Path $exe -Leaf) + '.err')
            $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + (Get-Content $err -Raw -ErrorAction SilentlyContinue)
            if ($p.ExitCode -ne 2) { throw "expected rc=2 without credentials for $exe, got $($p.ExitCode)" }
            if ($text -notmatch 'missing WOW112_ACCOUNT') { throw "unexpected startup output for $exe : $text" }
          }
          Write-Host 'TELE LIVE TEST RUNNER V1.3 LOGINWATCH RUNTIME SMOKE PASS'

      - name: Stage runner bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe dist/tele06a_acceptor_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe dist/tele06a_ritual_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/windows/LIVE_TEST_RUNNER.ps1 dist/LIVE_TEST_RUNNER.ps1
          Copy-Item probes/Wow112HeadlessAndroid/windows/RUN_LIVE_TEST.cmd dist/RUN_LIVE_TEST.cmd
          Copy-Item probes/Wow112HeadlessAndroid/windows/LIVE_TEST_README.txt dist/00_README_FIRST.txt
          @"
          WoW112 TELE LOCAL LIVE TEST RUNNER V1.3 TELE06B LOGINWATCH
          Branch: $env:GITHUB_REF_NAME
          SHA: $env:GITHUB_SHA

          Frozen party baseline: a399268 (TELE-06A sequential party V1.2)
          TELE-06B behavior:
          - CUSTOMER octowar1/Smokinpole watches for server SMSG_SUMMON_REQUEST opcode 0x02AB
          - SLAVE1 octowinter1/Winterone performs one guarded CMSG_GAMEOBJ_USE on summoning portal
          - SLAVE2 octowinter2/Wintertwoo performs one guarded CMSG_GAMEOBJ_USE on summoning portal
          - portal identification requires gameobject entry 36727 or ritual type 18
          - mutation guard is committed before socket I/O; no automatic portal re-click
          - PASS requires both PORTAL_USED states plus CUSTOMER PASS_RITUAL_COMPLETE
          - PASS_RITUAL_STARTED is a checkpoint only, not a terminal success
          Login resilience V1.3:
          - AUTH TCP connect timeout: 3000 ms
          - WORLD TCP connect timeout: 3000 ms
          - AUTH/WORLD login I/O inactivity timeout before LOGIN_VERIFY_WORLD: 3000 ms
          - no extra reconnect sleep; failed login attempts recycle immediately after watchdog expiry
          - transient acceptor CONNECTING/ARMED before ROSTER_PASS is tolerated by runner
          - actual process EXIT remains terminal
          - sequential party engine and Ritual V4 mutation semantics remain unchanged
          - result is packed into LATEST_RESULT.zip
          - password remains excluded from result artifacts
          "@ | Set-Content -Encoding UTF8 dist/BUILD_INFO.txt

      - name: Bundle integrity smoke
        shell: pwsh
        run: |
          $required = @(
            'dist/tele06a_acceptor_runtime.exe',
            'dist/tele06a_ritual_runtime.exe',
            'dist/LIVE_TEST_RUNNER.ps1',
            'dist/RUN_LIVE_TEST.cmd',
            'dist/00_README_FIRST.txt',
            'dist/BUILD_INFO.txt'
          )
          foreach ($path in $required) { if (!(Test-Path $path)) { throw "missing staged file: $path" } }
          $runner = Get-Content dist/LIVE_TEST_RUNNER.ps1 -Raw
          foreach ($needle in @('READY 3/3','WOW112_RUNNER_STATE_FILE','WOW112_TELE06B_ROLE','PORTAL_USED','PASS_RITUAL_COMPLETE','FAIL_PORTAL_TIMEOUT','SMSG_SUMMON_REQUEST','V1.3 TELE06B LOGINWATCH')) {
            if ($runner -notmatch [regex]::Escape($needle)) { throw "runner marker missing: $needle" }
          }
          if ($runner -match 'FAIL_ACCEPTOR_LOST_DURING_HANDSHAKE') { throw 'obsolete pre-roster hard fail survived' }
          if ($runner -notmatch "WOW112_RECONNECT_DELAY_MS = '0'") { throw 'zero reconnect delay marker missing' }
          $ainfo = & strings.exe probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe 2>$null | Out-String
          $sinfo = & strings.exe probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe 2>$null | Out-String
          foreach ($needle in @('WOW112_RUNNER_STATE_FILE','WOW112_TELE06B_ROLE','PORTAL_USED','PASS_RITUAL_COMPLETE','SMSG_SUMMON_REQUEST','LOGIN-WATCHDOG')) {
            if ($ainfo -notmatch [regex]::Escape($needle)) { throw "acceptor runtime marker missing: $needle" }
          }
          foreach ($needle in @('PASS_RITUAL_STARTED','LOGIN-WATCHDOG')) {
            if ($sinfo -notmatch [regex]::Escape($needle)) { throw "summoner runtime marker missing: $needle" }
          }
          Write-Host 'TELE LIVE TEST RUNNER V1.3 LOGINWATCH BUNDLE INTEGRITY PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: WoW112_TELE_LIVE_TEST_RUNNER_V1_3_LOGINWATCH
          path: dist/*
          if-no-files-found: error
