name: TELE08 E integrated B-C-D-E CI

on:
  push:
    branches:
      - feature/tele08-e-integrated-live-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/src/lib.rs'
      - 'probes/Wow112HeadlessAndroid/src/destination_registry.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_bc_adapter.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_de_adapter.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele08_whisper_parser.rs'
      - 'probes/Wow112HeadlessAndroid/src/tele_response_engine.rs'
      - '.github/workflows/tele08_e_integrated_ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check carried Track E engine
        run: rustfmt --edition 2021 --check probes/Wow112HeadlessAndroid/src/tele_response_engine.rs
      - name: Check full headless crate
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
      - name: Test full headless crate
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml
