name: One-shot terminal win cache refresh

on:
  push:
    branches:
      - fix/updater-terminal-win-cache-refresh-v1
    paths:
      - '.github/workflows/one_shot_terminal_win_cache_refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/updater-terminal-win-cache-refresh-v1
          fetch-depth: 0

      - name: Patch source
        run: python tools/tmp_patch_terminal_cache_refresh.py

      - name: Verify source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- tools/updater/UpdaterWindowsTerminalPortalFeature.cs
          test "$(git diff --name-only -- tools/updater/UpdaterWindowsTerminalPortalFeature.cs)" = "tools/updater/UpdaterWindowsTerminalPortalFeature.cs"

      - name: Commit source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one_shot_terminal_win_cache_refresh.yml
          rm tools/tmp_patch_terminal_cache_refresh.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/updater/UpdaterWindowsTerminalPortalFeature.cs .github/workflows/one_shot_terminal_win_cache_refresh.yml tools/tmp_patch_terminal_cache_refresh.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 3
          git diff --cached --check -- tools/updater/UpdaterWindowsTerminalPortalFeature.cs
          git commit -m 'fix(updater): refresh terminal win worker by latest successful sha'
          git push origin HEAD:fix/updater-terminal-win-cache-refresh-v1
