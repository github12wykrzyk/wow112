name: Summon Service Packaging V1

on:
  push:
    branches:
      - 'feature/summon-service-packaging-v1'
    paths:
      - 'packaging/summon_service_v1/**'
      - '.github/workflows/summon_service_packaging_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summon-service-packaging-v1-${{ github.sha }}
  cancel-in-progress: true

jobs:
  packaging-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows packaging failure matrix
        shell: powershell
        run: .\packaging\summon_service_v1\tests\Invoke-PackagingTests.ps1 -SourceSha '${{ github.sha }}'

  demo-artifact:
    needs: packaging-tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build DEMO_ONLY fixture binaries
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'summon-demo-bin'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          @'
          using System; using System.IO; using System.Threading;
          class P { static string A(string[] a,string k){for(int i=0;i<a.Length-1;i++)if(a[i]==k)return a[i+1];return null;} static int Main(string[] a){var stop=A(a,"--stop-file");var health=A(a,"--health-file"); while(true){if(health!=null)File.WriteAllText(health,"{\"ready\":true,\"demo_only\":true}");if(stop!=null&&File.Exists(stop))return 0;Thread.Sleep(500);}}}
          '@ | Set-Content (Join-Path $out 'service.cs') -Encoding UTF8
          'class P { static int Main(string[] a){ return 0; } }' | Set-Content (Join-Path $out 'console.cs') -Encoding UTF8
          & $csc /nologo /target:exe /out:"$out\WoW112SummonService.exe" "$out\service.cs"
          if($LASTEXITCODE){exit $LASTEXITCODE}
          & $csc /nologo /target:exe /out:"$out\WoW112SummonOperatorConsole.exe" "$out\console.cs"
          if($LASTEXITCODE){exit $LASTEXITCODE}
          "BIN_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build one-click DEMO_ONLY ZIP and SHA256
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          .\packaging\summon_service_v1\scripts\Build-Package.ps1 -InputBinDir "$env:BIN_DIR" -SourceSha '${{ github.sha }}' -Version '1.0.0-demo.${{ github.run_number }}' -OutputZip "$pwd\artifacts\WoW112SummonServiceV1_DEMO_ONLY.zip" -DemoOnly
      - name: Verify inner ZIP digest and release manifest contract
        shell: powershell
        run: |
          $zip = "$pwd\artifacts\WoW112SummonServiceV1_DEMO_ONLY.zip"
          $sidecar = "$zip.sha256"
          $expected = ((Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){ throw "ZIP sidecar mismatch expected=$expected actual=$actual" }
          $root = Join-Path $env:RUNNER_TEMP 'Summon Service Package With Spaces'
          if(Test-Path $root){Remove-Item $root -Recurse -Force}
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          .\packaging\summon_service_v1\scripts\Verify-ReleaseContract.ps1 -PackageRoot $root -ExpectedSourceSha '${{ github.sha }}' -RequireDemoOnly
          "DEMO_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Operator launcher lifecycle smoke
        shell: powershell
        run: |
          $env:WOW112_PASSWORD='PACKAGING_WRAPPER_CANARY_SECRET'
          function Run-Cmd([string]$Name,[int]$Expected=0){
            & cmd.exe /d /c "`"$env:DEMO_ROOT\$Name`""
            $code=$LASTEXITCODE
            if($code -ne $Expected){throw "$Name exit=$code expected=$Expected"}
          }
          Run-Cmd 'START_SUMMON_SERVICE.cmd'
          Run-Cmd 'STATUS_SUMMON_SERVICE.cmd'
          Run-Cmd 'BACKUP_DATA.cmd'
          Run-Cmd 'STATUS_SUMMON_SERVICE.cmd'
          Run-Cmd 'OPEN_CONSOLE.cmd'
          Run-Cmd 'STOP_SUMMON_SERVICE.cmd'
          Run-Cmd 'OPEN_CONSOLE.cmd' 3
          $backups=@(Get-ChildItem -LiteralPath (Join-Path $env:DEMO_ROOT 'backups/data') -Filter '*.zip' -File)
          if($backups.Count -lt 1){throw 'safe backup launcher produced no backup'}
          $hits=Get-ChildItem -LiteralPath (Join-Path $env:DEMO_ROOT 'logs') -File -Recurse -ErrorAction SilentlyContinue | Select-String -SimpleMatch 'PACKAGING_WRAPPER_CANARY_SECRET' -ErrorAction SilentlyContinue
          if($hits){throw 'credential canary leaked to logs'}
      - uses: actions/upload-artifact@v4
        with:
          name: WoW112SummonServiceV1_DEMO_ONLY-${{ github.sha }}
          path: |
            artifacts/WoW112SummonServiceV1_DEMO_ONLY.zip
            artifacts/WoW112SummonServiceV1_DEMO_ONLY.zip.sha256
          if-no-files-found: error
