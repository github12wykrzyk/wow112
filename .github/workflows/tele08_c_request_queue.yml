name: TELE08 C request queue

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tele08-c-request-queue-v1
    paths:
      - 'probes/Wow112HeadlessAndroid/tele08_request_queue/**'
      - '.github/workflows/tele08_c_request_queue.yml'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: probes/Wow112HeadlessAndroid/tele08_request_queue
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/tele08-c-request-queue-v1
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Canonical rustfmt
        run: cargo fmt
      - name: Commit canonical formatting if needed
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git add probes/Wow112HeadlessAndroid/tele08_request_queue/src/lib.rs \
                  probes/Wow112HeadlessAndroid/tele08_request_queue/tests/queue_contract.rs
          if git diff --cached --quiet; then
            echo 'rustfmt already canonical'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'TELE08 C: apply canonical rustfmt'
            git push origin HEAD:feature/tele08-c-request-queue-v1
          fi
      - name: cargo check
        run: cargo check --all-targets
      - name: cargo test
        run: cargo test --all-targets
