name: One-shot Stealth5 EXE argfix

on:
  push:
    branches: [work]
    paths:
      - tools/patch_stealth5_exe_argfix.py
      - .github/workflows/one_shot_stealth5_exe_argfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch active WoW.exe and metadata
        run: python tools/patch_stealth5_exe_argfix.py

      - name: Fast repository verification
        run: python tools/verify_current.py

      - name: Commit patched EXE to work and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one_shot_stealth5_exe_argfix.yml
          git add WoW_5875_BASE_MELEE_300YD_PP_BYPASS_STEALTH5_HARD.exe CURRENT.json runtime/current.json manifests/SHA256SUMS_WORK.txt
          git diff --cached --check
          git commit -m "fix: harden Stealth cooldown 5s in EXE"
          git push origin HEAD:work
