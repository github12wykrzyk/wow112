name: AH history terminal live archive
on:
  push:
    branches:
      - dev/windows-ah-canonical
      - feature/ah-history-shadow-canonical
    paths:
      - '.github/workflows/ah_history_terminal_live_v0.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ah-history-octowar1-live
  cancel-in-progress: true
jobs:
  live:
    # Manual dispatch remains the default. A push may run only with the explicit
    # one-shot commit marker below; ordinary code pushes never log in.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_REAL_SHADOW_ONCE]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build read-only terminal with explicit AH target
        run: cargo build --locked --release --manifest-path src/AhHistoryTerminal/Cargo.toml --target i686-pc-windows-msvc
      - name: Verify offline suite before live connection
        env:
          WOW112_HISTORY_BINARY: src/AhHistoryTerminal/target/i686-pc-windows-msvc/release/wow112-ah-history.exe
        run: python src/AhHistoryTerminal/test_autonomous.py src/AhHistoryTerminal/offline-live-gate
      - name: Capture one full AH scan and verify SQLite round trip
        env:
          WOW112_PASSWORD: ${{ secrets.WOW112_PASSWORD }}
          WOW112_HISTORY_BINARY: src/AhHistoryTerminal/target/i686-pc-windows-msvc/release/wow112-ah-history.exe
        run: python src/AhHistoryTerminal/run_live_validation.py src/AhHistoryTerminal/live-results
      - name: Verify archive publisher offline
        if: ${{ !cancelled() }}
        run: python src/AhHistoryTerminal/test_github_archive.py
      - name: Publish and remotely verify immutable observation bundle
        if: ${{ !cancelled() && hashFiles('src/AhHistoryTerminal/live-results/bundles/**/manifest.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/AhHistoryTerminal/github_archive.py publish-run src/AhHistoryTerminal/live-results
      - name: Retain bundle and outbox for upload recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ah-history-archive-recovery-${{ github.run_id }}
          path: |
            src/AhHistoryTerminal/live-results/bundles/
            src/AhHistoryTerminal/live-results/capture/
            src/AhHistoryTerminal/live-results/archive-outbox.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload sanitized validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ah-history-live-v0-summary
          path: src/AhHistoryTerminal/live-results/LIVE_VALIDATION_SUMMARY.json
          if-no-files-found: warn
          retention-days: 7
