name: TELE10 headless trade compile linux
on:
  push:
    branches:
      - 'feature/tele10-headless-trade-payment-ledger-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source integration in workspace
        run: python .github/scripts/tele10_headless_trade_patch.py
      - name: Format check
        run: |
          rustfmt --edition 2021 --check probes/Wow112HeadlessAndroid/src/tele10_trade_payment.rs probes/Wow112HeadlessAndroid/src/tele10_trade_receiver_runtime.rs probes/Wow112HeadlessAndroid/src/tele10_payer_roster_runtime.rs probes/Wow112HeadlessAndroid/src/tele10_payer_driver_runtime.rs probes/Wow112HeadlessAndroid/src/tele10_message_audit_tests.rs probes/Wow112HeadlessAndroid/src/bin/tele10_ledger.rs probes/Wow112HeadlessAndroid/src/bin/tele06a_acceptor_runtime.rs probes/Wow112HeadlessAndroid/src/bin/tele06a_ritual_runtime.rs probes/Wow112HeadlessAndroid/src/bin/tele07_supervisor.rs
      - name: Library tests
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --lib -- --nocapture
      - name: Runtime tests
        run: |
          cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime -- --nocapture
          cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime -- --nocapture
          cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele07_supervisor -- --nocapture
      - name: Build query CLI
        run: cargo build --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele10_ledger
