name: TELE06C V1.6 auto-position contract

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tele06c-auto-position-v1

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply TELE-06A V4 runtime patch
        shell: pwsh
        run: ./tools/patch_tele06a_v4.ps1

      - name: Apply runner V1.1 runtime-state patch
        shell: pwsh
        run: ./tools/patch_live_runner_v11.ps1

      - name: Apply TELE-06A sequential party V1.2 patch
        shell: pwsh
        run: ./tools/patch_tele06a_party_seq_v12.ps1

      - name: Apply TELE-06B portal completion patch
        shell: pwsh
        run: ./tools/patch_tele06b_portal_v1.ps1

      - name: Apply 3s login watchdog
        shell: pwsh
        run: ./tools/patch_login_watchdog_3s.ps1

      - name: Apply frozen V1.5 range-safe patch
        shell: pwsh
        run: ./tools/patch_tele06b_range_safe_v15.ps1

      - name: Apply TELE06C V1.6 bounded auto-position patch
        shell: pwsh
        run: ./tools/patch_tele06c_auto_position_v16.ps1

      - name: V1.6 acceptor contract tests
        shell: pwsh
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime

      - name: Apply runner V1.1 script patch
        shell: pwsh
        run: ./tools/patch_live_runner_script_v11.ps1

      - name: Apply TELE-06B runner V1.2 patch
        shell: pwsh
        run: ./tools/patch_tele06b_runner_v1.ps1

      - name: Apply runner V1.3 reconnect tolerance
        shell: pwsh
        run: ./tools/patch_runner_reconnect_tolerance_v13.ps1

      - name: Apply frozen runner V1.5 semantics
        shell: pwsh
        run: ./tools/patch_tele06b_runner_v15.ps1

      - name: Apply TELE06C V1.6 runner states
        shell: pwsh
        run: ./tools/patch_tele06c_runner_v16.ps1

      - name: Runner V1.6 parser self-test
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File probes/Wow112HeadlessAndroid/windows/LIVE_TEST_RUNNER.ps1 -SelfTest

      - name: Check V1.6 acceptor
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime

      - name: Check summoner regression
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: V1.6 marker smoke
        shell: pwsh
        run: |
          $src = Get-Content probes/Wow112HeadlessAndroid/src/bin/tele06a_acceptor_runtime.rs -Raw
          foreach ($needle in @('TELE06C_HEARTBEAT_OPCODE','TELE06C_TARGET_RANGE','TELE06C_MAX_RECOVERY_MOVE','FAIL_AUTO_POSITION_LIMIT','FAIL_AUTO_POSITION_UNCERTAIN','TELE06C_MOVE_MUTATION_UNCERTAIN','[TELE-06C-MOVE-TX]')) {
            if ($src -notmatch [regex]::Escape($needle)) { throw "missing V1.6 runtime marker: $needle" }
          }
          $runner = Get-Content probes/Wow112HeadlessAndroid/windows/LIVE_TEST_RUNNER.ps1 -Raw
          foreach ($needle in @('AUTO_POSITIONING','AUTO_POSITION_SENT','FAIL_AUTO_POSITION_LIMIT','FAIL_AUTO_POSITION_UNCERTAIN','V1.6 TELE06C AUTO-POSITION')) {
            if ($runner -notmatch [regex]::Escape($needle)) { throw "missing V1.6 runner marker: $needle" }
          }
          Write-Host 'TELE06C V1.6 CONTRACT PASS'

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: Runtime startup smoke
        shell: pwsh
        run: |
          $bins = @(
            'probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe',
            'probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe'
          )
          foreach ($exe in $bins) {
            $out = Join-Path $env:TEMP ((Split-Path $exe -Leaf) + '.out')
            $err = Join-Path $env:TEMP ((Split-Path $exe -Leaf) + '.err')
            $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + (Get-Content $err -Raw -ErrorAction SilentlyContinue)
            if ($p.ExitCode -ne 2) { throw "expected rc=2 without credentials for $exe, got $($p.ExitCode)" }
            if ($text -notmatch 'missing WOW112_ACCOUNT') { throw "unexpected startup output for $exe : $text" }
          }
          Write-Host 'TELE06C V1.6 RUNTIME STARTUP SMOKE PASS'

      - name: Stage V1.6 live runner bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe dist/tele06a_acceptor_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe dist/tele06a_ritual_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/windows/LIVE_TEST_RUNNER.ps1 dist/LIVE_TEST_RUNNER.ps1
          Copy-Item probes/Wow112HeadlessAndroid/windows/RUN_LIVE_TEST.cmd dist/RUN_LIVE_TEST.cmd
          @'
          WoW112 TELE LOCAL LIVE TEST RUNNER V1.6 TELE06C AUTO-POSITION

          Purpose:
          - preserves frozen V1.5 range-safe portal completion core;
          - adds bounded short-distance recovery movement for clickers that are just outside portal range.

          Safety / bounds:
          - target portal distance: 4.8 yd;
          - maximum total recovery movement: 3.0 yd;
          - maximum individual movement step: 1.25 yd;
          - step delay: 120 ms;
          - maximum vertical delta: 2.0 yd;
          - movement uses vanilla MSG_MOVE_HEARTBEAT opcode 0x00EE;
          - movement attempt is one-shot guarded;
          - uncertain movement write never auto-retries/reconnects;
          - excessive distance / vertical delta fails closed before portal click;
          - final summon success still requires CUSTOMER SMSG_SUMMON_REQUEST/0x02AB.

          Expected new states:
          AUTO_POSITIONING
          AUTO_POSITION_SENT
          FAIL_AUTO_POSITION_LIMIT
          FAIL_AUTO_POSITION_UNCERTAIN
          FAIL_AUTO_POSITION_ALREADY_ATTEMPTED

          Run:
          1. Extract the complete ZIP.
          2. Run RUN_LIVE_TEST.cmd.
          3. Do not manually click/move the test characters during the run.
          4. After completion upload LATEST_RESULT.zip for analysis.
          '@ | Set-Content -Encoding UTF8 dist/00_README_FIRST.txt
          @"
          WoW112 TELE V1.6 TELE06C AUTO-POSITION
          Branch: $env:GITHUB_REF_NAME
          SHA: $env:GITHUB_SHA
          Frozen baseline: baseline/tele06b-v15-range-safe-green-20261006 @ 5f979b165fa0fa7b6208d2595411f9f7c0fa584a
          V1.6 bounded movement: target=4.8yd max_total=3.0yd max_step=1.25yd step_delay=120ms max_dz=2.0yd opcode=0x00EE
          "@ | Set-Content -Encoding UTF8 dist/BUILD_INFO.txt

      - name: Bundle integrity smoke
        shell: pwsh
        run: |
          $required = @(
            'dist/tele06a_acceptor_runtime.exe',
            'dist/tele06a_ritual_runtime.exe',
            'dist/LIVE_TEST_RUNNER.ps1',
            'dist/RUN_LIVE_TEST.cmd',
            'dist/00_README_FIRST.txt',
            'dist/BUILD_INFO.txt'
          )
          foreach ($path in $required) { if (!(Test-Path $path)) { throw "missing staged file: $path" } }
          $runner = Get-Content dist/LIVE_TEST_RUNNER.ps1 -Raw
          foreach ($needle in @('PORTAL_USE_SENT','PASS_RITUAL_COMPLETE','AUTO_POSITIONING','AUTO_POSITION_SENT','FAIL_AUTO_POSITION_LIMIT','FAIL_AUTO_POSITION_UNCERTAIN','V1.6 TELE06C AUTO-POSITION')) {
            if ($runner -notmatch [regex]::Escape($needle)) { throw "runner marker missing: $needle" }
          }
          $readme = Get-Content dist/00_README_FIRST.txt -Raw
          foreach ($needle in @('V1.6 TELE06C AUTO-POSITION','maximum total recovery movement: 3.0 yd','MSG_MOVE_HEARTBEAT opcode 0x00EE','LATEST_RESULT.zip')) {
            if ($readme -notmatch [regex]::Escape($needle)) { throw "README marker missing: $needle" }
          }
          $ainfo = & strings.exe probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe 2>$null | Out-String
          foreach ($needle in @('TELE06C_HEARTBEAT_OPCODE','FAIL_AUTO_POSITION_LIMIT','FAIL_AUTO_POSITION_UNCERTAIN','TELE06C_MOVE_MUTATION_UNCERTAIN','TELE-06C-MOVE-TX','PORTAL_USE_SENT','SMSG_SUMMON_REQUEST')) {
            if ($ainfo -notmatch [regex]::Escape($needle)) { throw "acceptor binary marker missing: $needle" }
          }
          Write-Host 'TELE06C V1.6 BUNDLE INTEGRITY PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: WoW112_TELE_LIVE_TEST_RUNNER_V1_6_TELE06C_AUTO_POSITION
          path: dist/*
          if-no-files-found: error
