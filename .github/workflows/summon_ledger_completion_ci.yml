name: Summon Ledger Completion CI

on:
  push:
    branches:
      - feature/summon-ledger-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run all Summon Ledger tests
        run: python -m unittest discover -s services/summon_ledger/tests -v
      - name: CLI help smoke
        run: python -m services.summon_ledger --help
