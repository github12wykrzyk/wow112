name: Publish WoW112 AH DE Latest Release

on:
  push:
    branches: [dev/windows-ah-de-liquidation-v3]
    paths:
      - 'packaging/ah_latest/**'
      - '.github/workflows/publish_ah_de_latest_release.yml'
  workflow_run:
    workflows: ['WoW112 AH DE Liquidation V3.1 Windows']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'dev/windows-ah-de-liquidation-v3')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest successful DE build
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "/repos/$REPO/actions/workflows/build_windows_ah_de_liquidation_v3.yml/runs?branch=dev/windows-ah-de-liquidation-v3&status=success&per_page=10" --jq '.workflow_runs[0].id')
          HEAD_SHA=$(gh api "/repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha')
          ART_NAME=$(gh api "/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("WoW112-AH-DE-LIQUIDATION-V31-WINDOWS-")) | .name' | head -n1)
          if [[ -z "$RUN_ID" || -z "$ART_NAME" ]]; then
            echo 'No usable latest DE artifact found.' >&2
            exit 2
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ART_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved run=$RUN_ID sha=$HEAD_SHA artifact=$ART_NAME"

      - name: Download latest DE artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          ART_NAME: ${{ steps.resolve.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p payload
          gh run download "$RUN_ID" --repo "$REPO" --name "$ART_NAME" --dir payload
          test -n "$(find payload -type f -name '*.exe' -print -quit)"

      - name: Build stable rolling release asset
        shell: bash
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          ART_NAME: ${{ steps.resolve.outputs.artifact_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('payload')
          out=Path('WoW112_DE_LATEST.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root))
          PY
          SHA=$(sha256sum WoW112_DE_LATEST.zip | awk '{print $1}')
          {
            echo "CHANNEL=ah-de-latest"
            echo "RUN_ID=$RUN_ID"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "ARTIFACT_NAME=$ART_NAME"
            echo "ZIP_SHA256=$SHA"
          } > WoW112_DE_LATEST.txt
          cat WoW112_DE_LATEST.txt

      - name: Publish or replace rolling GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          if gh release view ah-de-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release upload ah-de-latest WoW112_DE_LATEST.zip WoW112_DE_LATEST.txt --repo "$REPO" --clobber
          else
            gh release create ah-de-latest WoW112_DE_LATEST.zip WoW112_DE_LATEST.txt --repo "$REPO" --target "$HEAD_SHA" --title 'WoW112 AH DE Latest' --notes 'Rolling public DE Lab build. Asset is replaced after every successful DE build.' --prerelease
          fi
