name: Target compile summon hotfix

on:
  push:
    branches:
      - feature/summon-slave1-5-silithus-hotfix-v1
    paths:
      - TARGET_COMPILE_SUMMON_HOTFIX.txt

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Verify source contract
        shell: pwsh
        run: |
          python tools/verify_parallel_gui_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'parallel GUI contract failed' }
      - name: Compile changed native modules x86
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from build_active_module import build_one
          out = Path('target-build')
          out.mkdir(exist_ok=True)
          rows = [
              ('src/AutoSummonAssist/WoWAutoSummonAssist_5875_v1.c', 'WoWAutoSummonAssist_5875_v1.dll'),
              ('src/WoWPlayerESP/WoWPlayerESP_v1_3_CHALLENGES.c', 'WoWPlayerESP_v1_2_range_sweep.dll'),
          ]
          for source, dll in rows:
              src = Path(source)
              dst = out / dll
              obj = dst.with_suffix('.obj')
              timing, pe = build_one('clangcl_i686_win32imports', src, obj, dst)
              if pe.get('machine_hex') != '0x014C' or pe.get('entrypoint_rva') == 0:
                  raise SystemExit(f'{dll}: PE32/x86 verification failed: {pe}')
              print(f'TARGET_COMPILE_PASS {dll} size={dst.stat().st_size} machine={pe.get("machine_hex")} entry={pe.get("entrypoint_rva")}')
          '@ | Set-Content -Path target_compile.py -Encoding UTF8
          python target_compile.py
          if ($LASTEXITCODE -ne 0) { throw 'target native compile failed' }
      - name: Upload target DLLs
        uses: actions/upload-artifact@v4
        with:
          name: summon-hotfix-target-dlls
          path: target-build/*.dll
          if-no-files-found: error
