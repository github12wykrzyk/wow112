name: TELE live test runner V1.5 TELE06B RANGE SAFE

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tele06b-portal-completion-v1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply TELE-06A V4 runtime patch
        shell: pwsh
        run: ./tools/patch_tele06a_v4.ps1

      - name: Apply runner V1.1 runtime-state patch
        shell: pwsh
        run: ./tools/patch_live_runner_v11.ps1

      - name: Apply TELE-06A sequential party V1.2 patch
        shell: pwsh
        run: ./tools/patch_tele06a_party_seq_v12.ps1

      - name: Apply TELE-06B portal + completion runtime patch
        shell: pwsh
        run: ./tools/patch_tele06b_portal_v1.ps1

      - name: Apply 3s login watchdog
        shell: pwsh
        run: ./tools/patch_login_watchdog_3s.ps1

      - name: Apply TELE-06B V1.5 range-safe runtime hardening
        shell: pwsh
        run: ./tools/patch_tele06b_range_safe_v15.ps1

      - name: Party state machine unit tests
        shell: pwsh
        run: |
          rustc --edition 2021 --test probes/Wow112HeadlessAndroid/src/tele_party_seq.rs -o $env:TEMP/tele_party_seq_test.exe
          & "$env:TEMP/tele_party_seq_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'party state machine tests failed' }

      - name: TELE-06B trace unit tests
        shell: pwsh
        run: |
          rustc --edition 2021 --test probes/Wow112HeadlessAndroid/src/tele_trace.rs -o $env:TEMP/tele_trace_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'tele_trace test build failed' }
          & "$env:TEMP/tele_trace_test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'tele_trace tests failed' }

      - name: TELE-06B V1.5 acceptor contract tests
        shell: pwsh
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime

      - name: Apply runner V1.1 script patch
        shell: pwsh
        run: ./tools/patch_live_runner_script_v11.ps1

      - name: Apply TELE-06B runner V1.2 patch
        shell: pwsh
        run: ./tools/patch_tele06b_runner_v1.ps1

      - name: Apply runner V1.3 reconnect tolerance
        shell: pwsh
        run: ./tools/patch_runner_reconnect_tolerance_v13.ps1

      - name: Apply runner V1.5 range-safe semantics
        shell: pwsh
        run: ./tools/patch_tele06b_runner_v15.ps1

      - name: Apply V1.5 range-safe README
        shell: pwsh
        run: ./tools/patch_tele06b_readme_v15.ps1

      - name: Runner V1.5 parser self-test
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File probes/Wow112HeadlessAndroid/windows/LIVE_TEST_RUNNER.ps1 -SelfTest

      - name: Ritual V4 contract tests
        shell: pwsh
        run: cargo test --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: Check TELE06B acceptor
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime

      - name: Check summoner
        shell: pwsh
        run: cargo check --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_acceptor_runtime
          cargo build --release --manifest-path probes/Wow112HeadlessAndroid/Cargo.toml --bin tele06a_ritual_runtime

      - name: Runtime startup smoke
        shell: pwsh
        run: |
          $bins = @(
            'probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe',
            'probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe'
          )
          foreach ($exe in $bins) {
            $out = Join-Path $env:TEMP ((Split-Path $exe -Leaf) + '.out')
            $err = Join-Path $env:TEMP ((Split-Path $exe -Leaf) + '.err')
            $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $text = (Get-Content $out -Raw -ErrorAction SilentlyContinue) + (Get-Content $err -Raw -ErrorAction SilentlyContinue)
            if ($p.ExitCode -ne 2) { throw "expected rc=2 without credentials for $exe, got $($p.ExitCode)" }
            if ($text -notmatch 'missing WOW112_ACCOUNT') { throw "unexpected startup output for $exe : $text" }
          }
          Write-Host 'TELE LIVE TEST RUNNER V1.5 RANGE-SAFE RUNTIME SMOKE PASS'

      - name: Stage runner bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe dist/tele06a_acceptor_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe dist/tele06a_ritual_runtime.exe
          Copy-Item probes/Wow112HeadlessAndroid/windows/LIVE_TEST_RUNNER.ps1 dist/LIVE_TEST_RUNNER.ps1
          Copy-Item probes/Wow112HeadlessAndroid/windows/RUN_LIVE_TEST.cmd dist/RUN_LIVE_TEST.cmd
          Copy-Item probes/Wow112HeadlessAndroid/windows/LIVE_TEST_README.txt dist/00_README_FIRST.txt
          @"
          WoW112 TELE LOCAL LIVE TEST RUNNER V1.5 TELE06B RANGE-SAFE
          Branch: $env:GITHUB_REF_NAME
          SHA: $env:GITHUB_SHA

          Proven live baseline:
          - V1.4 completed a real terminal-only summon and CUSTOMER received SMSG_SUMMON_REQUEST/0x02AB.
          - Failed A/B geometry: clickers were 6.651 / 6.697 yd from portal and got no server-side ritual response.
          - Passing A/B geometry: clickers were 0.195 / 0.263 yd from portal and summon completed.

          V1.5 hardening:
          - clicker XYZ is captured from server SMSG_LOGIN_VERIFY_WORLD.
          - portal XYZ is captured from server CreateObject movement block.
          - 3D distance is checked BEFORE mutation guard commitment and BEFORE CMSG_GAMEOBJ_USE.
          - default runner max range is 5.8 yd (configurable through WOW112_TELE06B_MAX_RANGE).
          - out of range => FAIL_PORTAL_OUT_OF_RANGE, no click sent, mutation guard not consumed.
          - missing coordinate => FAIL_PORTAL_RANGE_UNKNOWN, no click sent, mutation guard not consumed.
          - SLAVE1 settles 150 ms after portal detection; SLAVE2 settles 300 ms to remove the observed near-simultaneous/sub-20ms race.
          - socket-write state is PORTAL_USE_SENT, not PORTAL_USED. Server acceptance is not inferred from write success.
          - final PASS still requires CUSTOMER PASS_RITUAL_COMPLETE from SMSG_SUMMON_REQUEST/0x02AB.
          - no automatic portal re-click and no movement automation in V1.5.

          Preserved safeguards:
          - mutation guard is committed before socket I/O once all pre-send gates pass.
          - uncertain write never auto-retries.
          - login watchdog/reconnect behavior from V1.3 remains active.
          - V1.4 packet trace diagnostics remain active.
          - password remains excluded from result artifacts.
          "@ | Set-Content -Encoding UTF8 dist/BUILD_INFO.txt

      - name: Bundle integrity smoke
        shell: pwsh
        run: |
          $required = @(
            'dist/tele06a_acceptor_runtime.exe',
            'dist/tele06a_ritual_runtime.exe',
            'dist/LIVE_TEST_RUNNER.ps1',
            'dist/RUN_LIVE_TEST.cmd',
            'dist/00_README_FIRST.txt',
            'dist/BUILD_INFO.txt'
          )
          foreach ($path in $required) { if (!(Test-Path $path)) { throw "missing staged file: $path" } }
          $runner = Get-Content dist/LIVE_TEST_RUNNER.ps1 -Raw
          foreach ($needle in @('READY 3/3','WOW112_RUNNER_STATE_FILE','WOW112_TELE06B_ROLE','PORTAL_USE_SENT','PASS_RITUAL_COMPLETE','FAIL_PORTAL_OUT_OF_RANGE','FAIL_PORTAL_RANGE_UNKNOWN','SMSG_SUMMON_REQUEST','V1.5 TELE06B RANGE-SAFE')) {
            if ($runner -notmatch [regex]::Escape($needle)) { throw "runner marker missing: $needle" }
          }
          if ($runner -match 'PORTAL_USED') { throw 'legacy PORTAL_USED state survived in runner' }
          if ($runner -match 'FAIL_ACCEPTOR_LOST_DURING_HANDSHAKE') { throw 'obsolete pre-roster hard fail survived' }
          if ($runner -notmatch "WOW112_RECONNECT_DELAY_MS = '0'") { throw 'zero reconnect delay marker missing' }
          $readme = Get-Content dist/00_README_FIRST.txt -Raw
          foreach ($needle in @('V1.5 TELE06B RANGE-SAFE','PORTAL_USE_SENT','FAIL_PORTAL_OUT_OF_RANGE','FAIL_PORTAL_RANGE_UNKNOWN','WOW112_TELE06B_MAX_RANGE=5.8','does NOT move a clicker into range')) {
            if ($readme -notmatch [regex]::Escape($needle)) { throw "V1.5 README marker missing: $needle" }
          }
          if ($readme -match 'Each slave must reach PORTAL_USED') { throw 'stale V1.4 README semantics survived' }
          $ainfo = & strings.exe probes/Wow112HeadlessAndroid/target/release/tele06a_acceptor_runtime.exe 2>$null | Out-String
          $sinfo = & strings.exe probes/Wow112HeadlessAndroid/target/release/tele06a_ritual_runtime.exe 2>$null | Out-String
          foreach ($needle in @('WOW112_RUNNER_STATE_FILE','WOW112_TELE06B_ROLE','WOW112_TELE06B_MAX_RANGE','WOW112_TELE06B_CLICK_SETTLE_MS','PORTAL_USE_SENT','FAIL_PORTAL_OUT_OF_RANGE','FAIL_PORTAL_RANGE_UNKNOWN','PASS_RITUAL_COMPLETE','SMSG_SUMMON_REQUEST','TELE-06B-RANGE','T6B-RX','T6B-CLICK-TX','TELE-06B-PORTAL-OUTCOME')) {
            if ($ainfo -notmatch [regex]::Escape($needle)) { throw "acceptor runtime marker missing: $needle" }
          }
          foreach ($needle in @('PASS_RITUAL_STARTED','LOGIN-WATCHDOG','T6B-RX','T6B-SUMMARY')) {
            if ($sinfo -notmatch [regex]::Escape($needle)) { throw "summoner runtime marker missing: $needle" }
          }
          Write-Host 'TELE LIVE TEST RUNNER V1.5 RANGE-SAFE BUNDLE INTEGRITY PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: WoW112_TELE_LIVE_TEST_RUNNER_V1_5_TELE06B_RANGE_SAFE
          path: dist/*
          if-no-files-found: error
