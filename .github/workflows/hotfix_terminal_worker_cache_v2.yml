name: Hotfix TERMINAL WIN worker v2 cache refresh

on:
  push:
    branches:
      - parallel
    paths:
      - '.github/workflows/hotfix_terminal_worker_cache_v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Force one-time native worker v2 refresh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'tools/updater/UpdaterWindowsTerminalPortalFeature.cs'
          $text = Get-Content $path -Raw
          $old = 'var companionDir = Path.Combine(configDir, "companions", "windows-portal");'
          $new = 'var companionDir = Path.Combine(configDir, "companions", "windows-portal-v2");'
          if (-not $text.Contains($old)) { throw 'Worker cache path anchor not found' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding UTF8

      - name: Commit patch and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/updater/UpdaterWindowsTerminalPortalFeature.cs
          git rm .github/workflows/hotfix_terminal_worker_cache_v2.yml
          git commit -m "fix(updater): force stop-safe native worker v2 cache refresh"
          git push origin HEAD:parallel
